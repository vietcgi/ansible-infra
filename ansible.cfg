[defaults]
# Core Configuration
inventory           = inventories/
host_key_checking   = False
deprecation_warnings = False
gathering           = smart
fact_caching        = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Performance & Behavior
forks               = 10
timeout             = 30
log_path            = /tmp/ansible.log
force_color         = True
force_handlers      = True
become_ask_pass     = False
callback_whitelist  = profile_tasks, timer, yaml

# Collections & Roles
# Uses default: ~/.ansible/collections:/usr/share/ansible/collections
roles_path          = ./roles:~/.ansible/roles:/usr/share/ansible/roles

# Dynamic Inventory Plugins
# Note: Some plugins require collection installation:
#   ansible-galaxy collection install hetzner.hcloud
#   ansible-galaxy collection install community.digitalocean
#   ansible-galaxy collection install vultr.cloud
[inventory]
enable_plugins      = auto, yaml, ini, script, host_list, amazon.aws.aws_ec2, community.proxmox.proxmox, community.general.linode, hetzner.hcloud.hcloud, community.digitalocean.digitalocean, vultr.cloud.vultr

# SSH Configuration
[ssh_connection]
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=publickey
control_path        = /tmp/ansible-ssh-%%h-%%p-%%r
pipelining          = True
private_key_file    = ~/.ssh/id_rsa

# Privilege Escalation
[privilege_escalation]
become              = False
become_method       = sudo
become_user         = root
allow_world_readable_tmpfiles = True
