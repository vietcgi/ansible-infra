---
# Ansible Collections Requirements
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # Grafana - Official collection for Grafana automation
  # Collection: grafana.grafana (grafana-ansible-collection)
  # Provides: grafana role for installation and dashboards
  - name: grafana.grafana
    version: ">=6.0.6"
    source: https://galaxy.ansible.com

  # Prometheus - Prometheus Community Collection
  # Collection: prometheus.prometheus
  # Provides: prometheus, alertmanager, node_exporter, and 25+ other roles
  # Roles used: prometheus, alertmanager, node_exporter
  - name: prometheus.prometheus
    version: ">=0.20.0"
    source: https://galaxy.ansible.com

  # Community Collections
  - name: community.general
    version: ">=7.0.0"
    source: https://galaxy.ansible.com

  - name: ansible.posix
    version: ">=1.5.0"
    source: https://galaxy.ansible.com

  # Docker/Container
  - name: community.docker
    version: ">=3.0.0"
    source: https://galaxy.ansible.com

  # Database collections
  - name: community.mysql
    version: ">=3.0.0"
    source: https://galaxy.ansible.com

  - name: community.postgresql
    version: ">=3.0.0"
    source: https://galaxy.ansible.com

  # AWS
  - name: amazon.aws
    version: ">=7.0.0"
    source: https://galaxy.ansible.com

  # Kubernetes (optional)
  - name: kubernetes.core
    version: ">=2.4.0"
    source: https://galaxy.ansible.com

  # Network Infrastructure - Proxmox
  # Collection: community.proxmox
  # Provides: Proxmox VE VM and container management via API
  - name: community.proxmox
    version: ">=1.4.0"
    source: https://galaxy.ansible.com

  # Network Infrastructure - OPNSense
  # Collection: oxlorg.opnsense (ansibleguy.opnsense)
  # Provides: OPNSense firewall management via REST API
  - name: oxlorg.opnsense
    version: ">=0.5.0"
    source: https://galaxy.ansible.com

  # Network Infrastructure - pfSense
  # Collection: pfsensible.core
  # Provides: pfSense firewall management via XML + PHP shell
  - name: pfsensible.core
    version: ">=0.5.0"
    source: https://galaxy.ansible.com
