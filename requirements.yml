---
# Ansible Collections Requirements
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # Grafana - Official collection for Grafana automation
  # Collection: grafana.grafana (grafana-ansible-collection)
  # Provides: grafana role for installation and dashboards
  - name: grafana.grafana
    version: ">=6.0.6"
    source: https://galaxy.ansible.com

  # Prometheus - Prometheus Community Collection
  # Collection: prometheus-community.prometheus
  # Provides: prometheus, alertmanager, node_exporter, and 25+ other roles
  # Roles used: prometheus, alertmanager, node_exporter
  - name: prometheus_community.prometheus
    version: ">=1.0.0"
    source: https://galaxy.ansible.com

  # Community Collections
  - name: community.general
    version: ">=7.0.0"
    source: https://galaxy.ansible.com

  - name: ansible.posix
    version: ">=1.5.0"
    source: https://galaxy.ansible.com

  # Docker/Container
  - name: community.docker
    version: ">=3.0.0"
    source: https://galaxy.ansible.com

  # System Management
  - name: community.systemd
    version: ">=1.2.0"
    source: https://galaxy.ansible.com

  # Kubernetes (optional)
  - name: kubernetes.core
    version: ">=2.4.0"
    source: https://galaxy.ansible.com
