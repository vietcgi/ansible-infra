# ENCRYPTED SECRETS - DO NOT EDIT DIRECTLY
# This file is encrypted with Ansible Vault
#
# To edit:
#   ansible-vault edit inventories/projects/<project>/group_vars/all_vault.yml
#
# To view:
#   ansible-vault view inventories/projects/<project>/group_vars/all_vault.yml
#
# To encrypt a new file:
#   ansible-vault create inventories/projects/<project>/group_vars/all_vault.yml
#
# Store your vault password in: ~/.vault_password
# Use: --vault-password-file ~/.vault_password

# ============================================================================
# SERVICE CREDENTIALS
# ============================================================================

vault_grafana_admin_password: ""
vault_prometheus_scrape_token: ""
