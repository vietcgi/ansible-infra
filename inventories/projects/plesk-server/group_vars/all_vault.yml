# ============================================================================
# SSH KEYS
# ============================================================================

vault_ssh_key_private: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  PLACEHOLDER - Add your SSH private key here
  -----END OPENSSH PRIVATE KEY-----

vault_ssh_key_public: "ssh-ed25519 PLACEHOLDER"

# ============================================================================
