---
# Vietcgi Customer Inventory
# Production servers

all:
  vars:
    ansible_user: "kevin"
    ansible_ssh_private_key_file: "~/.ssh/vietcgi_prod_key"
    ansible_python_interpreter: "/usr/bin/python3"

  children:
    app_servers:
      hosts:
        # Production Web Servers
        web-prod-01:
          ansible_host: "108.181.38.69"
          app_framework: "nodejs"
          app_name: "portal"

        # web-prod-02:
        #   ansible_host: "203.0.113.11"
        #   app_framework: "nodejs"
        #   app_name: "portal"

    mail_servers:
      vars:
        # KumoMTA Email Configuration
        kumomta_enabled: true
        kumomta_dkim_enabled: true
        kumomta_dkim_selector: "default"

        # Primary email domain for DKIM signing
        email_domain: "vietcgi.nguoivietcali.com"

        # SMTP server settings
        kumomta_listen_port: 25
        kumomta_admin_port: 8000

        # Queue and retry configuration (optimized for new sender)
        kumomta_queue_retry_interval: "20 minutes"
        kumomta_queue_max_attempts: 72  # 3 days

      hosts:
        # Production Mail Server (KumoMTA)
        web-prod-01:
          ansible_host: "108.181.38.69"

    # database_servers:
    #   hosts:
    #     db-prod-01:
    #       ansible_host: "203.0.113.30"
