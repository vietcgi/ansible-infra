---
# Vietcgi Customer Configuration
# Production deployment with Auth0 integration

client_name: "vietcgi"
client_domain: "vietcgi.us"
client_env: "production"
client_timezone: "America/Los_Angeles"

# ============================================================================
# Common Role Configuration (OS Baseline)
# ============================================================================

# SSH users are now defined centrally in users.yml
# Dynamically generate from managed_users
common_users:
  - name: "admin"
    shell: "{{ managed_users.admin.system.shell }}"
    groups: "{{ managed_users.admin.system.groups }}"

  - name: "support"
    shell: "{{ managed_users.support.system.shell }}"
    groups: "{{ managed_users.support.system.groups }}"

common_packages:
  - curl
  - wget
  - git
  - vim
  - python3
  - python3-pip
  - htop
  - net-tools

common_hostname: "vietcgi-prod"
common_dns_servers:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1

common_ufw_rules:
  - { rule: "allow", port: "22", proto: "tcp" }
  - { rule: "allow", port: "80", proto: "tcp" }
  - { rule: "allow", port: "443", proto: "tcp" }

common_fail2ban_enabled: true
common_automatic_security_updates: true
common_ssh_permit_root_login: false
common_ssh_password_authentication: false

# ============================================================================
# Auth0 Configuration - PRODUCTION CREDENTIALS
# ============================================================================

# Your Auth0 Tenant
auth0_domain: "vietcgi.us.auth0.com"

# M2M Application Credentials (Machine-to-Machine)
# These are encrypted in vault, not shown here
auth0_client_id: "{{ vault_auth0_client_id }}"
auth0_client_secret: "{{ vault_auth0_client_secret }}"

# Production Applications to Create
auth0_applications:
  # Main Application Portal
  - name: "vietcgi-portal"
    type: "regular_web"
    description: "Vietcgi Main Application Portal"
    redirect_uris:
      - "https://vietcgi.us/auth/callback"
      - "https://www.vietcgi.us/auth/callback"
    allowed_logout_urls:
      - "https://vietcgi.us"
      - "https://www.vietcgi.us"
    web_origins:
      - "https://vietcgi.us"
      - "https://www.vietcgi.us"

  # API Application (for backend services)
  - name: "vietcgi-api"
    type: "non_interactive"
    description: "Vietcgi Backend API (M2M)"

# Auth0 users are now defined centrally in users.yml
# Dynamically generate from managed_users
auth0_users:
  - email: "{{ managed_users.admin.auth0.email }}"
    username: "admin"
    given_name: "{{ managed_users.admin.auth0.given_name }}"
    family_name: "{{ managed_users.admin.auth0.family_name }}"
    password: "{{ managed_users.admin.auth0.password }}"
    email_verified: "{{ managed_users.admin.auth0.email_verified }}"

  - email: "{{ managed_users.support.auth0.email }}"
    username: "support"
    given_name: "{{ managed_users.support.auth0.given_name }}"
    family_name: "{{ managed_users.support.auth0.family_name }}"
    password: "{{ managed_users.support.auth0.password }}"
    email_verified: "{{ managed_users.support.auth0.email_verified }}"

# Production Roles
auth0_roles:
  - name: "admin"
    description: "Administrator - Full access"
    permissions: []

  - name: "manager"
    description: "Manager - Team management"
    permissions: []

  - name: "user"
    description: "Standard User - Basic access"
    permissions: []

  - name: "viewer"
    description: "Viewer - Read-only access"
    permissions: []

# MFA and Security
auth0_mfa_enabled: true
auth0_password_policy: "good"

# ============================================================================
# Application Integration Configuration
# ============================================================================

# Framework for Portal Application
app_framework: "nodejs"
app_name: "portal"
app_env: "production"
app_root_path: "/opt/vietcgi-portal"
app_env_path: "/opt/vietcgi-portal/.env"

# Application Environment Variables
app_env_vars:
  DEBUG: "false"
  NODE_ENV: "production"
  PORT: "3000"
  DOMAIN: "vietcgi.us"
  LOG_LEVEL: "info"
  API_ENDPOINT: "https://api.vietcgi.us"
  AUTH0_AUDIENCE: "https://api.vietcgi.us"

# ============================================================================
# Ansible Configuration
# ============================================================================

ansible_user: "kevin"
ansible_become: true
ansible_become_method: "sudo"
ansible_python_interpreter: "/usr/bin/python3"
