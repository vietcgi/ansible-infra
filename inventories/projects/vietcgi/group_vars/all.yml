---
# Vietcgi Customer Configuration
# Production deployment with Auth0 integration

client_name: "vietcgi"
client_domain: "vietcgi.us"
client_env: "production"
client_timezone: "America/Los_Angeles"

# ============================================================================
# Common Role Configuration (OS Baseline)
# ============================================================================

# SSH users are now defined centrally in users.yml
# Dynamically generate from managed_users
common_users:
  - name: "admin"
    shell: "{{ managed_users.admin.system.shell }}"
    groups: "{{ managed_users.admin.system.groups }}"

  - name: "support"
    shell: "{{ managed_users.support.system.shell }}"
    groups: "{{ managed_users.support.system.groups }}"

common_packages:
  - curl
  - wget
  - git
  - vim
  - python3
  - python3-pip
  - htop
  - net-tools

common_hostname: "vietcgi-prod"
common_dns_servers:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1

common_ufw_rules:
  - { rule: "allow", port: "22", proto: "tcp" }
  - { rule: "allow", port: "80", proto: "tcp" }
  - { rule: "allow", port: "443", proto: "tcp" }

common_fail2ban_enabled: true
common_automatic_security_updates: true
common_ssh_permit_root_login: false
common_ssh_password_authentication: false

# ============================================================================
# Auth0 Configuration - PRODUCTION CREDENTIALS
# ============================================================================

# Your Auth0 Tenant
auth0_domain: "vietcgi.us.auth0.com"

# M2M Application Credentials (Machine-to-Machine)
# These are encrypted in vault, not shown here
auth0_client_id: "{{ vault_auth0_client_id }}"
auth0_client_secret: "{{ vault_auth0_client_secret }}"

# Production Applications to Create
auth0_applications:
  # Main Application Portal
  - name: "vietcgi-portal"
    type: "regular_web"
    description: "Vietcgi Main Application Portal"
    redirect_uris:
      - "https://vietcgi.us/auth/callback"
      - "https://www.vietcgi.us/auth/callback"
    allowed_logout_urls:
      - "https://vietcgi.us"
      - "https://www.vietcgi.us"
    web_origins:
      - "https://vietcgi.us"
      - "https://www.vietcgi.us"

  # API Application (for backend services)
  - name: "vietcgi-api"
    type: "non_interactive"
    description: "Vietcgi Backend API (M2M)"

# Auth0 users are now defined centrally in users.yml
# Dynamically generate from managed_users
auth0_users:
  - email: "{{ managed_users.admin.auth0.email }}"
    username: "admin"
    given_name: "{{ managed_users.admin.auth0.given_name }}"
    family_name: "{{ managed_users.admin.auth0.family_name }}"
    password: "{{ managed_users.admin.auth0.password }}"
    email_verified: "{{ managed_users.admin.auth0.email_verified }}"

  - email: "{{ managed_users.support.auth0.email }}"
    username: "support"
    given_name: "{{ managed_users.support.auth0.given_name }}"
    family_name: "{{ managed_users.support.auth0.family_name }}"
    password: "{{ managed_users.support.auth0.password }}"
    email_verified: "{{ managed_users.support.auth0.email_verified }}"

# Production Roles
auth0_roles:
  - name: "admin"
    description: "Administrator - Full access"
    permissions: []

  - name: "manager"
    description: "Manager - Team management"
    permissions: []

  - name: "user"
    description: "Standard User - Basic access"
    permissions: []

  - name: "viewer"
    description: "Viewer - Read-only access"
    permissions: []

# MFA and Security
auth0_mfa_enabled: true
auth0_password_policy: "good"

# ============================================================================
# Application Integration Configuration
# ============================================================================

# Framework for Portal Application
app_framework: "nodejs"
app_name: "portal"
app_env: "production"
app_root_path: "/opt/vietcgi-portal"
app_env_path: "/opt/vietcgi-portal/.env"

# Application Environment Variables
app_env_vars:
  DEBUG: "false"
  NODE_ENV: "production"
  PORT: "3000"
  DOMAIN: "vietcgi.us"
  LOG_LEVEL: "info"
  API_ENDPOINT: "https://api.vietcgi.us"
  AUTH0_AUDIENCE: "https://api.vietcgi.us"

# ============================================================================
# Ansible Configuration
# ============================================================================

ansible_user: "kevin"
ansible_become: true
ansible_become_method: "sudo"
ansible_python_interpreter: "/usr/bin/python3"

# ============================================================================
# MODULAR ACCESS CONTROL SYSTEMS
# ============================================================================
# Control which access control systems are enabled for this customer
# Each system can be independently toggled on/off

access_systems_enabled:
  # SSH Access Control - Linux user creation and SSH key management
  ssh:
    enabled: true
    description: "SSH key-based access to infrastructure servers"
    authenticator: "SSH public/private keys"
    requires: "none"

  # Auth0 Identity Management - Cloud identity and password-based access
  auth0:
    enabled: true
    description: "Auth0 cloud identity service for web applications"
    authenticator: "Email/password with optional MFA"
    requires: "none"

  # Application RBAC - Role-Based Access Control within applications
  rbac:
    enabled: true
    description: "Role-based permissions for application features"
    authenticator: "Auth0 identity (requires auth0 enabled)"
    requires: "auth0"

  # Boundary - Session proxying and access recording
  boundary:
    enabled: false
    description: "HashiCorp Boundary for session recording and access audit"
    authenticator: "Auth0 identity (requires auth0 enabled)"
    requires: "auth0"

# SSH Configuration
ssh_config:
  enabled: "{{ access_systems_enabled.ssh.enabled }}"
  when_enabled:
    create_users: true
    manage_keys: true
    manage_sudo: true
    manage_groups: true
  when_disabled:
    action: "remove_users"
    preserve_home: true

# Auth0 Configuration
auth0_config:
  enabled: "{{ access_systems_enabled.auth0.enabled }}"
  when_enabled:
    manage_users: true
    sync_from_ssh: false
    mfa_required: true
  when_disabled:
    action: "preserve"

# RBAC Configuration
rbac_config:
  enabled: "{{ access_systems_enabled.rbac.enabled }}"
  requires_auth0: "{{ access_systems_enabled.auth0.enabled }}"
  when_enabled:
    sync_roles: true
    enforce_permissions: true
  when_disabled:
    action: "revoke_all"

# Boundary Configuration
boundary_config:
  enabled: "{{ access_systems_enabled.boundary.enabled }}"
  requires_auth0: "{{ access_systems_enabled.auth0.enabled }}"
  when_enabled:
    controller_url: "https://boundary.example.com"
    enable_session_recording: true
    enable_audit_logging: true
  when_disabled:
    action: "preserve"

# ============================================================================
# SYNCHRONIZED ACCESS CONTROL
# ============================================================================
# User status tracking (single source of truth for access)

user_access_status:
  admin:
    enabled: true
    reason: "Active administrator"
    disabled_date: null
    revoke_reason: null

  support:
    enabled: true
    reason: "Active support staff"
    disabled_date: null
    revoke_reason: null

# ============================================================================
# CENTRALIZED USER MANAGEMENT
# ============================================================================
# Define all users here - automatically synced to SSH, Auth0, and RBAC

managed_users:
  admin:
    enabled: "{{ user_access_status.admin.enabled }}"
    status_reason: "{{ user_access_status.admin.reason }}"

    system:
      shell: "{{ '/sbin/nologin' if not user_access_status.admin.enabled else '/bin/bash' }}"
      groups: ["sudo"]
      home: "/home/admin"
      manage_ssh_key: "{{ user_access_status.admin.enabled }}"

    auth0:
      email: "admin@vietcgi.us"
      given_name: "Admin"
      family_name: "User"
      email_verified: true
      password: "{{ vault_initial_admin_password }}"
      account_active: "{{ user_access_status.admin.enabled }}"

    rbac:
      auth0_roles: ["admin"]
      sudo_access: "{{ user_access_status.admin.enabled }}"
      can_deploy: "{{ user_access_status.admin.enabled }}"
      can_manage_users: "{{ user_access_status.admin.enabled }}"

    ssh_keys:
      - name: "primary"
        fingerprint: "SHA256:..."
        rotation_days: 90
        active: "{{ user_access_status.admin.enabled }}"

  support:
    enabled: "{{ user_access_status.support.enabled }}"
    status_reason: "{{ user_access_status.support.reason }}"

    system:
      shell: "{{ '/sbin/nologin' if not user_access_status.support.enabled else '/bin/bash' }}"
      groups: ["sudo"]
      home: "/home/support"
      manage_ssh_key: "{{ user_access_status.support.enabled }}"

    auth0:
      email: "support@vietcgi.us"
      given_name: "Support"
      family_name: "Team"
      email_verified: true
      password: "{{ vault_support_user_password }}"
      account_active: "{{ user_access_status.support.enabled }}"

    rbac:
      auth0_roles: ["manager"]
      sudo_access: "{{ user_access_status.support.enabled }}"
      can_deploy: false
      can_manage_users: false

    ssh_keys:
      - name: "primary"
        fingerprint: "SHA256:..."
        rotation_days: 90
        active: "{{ user_access_status.support.enabled }}"

# Centralized role definitions
access_roles:
  admin:
    description: "Administrator - Full system and application access"
    ssh_permissions: "ALL"
    auth0_permissions:
      - "read:users"
      - "create:users"
      - "update:users"
      - "delete:users"
      - "read:applications"
      - "manage:roles"
    application_permissions:
      - "admin_panel"
      - "user_management"
      - "system_settings"
      - "audit_logs"

  manager:
    description: "Manager - Team and resource management"
    ssh_permissions: "LIMITED"
    auth0_permissions:
      - "read:users"
      - "update:users"
      - "read:applications"
    application_permissions:
      - "team_management"
      - "reports"
      - "resource_allocation"

  user:
    description: "User - Standard application access"
    ssh_permissions: "NONE"
    auth0_permissions:
      - "read:profile"
    application_permissions:
      - "basic_features"
      - "personal_data"

  viewer:
    description: "Viewer - Read-only access"
    ssh_permissions: "NONE"
    auth0_permissions:
      - "read:profile"
    application_permissions:
      - "read_only"
      - "reports"
