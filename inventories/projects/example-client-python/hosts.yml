---
# Example Inventory for Python/Django Client

all:
  vars:
    ansible_user: "ubuntu"
    ansible_ssh_private_key_file: "~/.ssh/id_rsa"
    ansible_python_interpreter: "/usr/bin/python3"

  children:
    app_servers:
      hosts:
        web-prod-01:
          ansible_host: "203.0.113.20"
          app_framework: "django"
          app_name: "portal"

        # web-prod-02:
        #   ansible_host: "203.0.113.21"
        #   app_framework: "django"
        #   app_name: "portal"

    database_servers:
      hosts:
        db-prod-01:
          ansible_host: "203.0.113.30"

