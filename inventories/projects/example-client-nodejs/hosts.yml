---
# Example Inventory for Node.js Client
# Edit this file to match your infrastructure
# 
# Servers running Node.js applications with Auth0 integration

all:
  vars:
    ansible_user: "ubuntu"
    ansible_ssh_private_key_file: "~/.ssh/id_rsa"
    ansible_python_interpreter: "/usr/bin/python3"

  children:
    app_servers:
      hosts:
        # Example: API Gateway Server
        api-prod-01:
          ansible_host: "203.0.113.10"
          ansible_user: "ubuntu"
          app_framework: "nodejs"
          app_name: "api-gateway"

        # Example: Web Application Server
        web-prod-01:
          ansible_host: "203.0.113.11"
          ansible_user: "ubuntu"
          app_framework: "nodejs"
          app_name: "web-app"

        # Example: Additional server (uncomment to use)
        # api-prod-02:
        #   ansible_host: "203.0.113.12"
        #   app_framework: "nodejs"
        #   app_name: "api-gateway"

