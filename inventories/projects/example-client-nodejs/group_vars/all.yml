---
# Example Client Configuration - Node.js
# Complete working example for deploying Node.js apps with Auth0
# 
# Replace "example" with your actual company/client name

# ============================================================================
# Client Information
# ============================================================================

client_name: "example"
client_domain: "example.com"
client_env: "production"
client_timezone: "America/New_York"

# ============================================================================
# Common Role Configuration (OS Baseline)
# ============================================================================

common_users:
  - name: "app"
    shell: "/bin/bash"
    groups: ["sudo"]
  - name: "ubuntu"
    shell: "/bin/bash"
    groups: ["sudo"]

common_packages:
  - curl
  - wget
  - git
  - vim
  - python3
  - python3-pip
  - htop
  - net-tools
  - nodejs
  - npm

common_hostname: "{{ client_name }}-prod"
common_dns_servers:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1

common_ufw_rules:
  - { rule: "allow", port: "22", proto: "tcp" }
  - { rule: "allow", port: "80", proto: "tcp" }
  - { rule: "allow", port: "443", proto: "tcp" }
  - { rule: "allow", port: "3000", proto: "tcp" }
  - { rule: "allow", port: "3001", proto: "tcp" }

common_fail2ban_enabled: true
common_automatic_security_updates: true
common_ssh_permit_root_login: false
common_ssh_password_authentication: false

# ============================================================================
# Auth0 Configuration
# ============================================================================

auth0_domain: "{{ vault_auth0_domain }}"
auth0_client_id: "{{ vault_auth0_client_id }}"
auth0_client_secret: "{{ vault_auth0_client_secret }}"

# Applications to create
auth0_applications:
  - name: "{{ client_name }}-api"
    type: "non_interactive"

  - name: "{{ client_name }}-webapp"
    type: "regular_web"
    redirect_uris:
      - "https://{{ client_domain }}/callback"
      - "https://www.{{ client_domain }}/callback"
      - "http://localhost:3000/callback"
    allowed_logout_urls:
      - "https://{{ client_domain }}/logout"
      - "https://www.{{ client_domain }}/logout"
    web_origins:
      - "https://{{ client_domain }}"
      - "https://www.{{ client_domain }}"

# Users
auth0_users:
  - email: "admin@{{ client_domain }}"
    given_name: "Admin"
    family_name: "User"
    password: "{{ vault_initial_admin_password }}"
    email_verified: true

# Roles
auth0_roles:
  - name: "admin"
    description: "Administrator"
    permissions:
      - resource: "api://{{ client_name }}-api"
        permission: "admin:*"

  - name: "user"
    description: "Regular User"
    permissions:
      - resource: "api://{{ client_name }}-api"
        permission: "read:*"

# Connections
auth0_connections:
  - name: "google-oauth2"
    enabled: false
    strategy: "google-oauth2"
    options:
      client_id: "{{ vault_google_oauth_client_id | default('') }}"
      client_secret: "{{ vault_google_oauth_secret | default('') }}"

auth0_mfa_enabled: true
auth0_mfa_methods:
  - "sms"
  - "totp"

auth0_password_policy: "good"
auth0_log_retention_days: 30

# ============================================================================
# Application Integration Configuration
# ============================================================================

app_framework: "nodejs"
app_name: "api-gateway"
app_env: "{{ client_env }}"
app_root_path: "/opt/api-gateway"
app_config_path: "/opt/api-gateway/config"
app_env_path: "/opt/api-gateway/.env"

app_env_vars:
  API_PORT: "3000"
  LOG_LEVEL: "info"
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"

app_config_user: "app"
app_config_group: "app"
app_config_mode: "0640"

# ============================================================================
# Ansible Configuration
# ============================================================================

ansible_user: "ubuntu"
ansible_become: true
ansible_become_method: "sudo"
ansible_python_interpreter: "/usr/bin/python3"

