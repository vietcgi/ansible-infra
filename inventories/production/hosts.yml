---
# Sentinel Infrastructure - Production Inventory
# Define production servers and groups

all:
  vars:
    # Global variables
    ansible_user: ubuntu
    ansible_port: 22
    common_hostname_environment: production
    monitoring_grafana_enabled: true
    monitoring_node_exporter_enabled: true

  children:
    # Web servers group
    webservers:
      hosts:
        web01.sentinel.local:
          ansible_host: 10.0.1.10
          roles:
            - common
            - security
            - monitoring
        web02.sentinel.local:
          ansible_host: 10.0.1.11
          roles:
            - common
            - security
            - monitoring

    # Database servers group
    databases:
      hosts:
        db01.sentinel.local:
          ansible_host: 10.0.2.10
          roles:
            - common
            - security
            - monitoring
            - storage
      vars:
        common_disable_swap: true

    # Monitoring servers group
    monitoring_servers:
      hosts:
        monitor01.sentinel.local:
          ansible_host: 10.0.3.10
          roles:
            - common
            - security
            - monitoring
      vars:
        monitoring_grafana_enabled: true
        monitoring_prometheus_enabled: true
        monitoring_loki_enabled: true

    # Load balancers group
    loadbalancers:
      hosts:
        lb01.sentinel.local:
          ansible_host: 10.0.1.1
          roles:
            - common
            - security
            - monitoring
            - networking

    # All servers
    linux_servers:
      children:
        - webservers
        - databases
        - monitoring_servers
        - loadbalancers
