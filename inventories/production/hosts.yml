---
# ansible-infra - Production Inventory
# Define production servers and groups

all:
  vars:
    # Global variables
    ansible_user: ubuntu
    ansible_port: 22
    common_hostname_environment: production
    monitoring_grafana_enabled: true
    monitoring_node_exporter_enabled: true

  children:
    # Web servers group
    webservers:
      hosts:
        web01.sentinel.local:
          ansible_host: 10.0.1.10
          roles:
            - common
            - security
            - monitoring
        web02.sentinel.local:
          ansible_host: 10.0.1.11
          roles:
            - common
            - security
            - monitoring

    # Database servers group
    databases:
      hosts:
        db01.sentinel.local:
          ansible_host: 10.0.2.10
          roles:
            - common
            - security
            - monitoring
            - storage
      vars:
        common_disable_swap: true

    # Prometheus servers group
    prometheus_servers:
      hosts:
        prometheus01.sentinel.local:
          ansible_host: 10.0.3.10
          roles:
            - common
            - security
            - monitoring
      vars:
        prometheus_version: "2.48.0"
        prometheus_listen_address: "0.0.0.0:9090"

    # Loki servers group (log aggregation)
    loki_servers:
      hosts:
        loki01.sentinel.local:
          ansible_host: 10.0.3.20
          roles:
            - common
            - security
            - monitoring
      vars:
        loki_enabled: true

    # Grafana servers group
    grafana_servers:
      hosts:
        grafana01.sentinel.local:
          ansible_host: 10.0.3.30
          roles:
            - common
            - security
            - monitoring
      vars:
        grafana_enabled: true

    # Combined monitoring group
    monitoring_servers:
      hosts: {}
      children:
        - prometheus_servers
        - loki_servers
        - grafana_servers

    # Load balancers group
    loadbalancers:
      hosts:
        lb01.sentinel.local:
          ansible_host: 10.0.1.1
          roles:
            - common
            - security
            - monitoring
            - networking

    # All servers
    linux_servers:
      hosts: {}
      children:
        - webservers
        - databases
        - monitoring_servers
        - loadbalancers
