---
# ansible-infra - Development Inventory

all:
  vars:
    ansible_user: ubuntu
    ansible_port: 22
    common_hostname_environment: development
    monitoring_grafana_enabled: false  # Disabled in dev to reduce overhead

  children:
    dev_servers:
      hosts:
        dev-local.local:
          ansible_host: 127.0.0.1
          ansible_connection: local
