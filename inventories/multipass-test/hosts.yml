all:
  children:
    wireguard_full_mesh:
      vars:
        wireguard_enabled: true
        wireguard_topology: full_mesh
        wireguard_full_mesh_nodes:
          wg-node1:
            vpn_ip: 10.100.0.1
            public_endpoint: 192.168.64.3:51820
          wg-node2:
            vpn_ip: 10.100.0.2
            public_endpoint: 192.168.64.4:51820
          wg-node3:
            vpn_ip: 10.100.0.3
            public_endpoint: 192.168.64.7:51820
      hosts:
        wg-node1:
          ansible_host: 192.168.64.3
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        wg-node2:
          ansible_host: 192.168.64.4
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        wg-node3:
          ansible_host: 192.168.64.7
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
