---
# pfSense Inventory
# Configure your pfSense devices here

all:
  children:
    pfsense:
      hosts:
        # Production pfSense
        pfsense-prod:
          ansible_host: 192.168.1.1
          ansible_user: admin
          # ansible_ssh_private_key_file: ~/.ssh/pfsense_key

        # Test pfSense (Vagrant/VirtualBox)
        pfsense-test:
          ansible_host: 192.168.56.10
          ansible_user: vagrant
          ansible_ssh_private_key_file: .vagrant/machines/pfsense/virtualbox/private_key
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

      vars:
        # pfsensible.core connection settings
        ansible_python_interpreter: /usr/local/bin/python3.8
        ansible_connection: network_cli
        ansible_network_os: pfsensible.core.pfsense

        # WireGuard defaults (override per-host)
        pfsense_wireguard_enabled: true
        pfsense_wireguard_mode: provider
