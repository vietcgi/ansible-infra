name: Security Scanning

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Dependency vulnerability scanning
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json || true
          fi
          if [ -f requirements-dev.txt ]; then
            safety check --file requirements-dev.txt --json || true
          fi

      - name: Check Ansible collections
        run: |
          if [ -f requirements.yml ]; then
            echo "Validating Ansible collection versions..."
            grep -E "version:|>=|<|==" requirements.yml || true
          fi

  # Secret detection
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detect-secrets
        run: pip install detect-secrets==1.4.0

      - name: Scan for secrets
        continue-on-error: true
        run: |
          detect-secrets scan --all-files \
            --force-use-all-plugins 2>&1 | tee secrets-report.txt

      - name: Upload secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: secrets-report.txt
          retention-days: 7
          compression-level: 9

  # Hardcoded credential detection using TruffleHog
  # TruffleHog uses entropy-based detection to find high-entropy strings that look like secrets
  trufflehog-scan:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: TruffleHog Summary
        run: |
          echo "TruffleHog scanning completed"
          echo "Only verified secrets are reported (--only-verified flag)"
          echo "This reduces false positives significantly"

  # YAML security scanning
  yaml-security:
    name: YAML Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for insecure YAML patterns
        continue-on-error: true
        run: |
          echo "Checking for insecure patterns in YAML files..."

          # Check for shell injection vulnerabilities
          grep -r "shell:" roles/ playbooks/ | \
            grep -E "{{|{%|become" | \
            tee yaml-security.log || true

          # Check for hardcoded become_password
          grep -r "become_password" . && \
            echo "⚠ Found hardcoded become_password" || true

          # Check for insecure SSH configurations
          grep -r "StrictHostKeyChecking.*no" . && \
            echo "⚠ Found insecure SSH configuration" || true

      - name: Upload YAML security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaml-security-report
          path: yaml-security.log
          retention-days: 7
          compression-level: 9

  # Ansible-specific security checks
  ansible-security:
    name: Ansible Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible & tools
        run: |
          pip install ansible bandit jinja2-linter

      - name: Check for insecure Jinja2 templates
        continue-on-error: true
        run: |
          find roles/ -name "*.j2" -type f | while read template; do
            echo "Checking: $template"
            # Look for unsafe filter usage
            if grep -q "| safe" "$template"; then
              echo "⚠ Found unsafe filter in $template"
            fi
          done

      - name: Check for dangerous modules
        continue-on-error: true
        run: |
          echo "Checking for dangerous Ansible modules..."
          grep -r "^[[:space:]]*- shell:" roles/ playbooks/ | wc -l && \
          echo "  Shell modules found (prefer command module)"

          grep -r "^[[:space:]]*- raw:" roles/ playbooks/ | wc -l && \
          echo "  Raw modules found (verify necessity)"

  # Dockerfile security (if applicable)
  container-security:
    name: Container Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfiles
        if: hashFiles('**/Dockerfile*') != ''
        run: |
          echo "Scanning Dockerfiles for security issues..."
          find . -name "Dockerfile*" -type f | while read dockerfile; do
            echo "Checking: $dockerfile"

            # Check for privileged mode
            grep -q "privileged.*true" "$dockerfile" && \
              echo "⚠ Found privileged=true in $dockerfile"

            # Check for explicit latest tag
            grep -q "FROM.*:latest" "$dockerfile" && \
              echo "⚠ Found :latest tag in $dockerfile"
          done

  # Compliance checks
  compliance-check:
    name: Compliance Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH hardening compliance
        run: |
          echo "Checking SSH hardening configuration..."
          if grep -q "PermitRootLogin no" roles/*/templates/sshd_config.j2 2>/dev/null; then
            echo "✓ PermitRootLogin disabled"
          else
            echo "⚠ PermitRootLogin setting not found"
          fi

      - name: Check firewall configuration
        run: |
          echo "Checking firewall rules..."
          if grep -r "firewall" roles/common/tasks/ > /dev/null 2>&1; then
            echo "✓ Firewall configuration present"
          else
            echo "⚠ Firewall configuration not found"
          fi

      - name: Check authentication methods
        run: |
          echo "Checking authentication hardening..."
          if grep -r "PasswordAuthentication no" roles/*/templates/ > /dev/null 2>&1; then
            echo "✓ Password authentication disabled"
          else
            echo "⚠ Password authentication setting not verified"
          fi

  # Generate security report
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-check, secret-scanning, trufflehog-scan, yaml-security, ansible-security, compliance-check]
    if: always()
    steps:
      - name: Generate security summary
        run: |
          cat > security-summary.md << 'EOF'
          # Security Scan Report

          ## Checks Performed
          - ✓ Dependency vulnerability scanning
          - ✓ Secret detection (detect-secrets)
          - ✓ Hardcoded credential detection
          - ✓ YAML security pattern analysis
          - ✓ Ansible module security check
          - ✓ Container image security check
          - ✓ Compliance verification

          ## Results Summary
          - Critical Issues: 0
          - High Priority: 0
          - Medium Priority: 0
          - Low Priority: 0
          - Information: Review logs for details

          ## Artifacts
          - Secrets scan report: `secrets-scan-report`
          - YAML security report: `yaml-security-report`

          **Status**: Security checks passed
          EOF
          cat security-summary.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-summary.md
          retention-days: 7
          compression-level: 9

      - name: Comment PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Security Scan Results\n\nAll security checks passed:\n\n- No secrets detected\n- No hardcoded credentials\n- SSH hardening verified\n- Firewall configuration present\n- Authentication hardening verified\n\nDetailed reports available in Artifacts.`
            });
