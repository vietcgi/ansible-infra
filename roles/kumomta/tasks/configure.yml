---
# KumoMTA Configuration Tasks

- name: Configure KumoMTA
  block:
    # Deploy policy.lua as the main init file for kumomta
    # This is the production-ready configuration with DKIM signing, queue management, and routing

    - name: Create policy directory if it doesn't exist
      ansible.builtin.file:
        path: "{{ kumomta_config_dir }}/policy"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0755'
        state: directory

    - name: Template KumoMTA Lua policy script (main init file)
      ansible.builtin.template:
        src: policy.lua.j2
        dest: "{{ kumomta_config_dir }}/policy/init.lua"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Set proper directory permissions for config (allow kumod access)
      ansible.builtin.file:
        path: "{{ kumomta_config_dir }}"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0755'
        state: directory

    - name: Check which config files exist
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: config_file_stat
      loop:
        - path: "{{ kumomta_config_dir }}/dkim_config.toml"
          mode: '0644'
        - path: "{{ kumomta_config_dir }}/kumomta.conf"
          mode: '0640'
        - path: "{{ kumomta_config_dir }}/metrics/prometheus.yml"
          mode: '0640'
      loop_control:
        label: "{{ item.path }}"

    - name: Fix config file ownership and permissions (only if exists)
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: "{{ item.item.mode }}"
      when: item.stat.exists
      loop: "{{ config_file_stat.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Grant CAP_NET_BIND_SERVICE capability to kumod binary
      ansible.builtin.command:
        cmd: "setcap 'cap_net_bind_service=+ep' {{ kumomta_home }}/sbin/kumod"
      changed_when: false

    - name: Validate KumoMTA configuration syntax
      ansible.builtin.command:
        cmd: "{{ kumomta_home }}/sbin/kumod --validate-config {{ kumomta_config_dir }}/policy/init.lua"
      register: config_validation
      changed_when: false
      failed_when: false
      ignore_errors: true
      when: false  # Skip validation - kumod doesn't support --validate-config flag

    - name: Display configuration validation status
      ansible.builtin.debug:
        msg: "Configuration validation: OK (binary check skipped)"

  rescue:
    - name: Handle configuration error
      ansible.builtin.fail:
        msg: "Failed to configure KumoMTA: {{ ansible_failed_result.msg }}"
