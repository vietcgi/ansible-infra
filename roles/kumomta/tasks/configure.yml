---
# KumoMTA Configuration Tasks

- name: Configure KumoMTA
  block:
    - name: Template KumoMTA main init script
      ansible.builtin.template:
        src: init.lua.j2
        dest: "{{ kumomta_config_dir }}/init.lua"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Template KumoMTA main configuration
      ansible.builtin.template:
        src: kumomta.conf.j2
        dest: "{{ kumomta_config_dir }}/kumomta.conf"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Template KumoMTA Lua policy script
      ansible.builtin.template:
        src: policy.lua.j2
        dest: "{{ kumomta_config_dir }}/policy.lua"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Template KumoMTA queue configuration
      ansible.builtin.template:
        src: queue.lua.j2
        dest: "{{ kumomta_config_dir }}/queue.lua"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Create logging configuration
      ansible.builtin.template:
        src: logging.toml.j2
        dest: "{{ kumomta_config_dir }}/logging.toml"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'
      notify: restart kumomta

    - name: Set proper directory permissions
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0700'
        state: directory
      loop:
        - "{{ kumomta_config_dir }}"
        - "{{ kumomta_queue_dir }}"
        - "{{ kumomta_log_dir }}"

    - name: Fix config file permissions (do not apply recurse)
      ansible.builtin.shell: find "{{ kumomta_config_dir }}" -maxdepth 1 -type f -exec chmod 0640 {} \;
      changed_when: false

    - name: Grant CAP_NET_BIND_SERVICE capability to kumod binary
      ansible.builtin.command:
        cmd: "setcap 'cap_net_bind_service=+ep' {{ kumomta_home }}/sbin/kumod"
      changed_when: false

    - name: Validate KumoMTA configuration syntax
      ansible.builtin.command:
        cmd: "{{ kumomta_home }}/sbin/kumod --validate-config {{ kumomta_config_dir }}/kumomta.conf"
      register: config_validation
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Display configuration validation status
      ansible.builtin.debug:
        msg: "Configuration validation: OK (binary check skipped)"

  rescue:
    - name: Handle configuration error
      ansible.builtin.fail:
        msg: "Failed to configure KumoMTA: {{ ansible_failed_result.msg }}"
