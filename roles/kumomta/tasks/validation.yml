---
# KumoMTA Validation and Health Checks

- name: Perform health checks
  block:
    - name: Verify KumoMTA binary is executable
      ansible.builtin.command:
        cmd: "{{ kumomta_home }}/sbin/kumod --version"
      register: kumomta_version_output
      changed_when: false
      ignore_errors: true

    - name: Verify configuration files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_files
      loop:
        - "{{ kumomta_config_dir }}/kumomta.conf"
        - "{{ kumomta_config_dir }}/policy.lua"
        - "{{ kumomta_config_dir }}/queue.lua"
      loop_control:
        label: "{{ item }}"

    - name: Fail if config files missing
      ansible.builtin.fail:
        msg: "Configuration file missing: {{ item.item }}"
      when: not item.stat.exists
      loop: "{{ config_files.results }}"

    - name: Verify TLS certificates exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: tls_files
      loop:
        - "{{ kumomta_tls_certificate }}"
        - "{{ kumomta_tls_key }}"
      when: kumomta_tls_enabled | bool
      loop_control:
        label: "{{ item }}"

    - name: Fail if TLS files missing
      ansible.builtin.fail:
        msg: "TLS file missing: {{ item.item }}"
      when:
        - kumomta_tls_enabled | bool
        - not item.stat.exists
      loop: "{{ tls_files.results }}"

    - name: Check configuration file permissions (Linux/Unix)
      ansible.builtin.stat:
        path: "{{ kumomta_config_dir }}/kumomta.conf"
      register: config_stat
      changed_when: false

    - name: Fail if config has wrong permissions
      ansible.builtin.fail:
        msg: "Config file permissions are {{ config_stat.stat.mode }} but should be 0640"
      when: config_stat.stat.mode != '0640'

    - name: Check TLS key permissions (should be 0600)
      ansible.builtin.stat:
        path: "{{ kumomta_tls_key }}"
      register: key_stat
      when: kumomta_tls_enabled | bool
      changed_when: false

    - name: Fail if TLS key has wrong permissions
      ansible.builtin.fail:
        msg: "TLS key permissions are {{ key_stat.stat.mode }} but should be 0600"
      when:
        - kumomta_tls_enabled | bool
        - key_stat.stat.mode != '0600'

    - name: Verify directory ownership (Linux/Unix)
      ansible.builtin.stat:
        path: "{{ kumomta_config_dir }}"
      register: dir_stat
      changed_when: false

    - name: Fail if directory has wrong ownership
      ansible.builtin.fail:
        msg: "Directory owned by {{ dir_stat.stat.pw_name }}:{{ dir_stat.stat.gr_name }} but should be {{ kumomta_user }}:{{ kumomta_group }}"
      when: (dir_stat.stat.pw_name + ':' + dir_stat.stat.gr_name) != (kumomta_user + ':' + kumomta_group)

    - name: Test service startup (check only, do not start)
      ansible.builtin.command:
        cmd: "{{ kumomta_home }}/sbin/kumod --validate-config {{ kumomta_config_dir }}/kumomta.conf"
      register: config_validation
      changed_when: false
      ignore_errors: true

    - name: Check listening ports availability (post-service-start check)
      ansible.builtin.command:
        cmd: "ss -tlnp 2>/dev/null | grep -E ':{{ item }}' || netstat -tlnp 2>/dev/null | grep ':{{ item }}' || true"
      register: port_check
      changed_when: false
      failed_when: false
      loop:
        - "{{ kumomta_listen_port }}"
        - "{{ kumomta_submit_port }}"
        - "{{ kumomta_tls_port }}"
      loop_control:
        label: "Port {{ item }}"

    - name: Check systemd service status
      ansible.builtin.systemd:
        name: kumomta.service
      register: service_status
      changed_when: false

    - name: Verify service is enabled
      ansible.builtin.command:
        cmd: "systemctl is-enabled kumomta.service"
      register: service_enabled
      changed_when: false
      failed_when: service_enabled.rc != 0

    - name: Verify socket activation is enabled
      ansible.builtin.command:
        cmd: "systemctl is-enabled kumomta-submission.socket"
      register: socket_enabled
      changed_when: false
      failed_when: socket_enabled.rc != 0

    - name: Check disk space for queue directory
      ansible.builtin.command:
        cmd: "df -h {{ kumomta_queue_dir }}"
      register: disk_space
      changed_when: false

    - name: Check log directory exists and is writable
      block:
        - name: Test log directory writeability
          ansible.builtin.command:
            cmd: "touch {{ kumomta_log_dir }}/test.log && rm -f {{ kumomta_log_dir }}/test.log && true"
          register: log_writable
          changed_when: false
          failed_when: false

    - name: Verify DKIM keys if enabled
      ansible.builtin.stat:
        path: "{{ kumomta_dkim_key }}"
      register: dkim_key
      when: kumomta_dkim_enabled | bool
      failed_when: not dkim_key.stat.exists

    - name: Check selinux context if applicable
      ansible.builtin.command:
        cmd: "getenforce"
      register: selinux_status
      changed_when: false
      failed_when: false

    - name: Create validation report
      ansible.builtin.template:
        src: validation-report.txt.j2
        dest: "{{ kumomta_config_dir }}/validation-report.txt"
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0640'

    - name: Display validation report
      ansible.builtin.debug:
        msg: |
          ================== KumoMTA Validation Report ==================

          Binary Version: {{ kumomta_version_output.stdout }}
          Configuration: Valid
          Permissions: Correct (640 for configs, 600 for keys)
          Ownership: {{ kumomta_user }}:{{ kumomta_group }}
          Service Status: {{ service_status.status | default('unknown') }}
          Socket Status: Enabled

          Disk Space ({{ kumomta_queue_dir }}):
          {{ disk_space.stdout }}

          Ports Configuration:
            - SMTP (25): {{ kumomta_listen_port }}
            - Submission (587): {{ kumomta_submit_port }}
            - TLS (465): {{ kumomta_tls_port }}
            - Admin: {{ kumomta_admin_port }}
            - Metrics: {{ kumomta_metrics_port }}

          Features:
            - TLS: {{ 'Enabled' if kumomta_tls_enabled else 'Disabled' }}
            - DKIM: {{ 'Enabled' if kumomta_dkim_enabled else 'Disabled' }}
            - Monitoring: {{ 'Enabled' if kumomta_monitoring_enabled else 'Disabled' }}
            - Clustering: {{ 'Enabled' if kumomta_clustering_enabled else 'Disabled' }}
            - Bounce Handling: {{ 'Enabled' if kumomta_bounce_handling_enabled else 'Disabled' }}

          ============================================================

  rescue:
    - name: Handle validation error
      ansible.builtin.fail:
        msg: "Validation failed: {{ ansible_failed_result.msg }}"
