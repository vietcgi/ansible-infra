---
# KumoMTA Email Delivery - Main Tasks

- name: KumoMTA Email Delivery Setup
  block:
    - name: Validate KumoMTA configuration
      ansible.builtin.assert:
        that:
          - kumomta_enabled | bool
          - kumomta_listen_port | int > 0
          - kumomta_listen_port | int < 65536
          - kumomta_submit_port | int > 0
          - kumomta_submit_port | int < 65536
          - kumomta_tls_port | int > 0
          - kumomta_tls_port | int < 65536
          - kumomta_admin_port | int > 0
          - kumomta_admin_port | int < 65536
          - kumomta_metrics_port | int > 0
          - kumomta_metrics_port | int < 65536
          - kumomta_user | length > 0
          - kumomta_group | length > 0
          - kumomta_config_dir | length > 0
          - kumomta_queue_dir | length > 0
          - kumomta_log_dir | length > 0
          - kumomta_home | length > 0
          - kumomta_max_connections | int > 0
          - kumomta_max_queue_size | int > 0
          - kumomta_queue_retry_interval | int > 0
          - kumomta_queue_max_attempts | int > 0
        fail_msg: "KumoMTA configuration validation failed"

    - name: Check for port conflicts
      ansible.builtin.shell: |
        ss -tlnp 2>/dev/null | grep -E ":({{ kumomta_listen_port }}|{{ kumomta_submit_port }}|{{ kumomta_tls_port }}|{{ kumomta_admin_port }}|{{ kumomta_metrics_port }})" || echo "No conflicts"
      register: port_check
      changed_when: false
      failed_when: "'LISTEN' in port_check.stdout and 'kumomta' not in port_check.stdout"

    - name: Check available memory
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb | int >= 512
        fail_msg: "Insufficient memory (minimum 512MB required, have {{ ansible_memtotal_mb }}MB)"

    - name: Check available disk space
      ansible.builtin.shell: |
        available=$(df {{ kumomta_queue_dir }} | awk 'NR==2 {print $4}' 2>/dev/null || echo 0)
        if [ $available -lt 1048576 ]; then
          echo "Insufficient disk space for queue directory (need 1GB, have $(( available / 1024 ))MB)"
          exit 1
        fi
      changed_when: false

    - name: Verify supported OS
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
        fail_msg: "KumoMTA requires Ubuntu or Debian Linux (detected {{ ansible_distribution }})"

    - name: Check OS version compatibility
      ansible.builtin.assert:
        that:
          - ansible_distribution_major_version | int >= 11 or (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 20)
        fail_msg: "KumoMTA requires Ubuntu 20.04+ or Debian 11+ (detected {{ ansible_distribution }} {{ ansible_distribution_version }})"

    - name: Create KumoMTA system group
      ansible.builtin.group:
        name: "{{ kumomta_group }}"
        state: present

    - name: Create KumoMTA system user
      ansible.builtin.user:
        name: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        home: "{{ kumomta_home }}"
        shell: /usr/sbin/nologin
        state: present
        system: true

    - name: Install KumoMTA dependencies
      ansible.builtin.include_tasks: install.yml

    - name: Create KumoMTA directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0755'
      loop:
        - "{{ kumomta_config_dir }}"
        - "{{ kumomta_config_dir }}/certs"
        - "{{ kumomta_config_dir }}/dkim"
        - "{{ kumomta_config_dir }}/metrics"
        - "{{ kumomta_queue_dir }}"
        - "{{ kumomta_queue_dir }}/incremental"
        - "{{ kumomta_log_dir }}"
        - "{{ kumomta_log_dir }}/archived"
        - "{{ kumomta_bounce_dir }}"
        - "{{ kumomta_fbl_dir }}"
        - "{{ kumomta_backup_dir }}"
      become: true

    - name: Generate self-signed certificates if needed
      ansible.builtin.include_tasks: certificates.yml
      when: kumomta_tls_enabled | bool

    - name: Configure KumoMTA
      ansible.builtin.include_tasks: configure.yml

    - name: Set up service management
      ansible.builtin.include_tasks: service.yml

    - name: Configure monitoring and observability
      ansible.builtin.include_tasks: monitoring.yml
      when: kumomta_monitoring_enabled | bool

    - name: Set up bounce and FBL handling
      ansible.builtin.include_tasks: bounce_handling.yml
      when: kumomta_bounce_handling_enabled | bool

    - name: Configure clustering
      ansible.builtin.include_tasks: clustering.yml
      when: kumomta_clustering_enabled | bool

    - name: Set up backup and retention
      ansible.builtin.include_tasks: backup.yml
      when: kumomta_backup_enabled | bool

    - name: Perform health checks
      ansible.builtin.include_tasks: validation.yml

    - name: Display deployment status
      ansible.builtin.debug:
        msg: |
          KumoMTA Email Delivery Setup Complete
          =====================================
          Hostname: {{ kumomta_hostname }}
          Listen Port: {{ kumomta_listen_port }}
          SMTP Port: {{ kumomta_submit_port }}
          TLS Port: {{ kumomta_tls_port }}
          Admin Port: {{ kumomta_admin_port }}
          Metrics Port: {{ kumomta_metrics_port }}
          Max Connections: {{ kumomta_max_connections }}
          Queue Size: {{ kumomta_max_queue_size | filesizeformat }}
          TLS: {{ 'enabled' if kumomta_tls_enabled else 'disabled' }}
          Monitoring: {{ 'enabled' if kumomta_monitoring_enabled else 'disabled' }}
          Status: Ready

  rescue:
    - name: Display setup error
      ansible.builtin.debug:
        msg: "KumoMTA setup failed: {{ ansible_failed_result.msg | default('Unknown error') }}"

    - name: Fail with details
      ansible.builtin.fail:
        msg: "KumoMTA setup encountered an error. Check logs above."
