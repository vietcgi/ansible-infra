---
# KumoMTA Service Management

- name: Create systemd service file
  ansible.builtin.template:
    src: kumomta.service.j2
    dest: /etc/systemd/system/kumomta.service
    owner: root
    group: root
    mode: '0644'
  register: service_unit_change
  become: true

- name: Create systemd socket file (submission)
  ansible.builtin.template:
    src: kumomta-submission.socket.j2
    dest: /etc/systemd/system/kumomta-submission.socket
    owner: root
    group: root
    mode: '0644'
  register: socket_unit_change
  become: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: service_unit_change.changed or socket_unit_change.changed
  become: true

- name: Enable KumoMTA service
  ansible.builtin.systemd:
    name: kumomta.service
    enabled: "{{ kumomta_service_enabled | bool }}"
    state: "{{ kumomta_service_state }}"
  when: kumomta_state == "present"
  become: true

- name: Disable KumoMTA submission socket (handled by daemon)
  ansible.builtin.systemd:
    name: kumomta-submission.socket
    enabled: false
    state: stopped
  when: kumomta_state == "present"
  become: true
