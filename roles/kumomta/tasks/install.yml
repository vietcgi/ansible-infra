---
# KumoMTA Installation Tasks

- name: Install KumoMTA
  block:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      become: true

    - name: Install KumoMTA dependencies (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
      when: ansible_os_family == "Debian"
      become: true

    - name: Create KumoMTA directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: kumomta
        group: kumomta
        mode: '0755'
      become: true
      loop:
        - "{{ kumomta_config_dir }}"
        - "{{ kumomta_queue_dir }}"
        - "{{ kumomta_log_dir }}"

    - name: Get KumoMTA .deb download URL from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/kumocorp/kumomta/releases/tags/{{ kumomta_version }}"
        method: GET
        return_content: true
        status_code: 200
      register: github_release
      retries: 3
      delay: 5

    - name: Extract .deb download URL
      set_fact:
        kumomta_deb_url: "{{ github_release.json.assets | selectattr('name', 'match', '.*Ubuntu22\\.04_amd64\\.deb') | map(attribute='browser_download_url') | first }}"

    - name: Download KumoMTA .deb package from GitHub releases
      ansible.builtin.get_url:
        url: "{{ kumomta_deb_url }}"
        dest: "/tmp/kumomta.deb"
        force: true
      register: kumomta_download
      retries: 3
      delay: 10
      become: true

    - name: Install KumoMTA from .deb package
      ansible.builtin.apt:
        deb: "/tmp/kumomta.deb"
      notify: restart kumomta
      become: true

    - name: Verify KumoMTA installation
      ansible.builtin.shell:
        cmd: "which kumomta && kumomta --version || /usr/bin/kumomta --version || echo 'KumoMTA binary installed (version check unavailable)'"
      register: kumomta_version_check
      changed_when: false
      failed_when: false

    - name: Display installed version
      ansible.builtin.debug:
        msg: "{{ kumomta_version_check.stdout }}"

    - name: Clean up download files
      ansible.builtin.file:
        path: "/tmp/kumomta.deb"
        state: absent
      become: true

  rescue:
    - name: Handle installation error
      ansible.builtin.fail:
        msg: "Failed to install KumoMTA: {{ ansible_failed_result.msg }}"
