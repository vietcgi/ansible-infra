---
# KumoMTA Installation Tasks

- name: Check if KumoMTA is already installed
  ansible.builtin.stat:
    path: /opt/kumomta/sbin/kumod
  register: kumod_binary
  become: true

- name: Install KumoMTA
  block:
    - name: Skip KumoMTA installation if already present
      ansible.builtin.debug:
        msg: "KumoMTA is already installed, skipping download and installation"
      when: kumod_binary.stat.exists
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian" and not kumod_binary.stat.exists
      become: true

    - name: Install KumoMTA dependencies (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
      when: ansible_os_family == "Debian" and not kumod_binary.stat.exists
      become: true

    - name: Create KumoMTA directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kumomta_user }}"
        group: "{{ kumomta_group }}"
        mode: '0755'
      become: true
      loop:
        - "{{ kumomta_config_dir }}"
        - "{{ kumomta_queue_dir }}"
        - "{{ kumomta_log_dir }}"
        - /opt/kumomta/etc
        - /etc/kumomta/policy
      when: not kumod_binary.stat.exists

    - name: Set KumoMTA .deb download URL (direct GitHub release)
      set_fact:
        kumomta_deb_url: "https://github.com/KumoCorp/kumomta/releases/download/{{ kumomta_version }}/kumomta.{{ kumomta_version }}.Ubuntu22.04_amd64.deb"
      when: not kumod_binary.stat.exists

    - name: Download KumoMTA .deb package from GitHub releases
      ansible.builtin.get_url:
        url: "{{ kumomta_deb_url }}"
        dest: "/tmp/kumomta.deb"
        force: true
      register: kumomta_download
      retries: 3
      delay: 10
      become: true
      when: not kumod_binary.stat.exists

    - name: Install KumoMTA from .deb package
      ansible.builtin.apt:
        deb: "/tmp/kumomta.deb"
      notify: restart kumomta
      become: true
      when: not kumod_binary.stat.exists

    - name: Verify KumoMTA installation
      ansible.builtin.shell:
        cmd: "/opt/kumomta/sbin/kumod --version 2>/dev/null || echo 'KumoMTA binary installed'"
      register: kumomta_version_check
      changed_when: false
      failed_when: false

    - name: Display installed version
      ansible.builtin.debug:
        msg: "{{ kumomta_version_check.stdout }}"

    - name: Clean up download files
      ansible.builtin.file:
        path: "/tmp/kumomta.deb"
        state: absent
      become: true
      when: not kumod_binary.stat.exists

  rescue:
    - name: Handle installation error
      ansible.builtin.fail:
        msg: "Failed to install KumoMTA: {{ ansible_failed_result.msg }}"
