---
# KumoMTA Installation Tasks

- name: Install KumoMTA
  block:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      become: true

    - name: Install KumoMTA dependencies (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
      when: ansible_os_family == "Debian"
      become: true

    - name: Download KumoMTA .deb package from GitHub releases
      ansible.builtin.get_url:
        url: "https://github.com/kumocorp/kumomta/releases/download/{{ kumomta_version }}/kumomta.{{ kumomta_version }}.Ubuntu22.04_amd64.deb"
        dest: "/tmp/kumomta.deb"
        force: true
      register: kumomta_download
      retries: 3
      delay: 10
      become: true

    - name: Install KumoMTA from .deb package
      ansible.builtin.apt:
        deb: "/tmp/kumomta.deb"
      notify: restart kumomta
      become: true

    - name: Verify KumoMTA installation
      ansible.builtin.command:
        cmd: "kumomta --version"
      register: kumomta_version_check
      changed_when: false

    - name: Display installed version
      ansible.builtin.debug:
        msg: "{{ kumomta_version_check.stdout }}"

    - name: Clean up download files
      ansible.builtin.file:
        path: "/tmp/kumomta.deb"
        state: absent
      become: true

  rescue:
    - name: Handle installation error
      ansible.builtin.fail:
        msg: "Failed to install KumoMTA: {{ ansible_failed_result.msg }}"
