---
# App Integration Role - Main Task Orchestrator
# Applies Auth0 configuration to applications based on framework type

- name: Validate application configuration
  ansible.builtin.import_tasks: validate.yml
  tags:
    - app_integration
    - validation
    - always

- name: Generate environment file
  ansible.builtin.import_tasks: generate_env.yml
  when:
    - auth0_client_id is defined
    - auth0_client_id | length > 0
  tags:
    - app_integration
    - env_generation

- name: Configure Node.js application
  ansible.builtin.import_tasks: configure_nodejs.yml
  when: app_framework == "nodejs"
  tags:
    - app_integration
    - nodejs

- name: Configure Python application
  ansible.builtin.import_tasks: configure_python.yml
  when: app_framework == "python" or app_framework == "django"
  tags:
    - app_integration
    - python

- name: Configure Go application
  ansible.builtin.import_tasks: configure_go.yml
  when: app_framework == "go"
  tags:
    - app_integration
    - go

- name: Configure Java application
  ansible.builtin.import_tasks: configure_java.yml
  when: app_framework == "java"
  tags:
    - app_integration
    - java

- name: Display integration summary
  ansible.builtin.debug:
    msg: |
      Auth0 Integration Complete
      ================================
      Framework: {{ app_framework }}
      Application: {{ app_name }}
      Auth0 Domain: {{ auth0_domain }}
      Config Location: {{ app_config_path }}
      Env File: {{ app_env_path }}
  tags:
    - app_integration
