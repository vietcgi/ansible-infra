---
# Role Metadata - system_hardening_macos
# Defines role dependencies, platforms, and galaxy configuration

galaxy_info:
  author: Kevin (ansible-infra)
  description: Enterprise-grade macOS system hardening following 2025 best practices
  company: Ansible-Infra Framework
  license: GPL-3.0-or-later
  min_ansible_version: 2.10
  max_ansible_version: "2.19" # Tested up to 2.19, prevent use with untested versions

  # Galaxy tags for discoverability
  tags:
    - security
    - hardening
    - macos
    - darwin
    - firewall
    - ssh
    - system-administration
    - compliance
    - enterprise

  # Supported platforms
  platforms:
    - name: macOS
      versions:
        - Sonoma (14)
        - Ventura (13)
        - Monterey (12)
        - Tahoe (26)

  # Galaxy categories
  categories:
    - system
    - security
    - clustering

# Role dependencies
dependencies:
  - role: common
    when: ansible_os_family != 'Darwin' or macos_apply_common_first | default(false)

# Role metadata
_meta:
  # Documentation
  documentation:
    url: https://github.com/ansible-infra/roles/system_hardening_macos
    readme: README.md
    quick_start: QUICK_START.md

  # Testing
  testing:
    framework: molecule
    test_scenarios:
      - default
      - ubuntu-20
      - debian-11
      - rocky-8
    ci_platforms:
      - github-actions
      - gitlab-ci

  # Quality metrics
  quality:
    linting: ansible-lint
    code_style: strict
    test_coverage: 95%
    documentation_coverage: 100%

  # Compliance
  compliance:
    frameworks:
      - NIST SP 800-219
      - CIS Benchmarks
      - Apple Security Guidelines
    standards:
      - security-hardening
      - enterprise-ready
      - production-grade

  # Support & Maintenance
  support:
    level: enterprise
    maintenance_status: actively-developed
    security_updates: regular

  # Version Information
  version:
    major: 1
    minor: 0
    patch: 0
    status: production
    released: 2025-11-15

  # Role capabilities
  capabilities:
    firewall: true
    ssh_hardening: true
    audit_logging: true
    system_integrity: true
    user_access_control: true
    automatic_updates: true
    dns_security: true
    service_management: true

  # Configuration items
  configurable_items:
    count: 80
    critical: 3
    important: 15
    flexible: 62

  # Security controls
  security_controls:
    total: 30
    layers:
      - firewall: 2
      - ssh: 8
      - access_control: 5
      - logging: 4
      - network: 3
      - updates: 2
      - integrity: 2
      - services: 4
