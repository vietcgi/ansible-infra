---
# macOS Application Firewall (ALF) Configuration
# Provides inbound connection filtering at application layer

- name: "Debug: Configuring Application Firewall (ALF)"
  ansible.builtin.debug:
    msg: "Configuring macOS Application Firewall with stealth mode"

- name: "Check current Application Firewall status"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>&1 | grep -E "Firewall is|status"
  register: alf_status_check
  changed_when: false
  check_mode: false

- name: "Display current ALF status"
  ansible.builtin.debug:
    msg: "{{ alf_status_check.stdout_lines }}"

- name: "Enable Application Firewall"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on
  when: '"Firewall is off" in alf_status_check.stdout'
  register: alf_enable_result
  changed_when: alf_enable_result.rc == 0

- name: "Enable Application Firewall stealth mode"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on
  register: alf_stealth_result
  changed_when: '"Stealth mode" in alf_stealth_result.stdout or alf_stealth_result.rc == 0'
  when: macos_firewall_stealth_mode

- name: "Enable Application Firewall logging"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --setloggingmode on
  register: alf_logging_result
  changed_when: '"Logging" in alf_logging_result.stdout or alf_logging_result.rc == 0'
  when: macos_firewall_logging_enabled

- name: "Block all incoming connections (optional - may break services)"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --setblockall on
  register: alf_blockall_result
  changed_when: alf_blockall_result.rc == 0
  when: macos_firewall_block_all_incoming

- name: "Verify Application Firewall final status"
  ansible.builtin.shell: |
    /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
  register: alf_final_status
  changed_when: false
  check_mode: false

- name: "Display final ALF configuration"
  ansible.builtin.debug:
    msg: |
      Application Firewall Configuration Complete:
      {{ alf_final_status.stdout }}

      Status:
      - Global State: Enabled ✓
      - Stealth Mode: {% if macos_firewall_stealth_mode %}Enabled ✓{% else %}Disabled{% endif %}
      - Logging: {% if macos_firewall_logging_enabled %}Enabled ✓{% else %}Disabled{% endif %}
      - Block All Incoming: {% if macos_firewall_block_all_incoming %}Enabled ✓{% else %}Default policy{% endif %}
