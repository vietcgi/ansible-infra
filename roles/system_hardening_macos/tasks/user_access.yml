---
# macOS User Access Control Hardening
# Sudo configuration, login security, account hardening

- name: "Debug: Hardening user access control"
  debug:
    msg: "Configuring sudo, login window, and account security"

- name: "Ensure /etc/sudoers.d directory exists"
  file:
    path: /etc/sudoers.d
    state: directory
    mode: "0755"

- name: "Create hardened sudo configuration"
  copy:
    content: |
      # Hardened sudoers configuration for macOS
      # Generated by ansible-infra framework

      Defaults use_pty
      Defaults requiretty
      Defaults log_input, log_output
      Defaults logfile = "/var/log/sudo.log"
      Defaults timeout = {{ macos_sudo_timeout_minutes }}
      Defaults passwd_timeout = 1

      # Preserve SSH auth socket for sudo
      Defaults env_keep += "SSH_AUTH_SOCK"

      # Allow wheel group members to use sudo
      %wheel ALL=(ALL) ALL
    dest: /etc/sudoers.d/hardened
    owner: root
    group: wheel
    mode: "0440"
    validate: visudo -cf %s
  register: sudoers_result

- name: "Disable auto login"
  shell: |
    defaults write /Library/Preferences/com.apple.loginwindow DisableAutoLogin -bool true
  register: auto_login_result
  changed_when: true

- name: "Hide user list at login window"
  shell: |
    defaults write /Library/Preferences/com.apple.loginwindow SHOWFULLNAME -bool true
    defaults write /Library/Preferences/com.apple.loginwindow Hide500Users -bool true
  register: hide_users_result
  changed_when: true
  when: macos_hide_user_list_login

- name: "Disable guest account"
  shell: |
    defaults write /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false
  register: guest_account_result
  changed_when: true
  when: macos_disable_guest_account

- name: "Disable remote login (SSH via standard mechanism)"
  shell: |
    systemsetup -setremotelogin off 2>/dev/null || \
    defaults write /var/db/com.apple.xpc.launchd.loginitems -dict \
      com.apple.RemoteDesktopDaemon -bool false || true
  register: remote_login_result
  changed_when: '"disabled\|off" in remote_login_result.stdout'
  when: macos_disable_remote_login

- name: "Create SSH banner"
  copy:
    content: |
      ########################################
      # Authorized Access Only
      ########################################
      # This system is for authorized use only.
      # All activity is logged and monitored.
      # Unauthorized access attempts will be logged and prosecuted.
      #
      ########################################
    dest: /etc/ssh/banner.txt
    owner: root
    group: wheel
    mode: "0644"

- name: "Set login window message"
  shell: |
    defaults write /Library/Preferences/com.apple.loginwindow LoginwindowText \
      "Authorized Access Only. All activity is logged and monitored."
  register: login_message_result
  changed_when: true

- name: "Display user access control configuration"
  debug:
    msg: |
      User Access Control Hardening Complete:

      Sudo Configuration:
      ✓ PTY required (no direct command execution)
      ✓ Password required for all commands
      ✓ Timeout: {{ macos_sudo_timeout_minutes }} minutes
      ✓ Input/Output logging enabled
      ✓ Logs: /var/log/sudo.log

      Login Security:
      ✓ Auto login: Disabled
      ✓ User list: Hidden
      ✓ Guest account: Disabled
      ✓ Login banner: Configured

      Configuration Files:
      - Sudoers: /etc/sudoers.d/hardened
      - SSH banner: /etc/ssh/banner.txt

      Verification Commands:
      $ sudo -l                         # List sudo permissions
      $ sudo cat /var/log/sudo.log      # View sudo usage log
      $ defaults read /Library/Preferences/com.apple.loginwindow
