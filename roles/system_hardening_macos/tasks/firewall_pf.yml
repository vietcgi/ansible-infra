---
# macOS Packet Filter (PF) Configuration
# Advanced stateful firewall with rate limiting and anti-bruteforce

- name: "Debug: Configuring Packet Filter (PF)"
  debug:
    msg: "Configuring macOS Packet Filter with anti-bruteforce SSH rate limiting"

- name: "Check if Packet Filter is enabled"
  shell: pfctl -s info 2>&1 | head -1
  register: pf_status_check
  changed_when: false
  check_mode: false
  ignore_errors: true

- name: "Display current PF status"
  debug:
    msg: "{{ pf_status_check.stdout }}"

- name: "Create hardened PF configuration"
  template:
    src: pf_macos.conf.j2
    dest: /etc/pf.conf.hardened
    owner: root
    group: wheel
    mode: "0600"
    backup: yes
  register: pf_config_created

- name: "Validate PF configuration syntax"
  shell: pfctl -n -f /etc/pf.conf.hardened
  changed_when: false
  check_mode: false
  register: pf_validation
  when: pf_config_created is changed

- name: "Display PF validation result"
  debug:
    msg: |
      PF Configuration Validation:
      {% if pf_validation.rc == 0 %}✓ Valid syntax - Configuration is correct{% else %}✗ Syntax error detected{% endif %}

- name: "Backup current PF configuration"
  shell: |
    if [ -f /etc/pf.conf ]; then
      cp /etc/pf.conf /etc/pf.conf.backup.$(date +%Y%m%d_%H%M%S)
      echo "Backed up to: /etc/pf.conf.backup.*"
    fi
  register: pf_backup_result
  changed_when: '"Backed up" in pf_backup_result.stdout'

- name: "Deploy hardened PF configuration"
  shell: |
    cp /etc/pf.conf.hardened /etc/pf.conf
    chmod 0600 /etc/pf.conf
  when: pf_validation.rc == 0 and not macos_hardening_dry_run
  register: pf_deploy_result
  changed_when: true

- name: "Enable Packet Filter"
  shell: pfctl -e 2>&1 | grep -v "already enabled"
  register: pf_enable_result
  changed_when: '"enabled" in pf_enable_result.stdout or pf_enable_result.rc == 0'
  when: pf_validation.rc == 0 and not macos_hardening_dry_run

- name: "Load PF rules"
  shell: pfctl -f /etc/pf.conf
  register: pf_load_result
  changed_when: true
  when: pf_validation.rc == 0 and not macos_hardening_dry_run

- name: "Configure PF to load on boot"
  block:
    - name: "Check PF launchd configuration"
      stat:
        path: /System/Library/LaunchDaemons/com.apple.pfctl.plist
      register: pf_launchd_stat

    - name: "Verify PF is configured in launchd"
      debug:
        msg: |
          PF is managed by launchd plist at:
          /System/Library/LaunchDaemons/com.apple.pfctl.plist

          Note: System Integrity Protection (SIP) protects this file.
          PF rules are automatically loaded from /etc/pf.conf on boot.

- name: "Verify final PF status"
  shell: pfctl -s info 2>&1 | head -5
  register: pf_final_status
  changed_when: false
  check_mode: false
  when: pf_validation.rc == 0

- name: "Display final PF configuration"
  debug:
    msg: |
      Packet Filter Configuration Complete:

      {{ pf_final_status.stdout }}

      Rate Limiting (Anti-Bruteforce):
      - SSH connections: Max {{ macos_pf_ssh_rate_limit_count }} per {{ macos_pf_ssh_rate_limit_window }} seconds
      - Exceeding connections: Automatically blocked (added to <bruteforce> table)

      Configuration Location:
      - Active rules: /etc/pf.conf
      - Backup: /etc/pf.conf.backup.* (timestamped)
      - Hardened version: /etc/pf.conf.hardened

      To verify PF rules are loaded:
      $ sudo pfctl -s rules | head -20

      To view current connections being rate-limited:
      $ sudo pfctl -t bruteforce -T show

      To reload rules after manual edits:
      $ sudo pfctl -f /etc/pf.conf
