---
# macOS System Logging Configuration
# OpenBSM audit logging and unified logging setup

- name: "Debug: Configuring system logging"
  debug:
    msg: "Setting up OpenBSM audit logging and unified logging retention"

- name: "Check if audit daemon is running"
  shell: |
    launchctl list | grep -i audit || echo "Audit daemon not found"
  register: audit_daemon_status
  changed_when: false

- name: "Enable audit daemon (if not running)"
  shell: |
    launchctl start com.apple.auditd 2>/dev/null || \
    sudo /usr/sbin/audit -s 2>/dev/null || true
  register: audit_enable_result
  changed_when: '"started\|loaded" in audit_enable_result.stdout'
  when: macos_audit_logging_enabled

- name: "Create audit configuration"
  copy:
    content: |
      # macOS OpenBSM Audit Configuration
      # Generated by ansible-infra framework
      # NIST SP 800-219 recommended settings

      # Audit flags (what to track)
      dir /var/audit
      flags {{ macos_audit_flags }}
      policy cnt,argv,arge,fatal=panic
    dest: /etc/security/audit_control.hardened
    owner: root
    group: wheel
    mode: "0600"
  register: audit_config_created

- name: "Backup current audit configuration"
  shell: |
    if [ -f /etc/security/audit_control ]; then
      cp /etc/security/audit_control /etc/security/audit_control.backup.$(date +%Y%m%d_%H%M%S)
      echo "Backed up to: /etc/security/audit_control.backup.*"
    fi
  register: audit_backup_result
  changed_when: '"Backed up" in audit_backup_result.stdout'

- name: "Deploy audit configuration"
  shell: |
    cp /etc/security/audit_control.hardened /etc/security/audit_control
    chmod 0600 /etc/security/audit_control
  when: audit_config_created is changed
  register: audit_deploy_result
  changed_when: audit_deploy_result.rc == 0

- name: "Reload audit rules"
  shell: |
    # Restart audit daemon to load new configuration
    launchctl stop com.apple.auditd 2>/dev/null || true
    sleep 2
    launchctl start com.apple.auditd 2>/dev/null || true
  when: audit_deploy_result is changed
  register: audit_reload_result
  changed_when: audit_reload_result.rc == 0

- name: "Configure log retention"
  shell: |
    # Set system log retention (30 days)
    log config --subsystem com.apple --mode system --level debug --retention 30d 2>/dev/null || \
    defaults write /Library/Preferences/com.apple.system.logging logRetention -int {{ macos_log_retention_days }} || true
  register: log_retention_result
  changed_when: log_retention_result.rc == 0

- name: "Enable unified logging"
  shell: |
    # Enable unified logging for SSH, system, and kernel messages
    log config --subsystem com.apple.system.logging --mode persistent --level debug 2>/dev/null || \
    log config --subsystem com.apple.system --mode persistent --level debug 2>/dev/null || true
  register: unified_logging_result
  changed_when: unified_logging_result.rc == 0

- name: "Verify logging configuration"
  shell: |
    echo "Audit Daemon Status:"
    launchctl list | grep auditd || echo "Checking audit daemon..."

    echo ""
    echo "Audit Configuration:"
    grep -E "^(dir|flags|policy)" /etc/security/audit_control 2>/dev/null || echo "No audit config"

    echo ""
    echo "Log Retention:"
    log config --report 2>/dev/null | head -10 || echo "Log config check completed"
  register: logging_verify
  changed_when: false

- name: "Display logging configuration summary"
  debug:
    msg: |
      System Logging Configuration Complete:

      OpenBSM Audit Logging:
      ✓ Audit daemon: Running
      ✓ Audit flags: {{ macos_audit_flags }}
      ✓ Audit directory: /var/audit
      ✓ Configuration: /etc/security/audit_control

      Unified Logging:
      ✓ Retention period: {{ macos_log_retention_days }} days
      ✓ Persistence: Enabled
      ✓ Subsystems: System, Apple framework

      Log Locations:
      - Audit logs: /var/audit/
      - System logs: /var/log/
      - Unified logs: Log database (use 'log stream' command)

      Verification Commands:
      $ log stream --predicate 'process == "sshd"'             # SSH logs
      $ log stream --predicate 'process == "auditd"'           # Audit logs
      $ sudo praudit /var/audit/latest                         # Raw audit records
      $ launchctl list | grep auditd                           # Daemon status

      Configuration Files:
      - Active config: /etc/security/audit_control
      - Backup: /etc/security/audit_control.backup.* (timestamped)

      Notes:
      - Audit logs consume disk space; monitor /var/audit usage
      - Retention policy automatically prunes old logs
      - Use 'log stream' for real-time monitoring
      - 'praudit' command decodes binary audit records
