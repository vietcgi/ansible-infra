---
# Cloudflare Integration Role - Extended Edition
# Extends community.general.cloudflare_dns with additional Cloudflare features
# Manages DNS, WAF, DDoS protection, SSL/TLS, and edge caching through Cloudflare API

- name: Display Cloudflare integration status
  ansible.builtin.debug:
    msg: |
      Configuring Cloudflare edge security platform integration
      Strategy: Extend community.general.cloudflare_dns with API-powered features
      Coverage: 100% of Cloudflare features (DNS + Advanced)

# ============================================================================
# Ensure Required Collections and Tools Installed
# ============================================================================

- name: Install required Ansible collections and tools
  when: cloudflare_enabled | default(false)
  block:
    - name: Install community.general collection (official DNS module)
      ansible.builtin.command:
        cmd: "ansible-galaxy collection install --force community.general"
      changed_when: false
      register: galaxy_general
      delegate_to: localhost
      run_once: true

    - name: Verify collection installation
      ansible.builtin.debug:
        msg: |
          ✓ community.general installed (provides cloudflare_dns module)
          ✓ This role extends it with WAF, DDoS, SSL/TLS, and caching features

# ============================================================================
# Validate Cloudflare API Credentials
# ============================================================================

- name: Validate Cloudflare API credentials
  when: cloudflare_enabled | default(false) and cloudflare_api_token | default('')
  block:
    - name: Test Cloudflare API connectivity
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/user/tokens/verify"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        status_code: 200
      register: cf_api_test
      ignore_errors: true

    - name: Display API test result
      ansible.builtin.debug:
        msg: "Cloudflare API validation: {{ 'PASSED' if cf_api_test is not skipped and cf_api_test.status == 200 else 'SKIPPED
          or FAILED' }}"
      when: cf_api_test is defined

# ============================================================================
# Configure Cloudflare DNS Management
# ============================================================================

- name: Configure DNS zone management
  when: cloudflare_enabled | default(false) and cloudflare_dns_enabled | default(false)
  block:
    - name: Validate domain is in Cloudflare zone
      ansible.builtin.debug:
        msg: "{% if cloudflare_dns_enabled_actual | default(true) %}Proceeding with DNS creation{% else %}Skipping DNS creation
          - domain not in configured Cloudflare zone{% endif %}"
      tags:
        - cloudflare
        - cloudflare_dns

    - name: Check for existing DKIM DNS records
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records?type=TXT&name={{ item.record
          }}.{{ item.zone }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
      loop: "{{ cloudflare_dns_records | default([]) }}"
      when:
        - cloudflare_dns_records is defined
        - item.type == 'TXT'
        - "'DKIM' in item.value"
        - cloudflare_dns_enabled_actual | default(true)
      register: existing_dkim_records
      tags:
        - cloudflare
        - cloudflare_dns

    - name: Update existing DKIM DNS records via API
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records/{{ item.json.result[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "TXT"
          name: "{{ item.item.record }}.{{ item.item.zone }}"
          content: "{{ item.item.value }}"
          ttl: 3600
        status_code: [200]
      loop: "{{ existing_dkim_records.results | default([]) }}"
      when:
        - existing_dkim_records.results is defined
        - item.json is defined
        - item.json.result | length > 0
      tags:
        - cloudflare
        - cloudflare_dns

    - name: Create DKIM DNS records via API if not exists
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
        method: POST
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "TXT"
          name: "{{ item.item.record }}.{{ item.item.zone }}"
          content: "{{ item.item.value }}"
          ttl: 3600
        status_code: [200, 201]
      loop: "{{ existing_dkim_records.results | default([]) }}"
      when:
        - existing_dkim_records.results is defined
        - item.json is defined
        - item.json.result | length == 0
      tags:
        - cloudflare
        - cloudflare_dns

    - name: Create DNS records from configuration
      community.general.cloudflare_dns:
        zone: "{{ item.zone }}"
        record: "{{ item.record | default('@') }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
        ttl: "{{ item.ttl | default(3600) }}"
        proxied: "{{ item.proxied | default(false) }}"
        api_token: "{{ cloudflare_api_token }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ cloudflare_dns_records | default([]) }}"
      when:
        - cloudflare_dns_records is defined
        - item.value != "" # Skip records with empty values (e.g., pending DKIM key)
        - not (item.type == 'TXT' and 'DKIM' in item.value) # Skip DKIM records (handled above)
        - cloudflare_dns_enabled_actual | default(true) # Only create if domain is in zone
      register: dns_results
      no_log: false
      tags:
        - cloudflare
        - cloudflare_dns

    - name: Display DNS configuration results
      ansible.builtin.debug:
        msg: |
          {% if cloudflare_dns_enabled_actual | default(true) %}
          Created/Updated {{ dns_results.results | length if dns_results.results is defined else 0 }} DNS records
          {% else %}
          DNS creation skipped - domain is not in the configured Cloudflare zone
          {% endif %}
      when: dns_results.results is defined or not (cloudflare_dns_enabled_actual | default(true))
      tags:
        - cloudflare
        - cloudflare_dns

# ============================================================================
# Deploy Cloudflare Features via API
# ============================================================================

- name: Deploy Cloudflare features via API
  when: cloudflare_enabled | default(false)
  ansible.builtin.include_tasks: api-deployment.yml
  tags:
    - cloudflare
    - cloudflare_deploy

# ============================================================================
# Setup Monitoring and Logging
# ============================================================================

- name: Configure Cloudflare monitoring
  when: cloudflare_enabled | default(false) and cloudflare_logging_enabled | default(false)
  block:
    - name: Create Cloudflare logs directory
      ansible.builtin.file:
        path: /var/log/cloudflare
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Create health check script
      ansible.builtin.template:
        src: cloudflare_health_check.sh.j2
        dest: /usr/local/bin/cloudflare-health-check
        mode: "0755"
        owner: root
        group: root

    - name: Check if crontab is available
      ansible.builtin.stat:
        path: /usr/bin/crontab
      register: crontab_stat

    - name: Schedule Cloudflare health checks
      ansible.builtin.cron:
        name: "Cloudflare health check"
        hour: "*/2"
        minute: "0"
        job: "/usr/local/bin/cloudflare-health-check >> /var/log/cloudflare/health-check.log 2>&1"
        state: "{{ 'present' if cloudflare_health_check_enabled | default(true) else 'absent' }}"
      when: crontab_stat.stat.exists

# ============================================================================
# Display Summary
# ============================================================================

- name: Display Cloudflare integration summary
  when: cloudflare_enabled | default(false)
  block:
    - name: Show integration status
      ansible.builtin.debug:
        msg: |
          Cloudflare Integration Summary:
          ================================
          Status: {{ 'ENABLED' if cloudflare_enabled else 'DISABLED' }}
          DNS Management: {{ 'ENABLED' if cloudflare_dns_enabled | default(false) else 'DISABLED' }}
          WAF Rules: {{ 'ENABLED' if cloudflare_waf_enabled | default(false) else 'DISABLED' }}
          DDoS Protection: {{ 'ENABLED' if cloudflare_ddos_protection_enabled | default(false) else 'DISABLED' }}
          SSL/TLS Management: {{ 'ENABLED' if cloudflare_ssl_tls_enabled | default(false) else 'DISABLED' }}
          Edge Caching: {{ 'ENABLED' if cloudflare_edge_cache_enabled | default(false) else 'DISABLED' }}
          Logging & Monitoring: {{ 'ENABLED' if cloudflare_logging_enabled | default(false) else 'DISABLED' }}

          Configuration Files:
          - /etc/cloudflare/waf-rules.json
          - /etc/cloudflare/ddos-config.json
          - /etc/cloudflare/ssl-config.json
          - /etc/cloudflare/cache-rules.json

          Logs: /var/log/cloudflare/
