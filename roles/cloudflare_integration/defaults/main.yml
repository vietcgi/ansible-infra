---
# Cloudflare Integration Role - Default Variables

# ============================================================================
# Global Cloudflare Settings
# ============================================================================

cloudflare_enabled: false
cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"
cloudflare_account_email: "{{ vault_cloudflare_email | default('') }}"
cloudflare_zone_id: "{{ vault_cloudflare_zone_id | default('') }}"
cloudflare_domain: "{{ vault_cloudflare_domain | default('') }}"
cloudflare_plan: "pro"  # free, pro, business, enterprise

# ============================================================================
# DNS Management
# ============================================================================

cloudflare_dns_enabled: false
cloudflare_dns_records: []
  # Example:
  # - zone: "example.com"
  #   record: "www"
  #   type: "A"
  #   value: "192.0.2.1"
  #   ttl: 3600
  #   proxied: true
  #   state: "present"

cloudflare_enable_dnssec: true
cloudflare_zone_apex_redirect: ""
cloudflare_managed_nameservers: true
cloudflare_cname_flattening: "flatten_at_root"  # off, flatten_at_root, flatten_all

# DNS Firewall
cloudflare_dns_firewall_enabled: false
cloudflare_dns_firewall_block_response: "refused"  # refused, nodata
cloudflare_dns_firewall_threat_level: "medium"

# DNS Resolution
cloudflare_dns_caching_ttl: 300
cloudflare_secondary_dns_enabled: false
cloudflare_full_dns_setup: true
cloudflare_auto_update_nameservers: true
cloudflare_import_existing_records: false
cloudflare_validate_dns_records: true

# DNS Monitoring
cloudflare_dns_check_frequency: 30
cloudflare_dns_enable_alerts: true
cloudflare_dns_auto_validate: true
cloudflare_dns_check_minute: "*/30"
cloudflare_alert_email: ""

# ============================================================================
# Web Application Firewall (WAF)
# ============================================================================

cloudflare_waf_enabled: false

# WAF Sensitivity
cloudflare_waf_sensitivity_level: "medium"  # low, medium, high
cloudflare_waf_paranoia_level: 2  # 1, 2, 3, 4 (higher = stricter)

# WAF Rule Sets
cloudflare_waf_enable_managed_rules: true
cloudflare_waf_enable_owasp_crs: true
cloudflare_waf_enable_dos_protection: true
cloudflare_waf_enable_bot_management: false
cloudflare_waf_enable_api_protection: false

# WAF Conditions
cloudflare_waf_block_countries: []
  # - "KP"  # North Korea
  # - "IR"  # Iran

cloudflare_waf_allow_countries: []
cloudflare_waf_block_ip_ranges: []
  # - "192.0.2.0/24"

cloudflare_waf_allow_ip_ranges: []

# WAF Rate Limiting
cloudflare_waf_rate_limit_enabled: true
cloudflare_waf_rate_limit_threshold: 100  # requests per 10 seconds
cloudflare_waf_rate_limit_period: 10  # seconds
cloudflare_waf_rate_limit_action: "challenge"  # challenge, block, log

# WAF Monitoring
cloudflare_waf_enable_monitoring: true
cloudflare_waf_monitor_hour: "*/6"
cloudflare_waf_log_all_requests: false

# ============================================================================
# DDoS Protection
# ============================================================================

cloudflare_ddos_protection_enabled: false

# DDoS Sensitivity
cloudflare_ddos_sensitivity: "medium"  # low, medium, high, enterprise
cloudflare_ddos_advanced_ddos: true

# DDoS Mitigation
cloudflare_ddos_http_flood_protection: true
cloudflare_ddos_udp_flood_protection: true
cloudflare_ddos_syn_flood_protection: true
cloudflare_ddos_dns_amplification_protection: true

# DDoS Rate Limiting
cloudflare_ddos_rate_limit_enabled: true
cloudflare_ddos_rate_limit_threshold: 1000  # requests per second
cloudflare_ddos_rate_limit_action: "challenge"

# DDoS Monitoring
cloudflare_ddos_enable_monitoring: true
cloudflare_ddos_check_minute: "*/5"

# ============================================================================
# SSL/TLS Certificate Management
# ============================================================================

cloudflare_ssl_tls_enabled: false

# SSL/TLS Mode
cloudflare_ssl_tls_mode: "full_strict"  # off, flexible, full, full_strict
cloudflare_ssl_tls_minimum_version: "1.2"  # 1.0, 1.1, 1.2, 1.3
cloudflare_ssl_tls_ciphers: "modern"  # modern, compatible, legacy

# Universal SSL
cloudflare_universal_ssl_enabled: true
cloudflare_universal_ssl_auto_renewal: true

# Custom Certificates
cloudflare_custom_ssl_enabled: false
cloudflare_custom_ssl_certificate_path: ""
cloudflare_custom_ssl_key_path: ""

# HSTS Configuration
cloudflare_hsts_enabled: true
cloudflare_hsts_max_age: 31536000  # 1 year in seconds
cloudflare_hsts_include_subdomains: true
cloudflare_hsts_preload: true

# Certificate Transparency Monitoring
cloudflare_ct_monitoring_enabled: true
cloudflare_cert_check_hour: "2"
cloudflare_cert_enable_monitoring: true

# ============================================================================
# Edge Caching
# ============================================================================

cloudflare_edge_cache_enabled: false

# Cache TTL
cloudflare_cache_default_ttl: 30  # minutes
cloudflare_cache_browser_ttl: 30  # minutes
cloudflare_cache_on_cookie: false  # cache even with cookies
cloudflare_cache_respect_origin_headers: true

# Cache Rules
cloudflare_cache_everything: false
cloudflare_cache_key_hostname: true
cloudflare_cache_key_user_agent: false
cloudflare_cache_key_query_string: false

# Cache Purge
cloudflare_cache_enable_purge: true
cloudflare_cache_purge_on_upload: false
cloudflare_cache_preload_enabled: false

# Cache Analytics
cloudflare_cache_enable_analytics: true
cloudflare_cache_analytics_hour: "*/4"

# ============================================================================
# Additional Services
# ============================================================================

# Page Rules
cloudflare_page_rules_enabled: false
cloudflare_page_rules: []
  # - priority: 1
  #   targets:
  #     - "example.com/blog/*"
  #   actions:
  #     - cache_level: "cache_everything"

# Workers
cloudflare_workers_enabled: false
cloudflare_workers_script_path: ""

# Email Routing
cloudflare_email_routing_enabled: false
cloudflare_email_routing_rules: []

# ============================================================================
# Logging and Monitoring
# ============================================================================

cloudflare_logging_enabled: false
cloudflare_health_check_enabled: true
cloudflare_health_check_hour: "*/2"

# Log Levels
cloudflare_log_level: "info"  # debug, info, warning, error
cloudflare_api_log_requests: false

# Alert Configuration
cloudflare_alert_enabled: true
cloudflare_alert_email: ""
cloudflare_alert_slack_webhook: ""
cloudflare_alert_pagerduty_key: ""

# ============================================================================
# Advanced Options
# ============================================================================

# Performance
cloudflare_enable_minification: true
cloudflare_enable_brotli: true
cloudflare_enable_http2: true
cloudflare_enable_http3: true

# Security Headers
cloudflare_security_headers_enabled: true
cloudflare_strict_transport_security: true
cloudflare_x_frame_options: "SAMEORIGIN"
cloudflare_x_content_type_options: "nosniff"
cloudflare_referrer_policy: "strict-origin-when-cross-origin"

# Bot Management
cloudflare_bot_management_enabled: false
cloudflare_bot_fight_mode_enabled: false
cloudflare_verified_bots_allowed: true

# ============================================================================
# Terraform Integration (Optional)
# ============================================================================

cloudflare_terraform_state_enabled: false
cloudflare_terraform_state_bucket: ""
