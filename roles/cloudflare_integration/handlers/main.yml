---
# Cloudflare Integration Handlers

- name: reload cloudflare dns
  ansible.builtin.debug:
    msg: "DNS configuration updated and applied"

- name: reload cloudflare waf
  ansible.builtin.debug:
    msg: "WAF rules updated and applied"

- name: reload cloudflare ddos
  ansible.builtin.debug:
    msg: "DDoS protection configuration updated and applied"

- name: reload cloudflare ssl
  ansible.builtin.debug:
    msg: "SSL/TLS configuration updated and applied"

- name: reload cloudflare cache
  ansible.builtin.debug:
    msg: "Edge cache configuration updated and applied"
