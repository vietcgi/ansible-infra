---
# OPNSense Firewall - Interface Configuration Tasks

- name: Configure OPNSense Network Interfaces
  block:
    - name: Display interface configuration plan
      ansible.builtin.debug:
        msg: |
          Configuring Network Interfaces
          ===============================
          Total Interfaces to Configure: {{ opnsense_interfaces | length }}

          {% for iface in opnsense_interfaces %}
          Interface {{ loop.index }}: {{ iface.name }}
          - Type: {{ iface.type | default('vlan') }}
          {% if iface.type == 'vlan' %}- Parent: {{ iface.parent_device }}
          - VLAN ID: {{ iface.vlan_tag }}
          {% endif %}
          {% if iface.ipv4_address %}- IPv4: {{ iface.ipv4_address }}/{{ iface.ipv4_prefix | default(24) }}
          {% endif %}
          {% if iface.ipv6_address %}- IPv6: {{ iface.ipv6_address }}/{{ iface.ipv6_prefix | default(64) }}
          {% endif %}
          {% endfor %}

    - name: Configure VLAN interfaces
      when: opnsense_interfaces | selectattr('type', 'equalto', 'vlan') | list | length > 0

      block:
        - name: Process VLAN interfaces
          ansible.builtin.set_fact:
            vlan_interfaces: "{{ opnsense_interfaces | selectattr('type', 'equalto', 'vlan') | list }}"

        - name: Create VLAN interfaces
          oxlorg.opnsense.interface_vlan:
            api_key: "{{ opnsense_api_key }}"
            api_secret: "{{ opnsense_api_secret }}"
            firewall_url: "{{ opnsense_api_url }}"
            vlanif: "{{ item.name }}"
            vlandev: "{{ item.parent_device }}"
            vlanid: "{{ item.vlan_tag }}"
            vlandesc: "{{ item.description | default('') }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ vlan_interfaces }}"
          register: vlan_config_results

        - name: Display VLAN configuration results
          ansible.builtin.debug:
            msg: |
              ✓ VLAN Interfaces Configured
              ============================
              {% for result in vlan_config_results.results %}
              - {{ result.item.name }}: {{ result.changed | ternary('Created/Updated', 'Unchanged') }}
              {% endfor %}

    - name: Configure LAGG (Link Aggregation) interfaces
      when: opnsense_interfaces | selectattr('type', 'equalto', 'lagg') | list | length > 0

      block:
        - name: Process LAGG interfaces
          ansible.builtin.set_fact:
            lagg_interfaces: "{{ opnsense_interfaces | selectattr('type', 'equalto', 'lagg') | list }}"

        - name: Create LAGG interfaces
          oxlorg.opnsense.interface_lagg:
            api_key: "{{ opnsense_api_key }}"
            api_secret: "{{ opnsense_api_secret }}"
            firewall_url: "{{ opnsense_api_url }}"
            laggif: "{{ item.name }}"
            laggtype: "{{ item.lagg_type | default('failover') }}"
            members: "{{ item.members | default([]) }}"
            description: "{{ item.description | default('') }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ lagg_interfaces }}"
          register: lagg_config_results

        - name: Display LAGG configuration results
          ansible.builtin.debug:
            msg: |
              ✓ LAGG Interfaces Configured
              ============================
              {% for result in lagg_config_results.results %}
              - {{ result.item.name }}: {{ result.changed | ternary('Created/Updated', 'Unchanged') }}
              {% endfor %}

    - name: Configure CARP Virtual IPs (if applicable)
      when: opnsense_interfaces | selectattr('type', 'equalto', 'carp') | list | length > 0

      block:
        - name: Process CARP VIP interfaces
          ansible.builtin.set_fact:
            carp_interfaces: "{{ opnsense_interfaces | selectattr('type', 'equalto', 'carp') | list }}"

        - name: Create CARP Virtual IPs
          oxlorg.opnsense.interface_vip:
            api_key: "{{ opnsense_api_key }}"
            api_secret: "{{ opnsense_api_secret }}"
            firewall_url: "{{ opnsense_api_url }}"
            vhid: "{{ item.vhid }}"
            mode: "{{ item.mode | default('carp') }}"
            interface: "{{ item.interface }}"
            address: "{{ item.ipv4_address }}"
            subnet: "{{ item.ipv4_prefix | default(24) }}"
            advbase: "{{ item.advbase | default(1) }}"
            advskew: "{{ item.advskew | default(100) }}"
            description: "{{ item.description | default('') }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ carp_interfaces }}"
          register: carp_config_results

        - name: Display CARP VIP configuration results
          ansible.builtin.debug:
            msg: |
              ✓ CARP Virtual IPs Configured
              ============================
              {% for result in carp_config_results.results %}
              - {{ result.item.description | default(result.item.ipv4_address) }}: {{ result.changed | ternary('Created/Updated', 'Unchanged') }}
              {% endfor %}

    - name: Display interface configuration summary
      ansible.builtin.debug:
        msg: |
          ✓ Interface Configuration Complete
          ===================================
          VLAN Interfaces: {{ vlan_interfaces | default([]) | length }}
          LAGG Interfaces: {{ lagg_interfaces | default([]) | length }}
          CARP VIPs: {{ carp_interfaces | default([]) | length }}

  rescue:
    - name: Handle interface configuration error
      ansible.builtin.fail:
        msg: "OPNSense interface configuration failed: {{ ansible_failed_result.msg }}"
