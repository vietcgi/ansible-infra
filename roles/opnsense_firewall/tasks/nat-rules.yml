---
# OPNSense Firewall - NAT Rules Configuration Tasks

- name: Configure OPNSense NAT Rules
  block:
    - name: Display NAT rules configuration plan
      ansible.builtin.debug:
        msg: |
          Configuring NAT Rules
          ====================
          Total NAT Rules to Configure: {{ opnsense_nat_rules | length }}

          {% for rule in opnsense_nat_rules %}
          Rule {{ loop.index }}: {{ rule.description | default(rule.type) }}
          - Type: {{ rule.type | default('source') }}
          {% if rule.type == 'source' %}- Source: {{ rule.source | default('any') }} -> {{ rule.target | default('any') }}
          {% endif %}
          {% if rule.type == '1to1' %}- External: {{ rule.external }} <-> Internal: {{ rule.internal }}
          {% endif %}
          {% endfor %}

    - name: Identify NAT rule types
      ansible.builtin.set_fact:
        source_nat_rules: "{{ opnsense_nat_rules | selectattr('type', 'equalto', 'source') | list }}"
        one_to_one_nat_rules: "{{ opnsense_nat_rules | selectattr('type', 'equalto', '1to1') | list }}"
        port_forward_nat_rules: "{{ opnsense_nat_rules | selectattr('type', 'equalto', 'port_forward') | list }}"

    - name: Configure Source NAT rules
      block:
        - name: Apply Source NAT rules (SNAT)
          oxlorg.opnsense.nat_source:
            api_key: "{{ opnsense_api_key }}"
            api_secret: "{{ opnsense_api_secret }}"
            firewall_url: "{{ opnsense_api_url }}"
            source: "{{ item.source | default('any') }}"
            destination: "{{ item.destination | default('any') }}"
            target: "{{ item.target }}"
            interface: "{{ item.interface | default('wan') }}"
            description: "{{ item.description | default('') }}"
            nonat: "{{ item.nonat | default(false) }}"
            staticnatport: "{{ item.staticnatport | default(false) }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ source_nat_rules }}"
          register: snat_results

        - name: Display Source NAT results
          ansible.builtin.debug:
            msg: |
              ✓ Source NAT Rules Configured
              =============================
              Rules Created/Updated: {{ snat_results.results | selectattr('changed', 'equalto', true) | list | length }}

              {% for result in snat_results.results %}
              - {{ result.item.description | default(result.item.source + ' -> ' + result.item.target) }}: {{ result.changed | ternary('Changed', 'Unchanged') }}
              {% endfor %}

      when: source_nat_rules | length > 0

    - name: Configure 1:1 NAT rules
      block:
        - name: Apply 1:1 NAT rules (Bi-directional mapping)
          oxlorg.opnsense.nat_one_to_one:
            api_key: "{{ opnsense_api_key }}"
            api_secret: "{{ opnsense_api_secret }}"
            firewall_url: "{{ opnsense_api_url }}"
            external: "{{ item.external }}"
            internal: "{{ item.internal }}"
            interface: "{{ item.interface | default('wan') }}"
            description: "{{ item.description | default('') }}"
            state: "{{ item.state | default('present') }}"
          loop: "{{ one_to_one_nat_rules }}"
          register: one_to_one_results

        - name: Display 1:1 NAT results
          ansible.builtin.debug:
            msg: |
              ✓ 1:1 NAT Rules Configured
              ==========================
              Rules Created/Updated: {{ one_to_one_results.results | selectattr('changed', 'equalto', true) | list | length }}

              {% for result in one_to_one_results.results %}
              - External: {{ result.item.external }} <-> Internal: {{ result.item.internal }}: {{ result.changed | ternary('Changed', 'Unchanged') }}
              {% endfor %}

      when: one_to_one_nat_rules | length > 0

    - name: Configure Port Forwarding rules
      block:
        - name: Apply Port Forwarding rules
          ansible.builtin.debug:
            msg: |
              Port Forwarding Configuration
              =============================
              Port forwarding rules can be configured via:
              1. Web UI: Firewall > NAT > Port Forward
              2. Or using firewall rules with port redirect

              Configured rules:
              {% for rule in port_forward_nat_rules %}
              - {{ rule.description | default(rule.protocol + ' ' + rule.external_port) }}: {{ rule.external }}:{{ rule.external_port }} -> {{ rule.internal }}:{{ rule.internal_port }}
              {% endfor %}

      when: port_forward_nat_rules | length > 0

    - name: Display NAT configuration summary
      ansible.builtin.debug:
        msg: |
          ✓ NAT Configuration Complete
          ===========================
          Source NAT Rules: {{ source_nat_rules | length }}
          1:1 NAT Rules: {{ one_to_one_nat_rules | length }}
          Port Forward Rules: {{ port_forward_nat_rules | length }}

          NAT Behavior:
          - Source NAT: Translates internal traffic to external address
          - 1:1 NAT: Bi-directional mapping (internal <-> external)
          - Port Forward: Redirect external port to internal service

          To verify:
          1. Web UI: Firewall > NAT > Rules/1:1/Port Forward
          2. Monitor: Status > System Logs > Filter by NAT

  rescue:
    - name: Handle NAT rules configuration error
      ansible.builtin.fail:
        msg: "OPNSense NAT rules configuration failed: {{ ansible_failed_result.msg }}"
