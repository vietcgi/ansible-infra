---
# DMARC Record Configuration with Verification

- name: Setup DMARC Records
  block:
    - name: Add DMARC record to DNS list
      ansible.builtin.set_fact:
        email_dns_records: "{{ email_dns_records | default([]) + [{'type': 'TXT', 'record': '_dmarc' + ('.' + dns_record_prefix
          if dns_record_prefix != '@' else ''), 'value': 'v=DMARC1; p=' + dmarc_policy + '; sp=' + dmarc_subdomain_policy
          + '; rua=mailto:' + dmarc_report_email + '; ruf=mailto:' + dmarc_forensics_email + '; pct=' + (dmarc_percent | string)
          + ';', 'ttl': 3600, 'zone': dns_zone_name}] }}"

    - name: Display DMARC Status
      ansible.builtin.debug:
        msg: |
          ✓ DMARC Record Status
          Policy: {{ dmarc_policy }}
          Report Email: {{ dmarc_report_email }}
          Forensics Email: {{ dmarc_forensics_email }}
          Forensics Email: {{ dmarc_forensics_email }}

  rescue:
    - name: Handle DMARC Setup Error
      ansible.builtin.debug:
        msg: |
          ⚠ DMARC setup warning: {{ ansible_failed_result.msg | default('DMARC setup completed with warnings') }}

          If duplicate DMARC records exist, this is expected. Check Cloudflare DNS dashboard for
          _dmarc.{{ email_domain }} and ensure only 1 record exists.
