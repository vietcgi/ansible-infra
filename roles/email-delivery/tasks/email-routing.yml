---
# Email Routing Configuration

- name: Setup Email Routing
  block:
    - name: Check if KumoMTA config directory exists
      ansible.builtin.stat:
        path: /opt/kumomta/etc
      register: kumomta_routing_dir

    - name: Create custom routing configuration
      ansible.builtin.template:
        src: email-routing-config.lua.j2
        dest: /opt/kumomta/etc/email-routing.lua
        owner: kumod
        group: kumod
        mode: '0640'
      notify: restart kumomta
      when: kumomta_routing_dir.stat.exists

    - name: Create domain routing map file
      ansible.builtin.copy:
        content: |
          # Domain routing configuration
          # Format: destination_domain = "route_name"
          # Supported routes: direct, relay:<hostname>, local
          # Examples:
          # hotmail.com = "relay:mx-relay.example.com"
          # gmail.com = "direct"
        dest: /opt/kumomta/etc/domain_routes.conf
        owner: kumod
        group: kumod
        mode: '0640'
      notify: restart kumomta
      when: kumomta_routing_dir.stat.exists

    - name: Display Routing Status
      ansible.builtin.debug:
        msg: |
          ✓ Email Routing Configuration
          ✓ Routing Script: /opt/kumomta/etc/email-routing.lua
          ✓ Domain Routes: /opt/kumomta/etc/domain_routes.conf
          ✓ Relay Configuration: Enabled
          ✓ Max Connections per Domain: 20
          ✓ Bounce Handling: Enabled with DSR
          ✓ Retry Policy: 5 attempts, max 5 days

  rescue:
    - name: Handle Email Routing Error
      ansible.builtin.debug:
        msg: "Email routing configuration warning: {{ ansible_failed_result.msg }}"
