---
# KumoMTA Delivery Configuration

- name: Configure KumoMTA for Email Delivery
  block:
    - name: Check if KumoMTA delivery config directory exists
      ansible.builtin.stat:
        path: /opt/kumomta/etc
      register: kumomta_etc_dir

    - name: Create email-delivery queue script
      ansible.builtin.template:
        src: email-delivery-queue.lua.j2
        dest: /opt/kumomta/etc/email-delivery-queue.lua
        owner: kumod
        group: kumod
        mode: '0644'
      notify: restart kumomta
      when: kumomta_etc_dir.stat.exists

    - name: Create email-delivery policy script
      ansible.builtin.template:
        src: email-delivery-policy.lua.j2
        dest: /opt/kumomta/etc/email-delivery-policy.lua
        owner: kumod
        group: kumod
        mode: '0644'
      notify: restart kumomta
      when: kumomta_etc_dir.stat.exists

    - name: Display KumoMTA Delivery Status
      ansible.builtin.debug:
        msg: |
          ✓ KumoMTA Delivery Configuration
          ✓ Queue Script: /opt/kumomta/etc/email-delivery-queue.lua
          ✓ Policy Script: /opt/kumomta/etc/email-delivery-policy.lua
          ✓ Delivery Routing: Enabled
          ✓ DKIM Signing: Enabled
          ✓ MX Lookup: Enabled

  rescue:
    - name: Handle KumoMTA Delivery Error
      ansible.builtin.debug:
        msg: "KumoMTA delivery configuration warning: {{ ansible_failed_result.msg }}"
