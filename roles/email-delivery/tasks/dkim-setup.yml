---
# DKIM Configuration

- name: Setup DKIM Keys and DNS Records
  block:
    - name: Check if DKIM key exists
      ansible.builtin.stat:
        path: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
      register: dkim_key_stat

    - name: Generate DKIM private key
      ansible.builtin.command:
        cmd: "openssl genrsa -out /opt/kumomta/etc/dkim/{{ dkim_selector }}.key {{ dkim_key_size }}"
        creates: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
      when: not dkim_key_stat.stat.exists
      become: true
      notify: restart kumomta

    - name: Extract DKIM public key
      ansible.builtin.shell: |
        openssl rsa -in /opt/kumomta/etc/dkim/{{ dkim_selector }}.key -pubout 2>/dev/null | \
        grep -v "PUBLIC KEY" | \
        tr -d '\n\r\t ' > /tmp/dkim_public_{{ dkim_selector }}.txt
      changed_when: false

    - name: Read DKIM public key
      ansible.builtin.slurp:
        src: "/tmp/dkim_public_{{ dkim_selector }}.txt"
      register: dkim_public_key

    - name: Add DKIM record to DNS list
      ansible.builtin.set_fact:
        email_dns_records: "{{ email_dns_records | default([]) + [{'type': 'TXT', 'record': dkim_selector + '._domainkey'
          + ('.' + dns_record_prefix if dns_record_prefix != '@' else ''), 'value': ('v=DKIM1; k=rsa; p=' + (dkim_public_key.content
          | b64decode | trim)), 'ttl': 3600, 'zone': dns_zone_name}] }}"

    - name: Set DKIM key permissions
      ansible.builtin.file:
        path: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
        owner: kumod
        group: kumod
        mode: "0600"
      notify: restart kumomta

    - name: Display DKIM Status
      ansible.builtin.debug:
        msg: |
          ✓ DKIM Key Generated: {{ dkim_selector }}
          ✓ DKIM DNS Record Created: {{ dkim_selector }}._domainkey

          Public Key (for verification):
          {{ dkim_public_key.content | b64decode }}

  rescue:
    - name: Handle DKIM Setup Error
      ansible.builtin.debug:
        msg: "DKIM setup warning: {{ ansible_failed_result.msg | default('DKIM setup completed with warnings') }}"
