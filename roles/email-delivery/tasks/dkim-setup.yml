---
# DKIM Configuration

- name: Setup DKIM Keys and DNS Records
  block:
    - name: Check if DKIM key exists
      ansible.builtin.stat:
        path: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
      register: dkim_key_stat

    - name: Generate DKIM private key
      ansible.builtin.command:
        cmd: "openssl genrsa -out /opt/kumomta/etc/dkim/{{ dkim_selector }}.key {{ dkim_key_size }}"
        creates: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
      when: not dkim_key_stat.stat.exists
      become: true
      notify: restart kumomta

    - name: Extract DKIM public key
      ansible.builtin.shell: |
        openssl rsa -in /opt/kumomta/etc/dkim/{{ dkim_selector }}.key -pubout | \
        grep -v "PUBLIC KEY" | \
        tr -d '\n' > /tmp/dkim_public_{{ dkim_selector }}.txt
      changed_when: false

    - name: Read DKIM public key
      ansible.builtin.slurp:
        src: "/tmp/dkim_public_{{ dkim_selector }}.txt"
      register: dkim_public_key

    - name: Check for existing DKIM DNS record
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records?type=TXT&name={{ dkim_selector }}._domainkey.{{ email_domain }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
      register: existing_dkim_records
      when: not skip_dkim_dns | default(false)

    - name: Update existing DKIM DNS record
      ansible.builtin.uri:
        url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records/{{ existing_dkim_records.json.result[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "TXT"
          name: "{{ dkim_selector }}._domainkey.{{ email_domain }}"
          content: "v=DKIM1; k=rsa; p={{ dkim_public_key.content | b64decode }}"
          ttl: 3600
      when: 
        - not skip_dkim_dns | default(false)
        - existing_dkim_records.json.result | length > 0
        - existing_dkim_records.json.result[0].content != ('v=DKIM1; k=rsa; p=' + (dkim_public_key.content | b64decode))

    - name: Create DKIM DNS record
      community.general.cloudflare_dns:
        zone: "{{ cloudflare_zone_name | default('nguoivietcali.com') }}"
        record: "{{ dkim_selector }}._domainkey.{{ email_domain }}"
        type: "TXT"
        value: 'v=DKIM1; k=rsa; p={{ dkim_public_key.content | b64decode }}'
        ttl: 3600
        api_token: "{{ cloudflare_api_token }}"
      register: dkim_record_result
      ignore_errors: true
      when: 
        - not skip_dkim_dns | default(false)
        - existing_dkim_records.json.result | length == 0

    - name: Set DKIM key permissions
      ansible.builtin.file:
        path: "/opt/kumomta/etc/dkim/{{ dkim_selector }}.key"
        owner: kumod
        group: kumod
        mode: '0600'
      notify: restart kumomta

    - name: Display DKIM Status
      ansible.builtin.debug:
        msg: |
          ✓ DKIM Key Generated: {{ dkim_selector }}
          ✓ DKIM DNS Record Created: {{ dkim_selector }}._domainkey

          Public Key (for verification):
          {{ dkim_public_key.content | b64decode }}

  rescue:
    - name: Handle DKIM Setup Error
      ansible.builtin.debug:
        msg: "DKIM setup warning: {{ ansible_failed_result.msg | default('DKIM setup completed with warnings') }}"
