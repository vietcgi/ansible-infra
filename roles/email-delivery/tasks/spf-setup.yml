---
# SPF Record Configuration

- name: Setup SPF Records
  block:
    - name: Extract parent domain from email_domain
      ansible.builtin.set_fact:
        parent_domain: "{{ email_domain.split('.')[-2:] | join('.') }}"

    - name: Define desired SPF value
      ansible.builtin.set_fact:
        desired_spf_value: "v=spf1 ip4:{{ email_server_ip }} {% for domain in spf_include_domains | default([]) %}include:{{
          domain }} {% endfor %}~all"

    - name: Add SPF record to DNS list
      ansible.builtin.set_fact:
        email_dns_records: "{{ email_dns_records | default([]) + [{'type': 'TXT', 'record': dns_record_prefix, 'value': desired_spf_value,
          'ttl': 3600, 'zone': dns_zone_name}] }}"
      when: not skip_spf_dns | default(false)

    - name: Add Parent SPF record to DNS list
      ansible.builtin.set_fact:
        email_dns_records: "{{ email_dns_records | default([]) + [{'type': 'TXT', 'record': '@', 'value': desired_spf_value,
          'ttl': 3600, 'zone': dns_zone_name}] }}"
      when:
        - parent_domain != email_domain
        - dns_record_prefix != '@'
        - not skip_spf_dns | default(false)

    - name: Display SPF Status
      ansible.builtin.debug:
        msg: |
          ✓ SPF Records Created
          Subdomain ({{ email_domain }}): v=spf1 mx {% for domain in spf_include_domains %}include:{{ domain }} {% endfor %}-all
          Parent Domain ({{ parent_domain }}): v=spf1 ip4:108.181.38.69 ~all

  rescue:
    - name: Handle SPF Setup Error
      ansible.builtin.debug:
        msg: "SPF setup warning: {{ ansible_failed_result.msg | default('SPF setup completed with warnings') }}"
