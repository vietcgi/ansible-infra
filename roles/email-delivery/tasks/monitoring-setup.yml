    #     mode: '0644'
    #   become: true

    - name: Create monitoring status script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Display KumoMTA monitoring and health status

          echo "=== KumoMTA Monitoring Status ==="
          echo ""

          echo "Service Status:"
          systemctl status kumomta --no-pager | head -10
          echo ""

          echo "Recent Logs (last 20 lines):"
          tail -20 /var/log/kumomta/kumomta.log || echo "No logs available"
          echo ""

          echo "Queue Depth:"
          tail -1 /var/log/kumomta/kumomta.log | grep queue_depth || echo "Queue status unavailable"
          echo ""

          echo "Running health check:"
          /usr/local/bin/kumomta-health-check.sh
        dest: /usr/local/bin/kumomta-monitoring-status.sh
        owner: root
        group: root
        mode: '0755'

    - name: Display Monitoring Status
      ansible.builtin.debug:
        msg: |
          ✓ Monitoring and Logging Configuration
          ✓ Logging: /var/log/kumomta/kumomta.log
          ✓ Log Rotation: Daily, 30-day retention
          ✓ Prometheus Metrics: Enabled on port 9184
          ✓ Health Check: /usr/local/bin/kumomta-health-check.sh
          ✓ Monitoring Status: /usr/local/bin/kumomta-monitoring-status.sh
          ✓ Alert Rules: /opt/kumomta/etc/metrics/prometheus-alerts.yml

  rescue:
    - name: Handle Monitoring Setup Error
      ansible.builtin.debug:
        msg: "Monitoring setup warning: {{ ansible_failed_result.msg }}"
