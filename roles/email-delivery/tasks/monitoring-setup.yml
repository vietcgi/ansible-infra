---
# Monitoring and Observability Configuration

- name: Setup Monitoring and Logging
  block:
    - name: Create Prometheus metrics configuration
      ansible.builtin.copy:
        content: |
          # Prometheus scrape configuration for KumoMTA metrics
          # Add this to your Prometheus configuration:
          #
          # scrape_configs:
          #   - job_name: 'kumomta'
          #     static_configs:
          #       - targets: ['{{ email_server_ip }}:9184']
          #
          # Key metrics to monitor:
          # - kumomta_messages_accepted_total
          # - kumomta_messages_delivered_total
          # - kumomta_messages_bounced_total
          # - kumomta_messages_failed_total
          # - kumomta_queue_depth
          # - kumomta_delivery_latency_seconds
          # - kumomta_connection_errors_total
          # - kumomta_dkim_sign_failures_total
        dest: /opt/kumomta/etc/metrics/prometheus-config.txt
        owner: kumod
        group: kumod
        mode: '0640'

    - name: Create health check script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # KumoMTA Health Check Script

          # Check if service is running
          if ! systemctl is-active --quiet kumomta; then
            echo "WARNING: KumoMTA service is not running"
            exit 0
          fi

          # Check port bindings
          PORTS_LISTENING=$(ss -tlnp 2>/dev/null | grep kumomta | grep -E ":(25|587|465)" || netstat -tlnp 2>/dev/null | grep kumomta | grep -E ":(25|587|465)" || true)
          if [ -z "$PORTS_LISTENING" ]; then
            echo "WARNING: Expected SMTP ports (25/587/465) not listening"
            exit 0
          fi

          # Check certificate validity
          if [ -f "/opt/kumomta/etc/certs/kumomta.crt" ]; then
            EXPIRY=$(openssl x509 -enddate -noout -in /opt/kumomta/etc/certs/kumomta.crt | cut -d= -f2)
            echo "Certificate valid until: $EXPIRY"
          fi

          # Check DKIM keys
          DKIM_KEYS=$(find /opt/kumomta/etc/dkim -name "*.key" 2>/dev/null | wc -l)
          if [ "$DKIM_KEYS" -eq 0 ]; then
            echo "WARNING: No DKIM keys found"
            exit 0
          fi

          echo "✓ KumoMTA health check passed"
          echo "✓ Service running"
          echo "✓ Ports listening"
          echo "✓ DKIM keys: $DKIM_KEYS"

          exit 0
        dest: /usr/local/bin/kumomta-health-check.sh
        owner: root
        group: root
        mode: '0755'

    - name: Create monitoring alerts configuration
      ansible.builtin.copy:
        content: |
          # KumoMTA Monitoring Alerts
          # Use these alert rules in Prometheus for alerting

          groups:
          - name: kumomta_alerts
            rules:
            - alert: KumoMTAServiceDown
              expr: up{job="kumomta"} == 0
              for: 1m
              annotations:
                summary: "KumoMTA service is down"
                description: "KumoMTA on {{ email_server_ip }} has been unavailable for 1 minute"

            - alert: KumoMTAQueueBacklog
              expr: kumomta_queue_depth > 1000
              for: 5m
              annotations:
                summary: "KumoMTA queue depth is high"
                description: "Queue depth has exceeded 1000 messages"

            - alert: KumoMTAHighBounceRate
              expr: rate(kumomta_messages_bounced_total[5m]) > 0.05
              for: 10m
              annotations:
                summary: "KumoMTA bounce rate is high"
                description: "More than 5% of messages are bouncing"

            - alert: KumoMTAHighFailureRate
              expr: rate(kumomta_messages_failed_total[5m]) > 0.02
              for: 10m
              annotations:
                summary: "KumoMTA failure rate is high"
                description: "More than 2% of messages are failing"

            - alert: KumoMTACertificateExpiring
              expr: (kumomta_certificate_expiry_seconds - time()) < 604800
              for: 1h
              annotations:
                summary: "KumoMTA certificate expiring soon"
                description: "Certificate will expire in less than 7 days"

            - alert: KumoMTADKIMSigningFailures
              expr: rate(kumomta_dkim_sign_failures_total[5m]) > 0
              for: 5m
              annotations:
                summary: "KumoMTA DKIM signing failures detected"
                description: "DKIM signing is failing for messages"
        dest: /opt/kumomta/etc/metrics/prometheus-alerts.yml
        owner: kumod
        group: kumod
        mode: '0640'

