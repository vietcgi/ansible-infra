---
# Email Delivery Platform Setup

- name: Email Delivery Platform Setup
  block:
    - name: Initialize DNS variables
      ansible.builtin.set_fact:
        email_dns_records: []
        # Use cloudflare_zone_name if provided by playbook, otherwise fall back to email_domain
        dns_zone_name: "{{ cloudflare_zone_name | default(email_domain, true) }}"

    - name: Calculate DNS record prefix (subdomain)
      ansible.builtin.set_fact:
        # If email_domain is "sub.example.com" and zone is "example.com", prefix is "sub"
        # If email_domain is "example.com" and zone is "example.com", prefix is "@"
        dns_record_prefix: "{{ email_domain | regex_replace('.' + dns_zone_name + '$', '') if email_domain != dns_zone_name
          else '@' }}"

    - name: Configure Cloudflare DNS Records (A/MX)
      ansible.builtin.include_tasks: cloudflare-dns.yml
      when: cloudflare_api_token is defined and cloudflare_api_token != ""

    - name: Configure DKIM Keys (Generate Keys & Fact)
      ansible.builtin.include_tasks: dkim-setup.yml

    - name: Configure SPF Records (Generate Fact)
      ansible.builtin.include_tasks: spf-setup.yml

    - name: Configure DMARC Records (Generate Fact)
      ansible.builtin.include_tasks: dmarc-setup.yml

    - name: Debug DNS records before dispatch
      ansible.builtin.debug:
        msg: "Email DNS records to be created: {{ email_dns_records | to_nice_json }}"

    - name: Dispatch DNS Configuration (Provider Agnostic)
      ansible.builtin.include_tasks: dns-configure.yml

    # ========== DNS VERIFICATION TASKS ==========
    # Verification is now handled by the provider roles or manual verification
    # Legacy verification tasks removed to support multi-provider setup

    - name: Configure TLS Certificates
      ansible.builtin.include_tasks: tls-certificates.yml

    - name: Configure KumoMTA for Delivery
      ansible.builtin.include_tasks: kumomta-delivery.yml

    - name: Configure Email Routing
      ansible.builtin.include_tasks: email-routing.yml

    - name: Setup Monitoring
      ansible.builtin.include_tasks: monitoring-setup.yml
      when: monitoring_enabled | bool

    - name: Display Configuration Summary
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║          EMAIL DELIVERY PLATFORM CONFIGURED                    ║
          ║════════════════════════════════════════════════════════════════╝

          Domain: {{ email_domain }}
          Server IP: {{ email_server_ip }}
          Hostname: {{ email_hostname }}

          DNS Records Configured:
            ✓ A Record: {{ email_domain }} → {{ email_server_ip }}
            ✓ MX Record: 10 {{ email_domain }}
            ✓ SPF Record: v=spf1 mx -all
            ✓ DKIM Record: selector={{ dkim_selector }}
            ✓ DMARC Record: p={{ dmarc_policy }}

          TLS Certificates:
            ✓ Let's Encrypt certificates configured
            ✓ Domains: {{ letsencrypt_domains | join(', ') }}

          KumoMTA Configuration:
            ✓ SMTP Listener: port 25
            ✓ Submission: port 587
            ✓ TLS/SSL: port 465
            ✓ DKIM Signing: enabled
            ✓ Message Delivery: enabled

          Next Steps:
          1. Verify DNS propagation (24-48 hours)
          2. Monitor email delivery logs
          3. Setup DMARC reporting
          4. Monitor sender reputation

          ═══════════════════════════════════════════════════════════════════

  rescue:
    - name: Handle Setup Error
      ansible.builtin.debug:
        msg: "Email delivery setup warning: {{ ansible_failed_result.msg | default('Setup completed with warnings') }}"
