---
# pfSense Firewall Role - Defaults

pfsense_enabled: true

# SSH Configuration (uses ansible_user and ansible_ssh_private_key_file)
pfsensible_setup: true

# HA Configuration
pfsense_ha_enabled: false
pfsense_ha_mode: carp
pfsense_ha_vhid: 1
pfsense_ha_advskew_primary: 10
pfsense_ha_advskew_secondary: 200
pfsense_ha_virtual_ip: ""
pfsense_ha_virtual_ipv6: ""

# Interface Configuration
pfsense_interfaces: []
# Firewall Rules
pfsense_firewall_rules: []
# NAT Rules
pfsense_nat_rules: []
# IPsec VPN
pfsense_ipsec_enabled: false
pfsense_ipsec_tunnels: []
# System Settings
pfsense_hostname: pfsense
pfsense_domain: ""
pfsense_timezone: UTC
pfsense_dns_servers:
  - 8.8.8.8
  - 1.1.1.1

# Backup
pfsense_backup_enabled: false
pfsense_backup_schedule: "0 2 * * *"
