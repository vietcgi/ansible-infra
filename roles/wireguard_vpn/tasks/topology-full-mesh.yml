---
# Full Mesh Wireguard Topology Configuration

- name: Configure Full Mesh Wireguard Topology
  block:
    - name: Validate full mesh configuration
      ansible.builtin.assert:
        that:
          - wireguard_full_mesh_nodes is defined
          - wireguard_full_mesh_nodes | length >= 2
          - inventory_hostname in wireguard_full_mesh_nodes
        fail_msg: |
          Full mesh requires:
          1. At least 2 nodes defined in wireguard_full_mesh_nodes
          2. Current host ({{ inventory_hostname }}) must be in wireguard_full_mesh_nodes

    - name: Validate each node has required attributes
      ansible.builtin.assert:
        that:
          - item.value.vpn_ip is defined
          - item.value.public_endpoint is defined
        fail_msg: "Node {{ item.key }} missing vpn_ip or public_endpoint"
      loop: "{{ wireguard_full_mesh_nodes | dict2items }}"

    - name: Get current node configuration
      ansible.builtin.set_fact:
        current_node_config: "{{ wireguard_full_mesh_nodes[inventory_hostname] }}"

    - name: Generate or retrieve public key for this node
      block:
        - name: Check if public key file exists
          ansible.builtin.stat:
            path: "/etc/wireguard/{{ wireguard_interface }}_public.key"
          register: pubkey_file

        - name: Read existing public key
          ansible.builtin.slurp:
            src: "/etc/wireguard/{{ wireguard_interface }}_public.key"
          register: pubkey_content
          when: pubkey_file.stat.exists

        - name: Use existing or generate public key
          ansible.builtin.set_fact:
            node_public_key: "{{ pubkey_content.content | b64decode | trim }}"
          when: pubkey_file.stat.exists

        - name: Use provided public key if available
          ansible.builtin.set_fact:
            node_public_key: "{{ current_node_config.public_key }}"
          when:
            - not pubkey_file.stat.exists
            - current_node_config.public_key is defined

    - name: Collect peer public keys from all nodes (via fact gathering)
      ansible.builtin.set_fact:
        wireguard_peer_vpn_ips: "{{ wireguard_full_mesh_nodes.values() | map(attribute='vpn_ip') | list | difference([current_node_config.vpn_ip])
          }}"

    - name: Display full mesh topology configuration
      ansible.builtin.debug:
        msg: |
          Full Mesh Wireguard Topology
          ============================
          Node: {{ inventory_hostname }}
          VPN IP: {{ current_node_config.vpn_ip }}
          Public Endpoint: {{ current_node_config.public_endpoint }}
          Total Peers: {{ wireguard_full_mesh_nodes | length - 1 }}

          This node will peer with:
          {% for peer_name, peer_data in wireguard_full_mesh_nodes.items() %}
          {% if peer_name != inventory_hostname %}- {{ peer_name }}: {{ peer_data.vpn_ip }} ({{ peer_data.public_endpoint }})
          {% endif %}
          {% endfor %}

  rescue:
    - name: Handle full mesh configuration error
      ansible.builtin.fail:
        msg: "Full mesh topology configuration failed: {{ ansible_failed_result.msg }}"
