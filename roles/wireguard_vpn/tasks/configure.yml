---
# Wireguard Interface Configuration Tasks

- name: Configure Wireguard Interface
  block:
    - name: Create Wireguard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: '0700'

    - name: Set Wireguard interface configuration variables
      ansible.builtin.set_fact:
        wg_config_path: "/etc/wireguard/{{ wireguard_interface }}.conf"

    - name: Template Wireguard configuration
      ansible.builtin.template:
        src: wireguard.conf.j2
        dest: "{{ wg_config_path }}"
        owner: root
        group: root
        mode: '0600'
      notify: restart wireguard

    - name: Configure Wireguard interface IP address
      ansible.builtin.shell: |
        # Get the VPN IP for this node
        VPN_IP="{{ wireguard_full_mesh_nodes[inventory_hostname].vpn_ip }}/32"

        # Create the interface
        ip link add dev {{ wireguard_interface }} type wireguard || true

        # Add the IP address
        ip addr add ${VPN_IP} dev {{ wireguard_interface }} 2>/dev/null || true

        # Bring the interface up
        ip link set {{ wireguard_interface }} up
      args:
        executable: /bin/bash
      become: true
      changed_when: false

    - name: Enable Wireguard service
      ansible.builtin.systemd:
        name: "wg-quick@{{ wireguard_interface }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Display configuration status
      ansible.builtin.debug:
        msg: |
          Wireguard configured on {{ inventory_hostname }}
          Interface: {{ wireguard_interface }}
          VPN Network: {{ wireguard_vpn_network }}
          Listen Port: {{ wireguard_port }}

  rescue:
    - name: Handle configuration error
      ansible.builtin.fail:
        msg: "Failed to configure Wireguard: {{ ansible_failed_result.msg }}"
