---
# Wireguard VPN Handlers

- name: restart wireguard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted
    daemon_reload: true

- name: reload wireguard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: reloaded
    daemon_reload: true

- name: restart networking
  ansible.builtin.systemd:
    name: networking
    state: restarted
