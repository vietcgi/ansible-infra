---
# Convergence playbook for Wireguard Full Mesh testing

- name: Converge - Wireguard Full Mesh Topology
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Wireguard and dependencies
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - net-tools
          - curl
          - iputils-ping
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: wireguard_vpn
      vars:
        wireguard_topology: full_mesh
        wireguard_full_mesh_nodes:
          node1:
            vpn_ip: 10.100.0.1
            public_endpoint: "172.20.0.11:51820"
            public_key: "{{ hostvars['node1'].get('wireguard_public_key', 'PLACEHOLDER') }}"
          node2:
            vpn_ip: 10.100.0.2
            public_endpoint: "172.20.0.12:51820"
            public_key: "{{ hostvars['node2'].get('wireguard_public_key', 'PLACEHOLDER') }}"
          node3:
            vpn_ip: 10.100.0.3
            public_endpoint: "172.20.0.13:51820"
            public_key: "{{ hostvars['node3'].get('wireguard_public_key', 'PLACEHOLDER') }}"

  post_tasks:
    - name: Display Wireguard interface status
      ansible.builtin.shell: |
        ip link show wg0 2>/dev/null || echo "Interface not up yet"
        wg show 2>/dev/null || echo "Wireguard not initialized"
      register: wg_status
      changed_when: false

    - name: Show Wireguard status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout_lines }}"
