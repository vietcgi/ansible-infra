---
# Molecule configuration for Wireguard Full Mesh topology testing

dependency:
  name: galaxy

driver:
  name: docker

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      localhost:
        wireguard_interface: wg0
        wireguard_port: 51820
        wireguard_vpn_network: 10.100.0.0/24
        wireguard_vpn_mtu: 1420
        wireguard_persistent_keepalive: 25
        wireguard_enable_ip_forward: true
        wireguard_dns_servers:
          - 8.8.8.8
          - 1.1.1.1

verifier:
  name: ansible
  playbooks:
    verify: verify.yml

platforms:
  - name: node1
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    privileged: true
    mounts:
      - source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        type: bind
    command: /lib/systemd/systemd-cgroups-agent
    environment:
      container: docker
    networks:
      - name: wg-test
        ipv4_address: 172.20.0.11

  - name: node2
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    privileged: true
    mounts:
      - source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        type: bind
    command: /lib/systemd/systemd-cgroups-agent
    environment:
      container: docker
    networks:
      - name: wg-test
        ipv4_address: 172.20.0.12

  - name: node3
    image: geerlingguy/docker-ubuntu2204-ansible
    pre_build_image: true
    privileged: true
    mounts:
      - source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        type: bind
    command: /lib/systemd/systemd-cgroups-agent
    environment:
      container: docker
    networks:
      - name: wg-test
        ipv4_address: 172.20.0.13
