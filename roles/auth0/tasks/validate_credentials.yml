---
# Validate Auth0 credentials and connectivity

- name: Check Auth0 domain is set
  assert:
    that:
      - auth0_domain is defined
      - auth0_domain | length > 0
    fail_msg: "auth0_domain must be defined (e.g., 'acme-corp.auth0.com')"
    success_msg: "Auth0 domain configured: {{ auth0_domain }}"
  tags:
    - auth0
    - validation

- name: Check Auth0 client credentials
  assert:
    that:
      - auth0_client_id is defined
      - auth0_client_id | length > 0
      - auth0_client_secret is defined
      - auth0_client_secret | length > 0
    fail_msg: "Auth0 client_id and client_secret must be defined (set via vault)"
    success_msg: "Auth0 credentials configured"
  tags:
    - auth0
    - validation

- name: Install auth0-python module
  pip:
    name: auth0-python
    state: present
  become: "{{ 'yes' if ansible_os_family != 'Darwin' else 'no' }}"
  tags:
    - auth0
    - validation

- name: Validate Auth0 connectivity
  block:
    - name: Create temporary script to test Auth0 connection
      copy:
        content: |
          #!/usr/bin/env python3
          import sys
          import json
          from auth0.authentication import GetToken

          try:
              domain = "{{ auth0_domain }}"
              client_id = "{{ auth0_client_id }}"
              client_secret = "{{ auth0_client_secret }}"

              # Get management API token
              get_token = GetToken(domain)
              token = get_token.client_credentials(
                  client_id=client_id,
                  client_secret=client_secret,
                  audience=f'https://{domain}/api/v2/'
              )

              # Test: get tenant info
              import requests
              headers = {'Authorization': f'Bearer {token}'}
              response = requests.get(
                  f'https://{domain}/api/v2/tenants/settings',
                  headers=headers
              )

              if response.status_code == 200:
                  print("SUCCESS: Auth0 connection validated")
                  sys.exit(0)
              else:
                  print(f"ERROR: Auth0 API returned {response.status_code}")
                  print(response.text)
                  sys.exit(1)

          except Exception as e:
              print(f"ERROR: Failed to connect to Auth0: {str(e)}")
              sys.exit(1)
        dest: /tmp/auth0_test.py
        mode: '0755'
      register: auth0_test_script
      tags:
        - auth0
        - validation

    - name: Run Auth0 connection test
      shell: python3 /tmp/auth0_test.py
      changed_when: false
      register: auth0_connection_result
      failed_when: false
      tags:
        - auth0
        - validation

    - name: Check Auth0 connection result
      assert:
        that:
          - auth0_connection_result.rc == 0
        fail_msg: |
          Failed to connect to Auth0:
          {{ auth0_connection_result.stdout }}
          {{ auth0_connection_result.stderr }}
        success_msg: "Auth0 API connection successful"
      tags:
        - auth0
        - validation

    - name: Clean up test script
      file:
        path: /tmp/auth0_test.py
        state: absent
      tags:
        - auth0
        - validation

  rescue:
    - name: Auth0 validation failed
      fail:
        msg: |
          Auth0 credential validation failed. Please check:
          1. auth0_domain is correct (from Auth0 dashboard)
          2. auth0_client_id and auth0_client_secret are valid
          3. You have created a Machine-to-Machine application in Auth0
          4. The M2M app has "Auth0 Management API" permission with all scopes
          5. Network connectivity to Auth0 is available

  tags:
    - auth0
    - validation

- name: Display Auth0 validation success
  debug:
    msg: |
      ✓ Auth0 Credentials Validated
      ✓ Domain: {{ auth0_domain }}
      ✓ API Connection: OK
  tags:
    - auth0
    - validation
