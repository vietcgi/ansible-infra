---
# Configure Auth0 roles and permissions (RBAC)

- name: Display roles to be configured
  ansible.builtin.debug:
    msg: |
      Configuring {{ auth0_roles | length }} roles in Auth0:
      {% for role in auth0_roles %}
      - {{ role.name }}: {{ role.permissions | length }} permissions
      {% endfor %}
  when: auth0_roles | length > 0
  tags:
    - auth0
    - rbac

