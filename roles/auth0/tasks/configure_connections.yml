---
# Configure Auth0 connections (social/enterprise login)

- name: Display connections to be configured
  ansible.builtin.debug:
    msg: |
      Configuring {{ auth0_connections | length }} connections:
      {% for conn in auth0_connections %}
      - {{ conn.name }} ({{ conn.strategy }}): {% if conn.enabled %}enabled{% else %}disabled{% endif %}
      {% endfor %}
  tags:
    - auth0
    - connections

