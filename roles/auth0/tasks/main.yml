---
# Auth0 Role - Main Task Orchestrator
# Manages Auth0 tenant configuration via API

- name: Validate Auth0 credentials
  ansible.builtin.import_tasks: validate_credentials.yml
  tags:
    - auth0
    - validation
    - always

- name: Create Auth0 applications
  ansible.builtin.import_tasks: create_applications.yml
  when: auth0_applications | length > 0
  tags:
    - auth0
    - applications

- name: Configure Auth0 API
  ansible.builtin.import_tasks: configure_api.yml
  when: auth0_api.name is defined
  tags:
    - auth0
    - api

- name: Create Auth0 roles and permissions
  ansible.builtin.import_tasks: configure_roles.yml
  when: auth0_roles | length > 0
  tags:
    - auth0
    - rbac

- name: Manage Auth0 users
  ansible.builtin.import_tasks: manage_users.yml
  when: auth0_users | length > 0
  tags:
    - auth0
    - users

- name: Configure Auth0 connections
  ansible.builtin.import_tasks: configure_connections.yml
  when: auth0_connections is defined
  tags:
    - auth0
    - connections

- name: Configure Auth0 settings
  ansible.builtin.import_tasks: configure_settings.yml
  tags:
    - auth0
    - settings

- name: Generate client configuration files
  ansible.builtin.import_tasks: generate_configs.yml
  tags:
    - auth0
    - configuration

- name: Display Auth0 setup summary
  ansible.builtin.debug:
    msg: |
      ========================================
      Auth0 Configuration Complete
      ========================================

      Tenant Domain: {{ auth0_domain }}
      Applications Created: {{ auth0_applications | length }}
      Users Added: {{ auth0_users | length }}
      Roles Created: {{ auth0_roles | length }}

      Login URL: https://{{ auth0_domain }}/u/login
      Management Dashboard: https://manage.auth0.com

      Next Steps:
      1. Verify applications in Auth0 dashboard
      2. Test user logins
      3. Deploy application configs from generated files
      ========================================
  tags:
    - auth0
    - summary
