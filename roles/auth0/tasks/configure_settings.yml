---
# Configure Auth0 tenant settings

- name: Configure Auth0 settings
  debug:
    msg: |
      Configuring Auth0 settings:
      - MFA: {% if auth0_mfa_enabled %}enabled{% else %}disabled{% endif %}
      - Password Policy: {{ auth0_password_policy }}
      - Rate Limiting: {% if auth0_rate_limits.enabled %}enabled{% endif %}
      - Log Retention: {{ auth0_log_retention_days }} days
  tags:
    - auth0
    - settings

