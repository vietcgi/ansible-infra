---
# Configure Auth0 API resource

- name: Display API configuration
  ansible.builtin.debug:
    msg: |
      Configuring API: {{ auth0_api.name }}
      Identifier: {{ auth0_api.identifier }}
      Scopes: {{ auth0_api.scopes | length }}
  when: auth0_api.name is defined
  tags:
    - auth0
    - api

