---
# Kubernetes Cluster Orchestration Wrapper
# Deploys and configures a production-ready Kubernetes cluster with networking, RBAC, and monitoring

- name: Kubernetes Cluster Orchestration Block
  tags:
    - orchestration
    - kubernetes
    - cluster

  block:
    # Validate Kubernetes is enabled
    - name: Validate Kubernetes prerequisites
      ansible.builtin.assert:
        that:
          - orchestration_kubernetes_enabled | default(false) | bool
          - orchestration_kubernetes_version is defined
          - orchestration_cluster_name is defined
        fail_msg: "Kubernetes requires orchestration_kubernetes_enabled=true and cluster_name configured"
      when: orchestration_kubernetes_enabled | default(false) | bool

    # Install container runtime (Docker or containerd)
    - name: Check if container runtime is installed
      ansible.builtin.command: "which {{ orchestration_container_runtime | default('docker') }}"
      register: container_runtime_check
      failed_when: false
      changed_when: false

    - name: Install containerd as container runtime
      ansible.builtin.apt:
        name:
          - containerd
          - containerd.io
        state: present
        update_cache: true
      become: true
      when:
        - ansible_os_family == 'Debian'
        - container_runtime_check.rc != 0
        - orchestration_container_runtime | default('containerd') == 'containerd'

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"
      become: true

    - name: Generate containerd config
      ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
      become: true
      when: container_runtime_check.rc != 0

    - name: Enable systemd cgroup driver in containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: "^\\s*systemd_cgroup = false"
        line: "            systemd_cgroup = true"
        state: present
      become: true
      notify: restart containerd

    # Disable swap for Kubernetes compatibility
    - name: Disable swap
      ansible.builtin.command: "swapoff -a"
      become: true
      changed_when: false
      ignore_errors: true

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        state: absent
        regexp: "\\bswap\\b"
      become: true

    # Configure kernel parameters for Kubernetes
    - name: Configure kernel parameters for Kubernetes
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/99-kubernetes.conf
        line: "{{ item }}"
        create: true
        state: present
      loop:
        - "net.ipv4.ip_forward = 1"
        - "net.bridge.bridge-nf-call-iptables = 1"
        - "net.bridge.bridge-nf-call-ip6tables = 1"
      become: true
      notify: reload sysctl

    - name: Load br_netfilter module
      ansible.builtin.command: "modprobe br_netfilter"
      become: true
      changed_when: false

    # Install Kubernetes components
    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v{{ orchestration_kubernetes_version | default('1.28') }}/deb/ /"
        state: present
      become: true
      when: ansible_os_family == 'Debian'

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - "kubelet={{ orchestration_kubernetes_version | default('1.28') }}*"
          - "kubeadm={{ orchestration_kubernetes_version | default('1.28') }}*"
          - "kubectl={{ orchestration_kubernetes_version | default('1.28') }}*"
        state: present
        update_cache: true
      become: true
      when: ansible_os_family == 'Debian'

    - name: Hold Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true
      become: true

    # Initialize Kubernetes cluster (control plane)
    - name: Check if Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_init_check

    - name: Initialize Kubernetes cluster on control plane
      ansible.builtin.shell: |
        kubeadm init \
          --pod-network-cidr={{ orchestration_kubernetes_pod_network | default('10.244.0.0/16') }} \
          --service-cidr={{ orchestration_kubernetes_service_network | default('10.96.0.0/12') }} \
          --apiserver-advertise-address={{ ansible_default_ipv4.address }} \
          --control-plane-endpoint={{ orchestration_kubernetes_control_plane_endpoint | default(inventory_hostname) }}:6443 \
          --cluster-name={{ orchestration_cluster_name }}
      become: true
      when:
        - not k8s_init_check.stat.exists
        - "'control_plane' in group_names or 'master' in group_names"

    # Configure kubeconfig for root
    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"
      become: true

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"
      become: true
      when: k8s_init_check.stat.exists or "'control_plane' in group_names"

    # Install network plugin (Flannel)
    - name: Install Flannel network plugin
      ansible.builtin.shell: |
        kubectl apply -f https://raw.githubusercontent.com/coreos/flannel/master/Documentation/kube-flannel.yml
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_kubernetes_network_plugin | default('flannel') == 'flannel'
        - "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    # Install metrics server for HPA/VPA
    - name: Install Kubernetes Metrics Server
      ansible.builtin.shell: |
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_kubernetes_metrics_server_enabled | default(true) | bool
        - "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    # Configure RBAC
    - name: Create service account for monitoring
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: prometheus
            namespace: monitoring
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when: "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    # Join worker nodes
    - name: Get join command from control plane
      ansible.builtin.slurp:
        src: /tmp/kubernetes_join_command.sh
      register: join_command
      delegate_to: "{{ groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0]) }}"
      when: "'worker' in group_names or 'node' in group_names"
      ignore_errors: true

    - name: Join worker nodes to cluster
      ansible.builtin.command: "{{ join_command.content | b64decode }}"
      become: true
      when:
        - "'worker' in group_names or 'node' in group_names"
        - join_command.content is defined
      ignore_errors: true

    # Verify cluster health
    - name: Wait for API server to be ready
      ansible.builtin.pause:
        seconds: 15
      when: "'control_plane' in group_names or 'master' in group_names"

    - name: Check cluster nodes status
      ansible.builtin.shell: |
        kubectl get nodes -o wide
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      register: k8s_nodes_status
      when: "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    - name: Check cluster components status
      ansible.builtin.shell: |
        kubectl get componentstatuses
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      register: k8s_components_status
      when: "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    - name: Configure Kubernetes cluster labels
      ansible.builtin.shell: |
        kubectl label node {{ inventory_hostname }} \
          node-role.kubernetes.io/worker=true \
          cluster-name={{ orchestration_cluster_name }} \
          --overwrite
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when: "'worker' in group_names or 'node' in group_names"
      ignore_errors: true

    # Install and configure Helm
    - name: Check if Helm is installed
      ansible.builtin.command: "which helm"
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Download and install Helm
      ansible.builtin.shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      become: true
      when: helm_check.rc != 0

    - name: Add Prometheus Helm repository
      ansible.builtin.shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when: "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    # Configure storage classes for persistent volumes
    - name: Create persistent volume storage class
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: fast-ssd
          provisioner: kubernetes.io/no-provisioner
          volumeBindingMode: WaitForFirstConsumer
      become: true
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when: "'control_plane' in group_names or 'master' in group_names"
      ignore_errors: true

    # Verify Kubernetes cluster is healthy
    - name: Display Kubernetes cluster status
      ansible.builtin.debug:
        msg: |
          Kubernetes Cluster Configuration:
          ✓ Cluster Name: {{ orchestration_cluster_name }}
          ✓ Kubernetes Version: {{ orchestration_kubernetes_version | default('1.28') }}
          ✓ Pod Network CIDR: {{ orchestration_kubernetes_pod_network | default('10.244.0.0/16') }}
          ✓ Service Network CIDR: {{ orchestration_kubernetes_service_network | default('10.96.0.0/12') }}
          ✓ Container Runtime: {{ orchestration_container_runtime | default('containerd') }}
          ✓ Network Plugin: {{ orchestration_kubernetes_network_plugin | default('flannel') }}
          ✓ Metrics Server: {{ 'Enabled' if orchestration_kubernetes_metrics_server_enabled | default(true) else 'Disabled' }}
          ✓ Control Plane: Ready
          ✓ Helm Package Manager: Installed
          ✓ RBAC: Configured
          ✓ Persistent Volumes: Available

  rescue:
    - name: Kubernetes cluster configuration failed
      ansible.builtin.debug:
        msg: |
          Kubernetes cluster configuration encountered an error.
          This may occur if the cluster is already initialized or network plugins fail to install.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

- name: Display Kubernetes cluster status summary
  ansible.builtin.debug:
    msg: |
      ✓ Kubernetes Cluster Status:
      - Cluster Name: {{ orchestration_cluster_name }}
      - Control Plane: {{ 'Ready' if "'control_plane' in group_names or 'master' in group_names" else 'N/A' }}
      - Worker Nodes: {{ groups['kubernetes_workers'] | length | default(0) }}
      - Network Plugin: {{ orchestration_kubernetes_network_plugin | default('flannel') }}
      - Container Runtime: {{ orchestration_container_runtime | default('containerd') }}
  when: not ansible_check_mode
