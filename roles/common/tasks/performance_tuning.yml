---
# Performance Tuning - System-wide Optimization
# CPU, memory, I/O, and network optimization for production workloads
# Auto-detects bare metal vs VPS - can override with performance_tuning_enabled

- name: Detect if running on bare metal or VM
  ansible.builtin.set_fact:
    is_bare_metal: "{{ ansible_virtualization_role | default('host') == 'host' or ansible_virtualization_type | default('NA') in ['NA', 'kvm'] }}"
    is_full_vm: "{{ ansible_virtualization_type | default('NA') in ['kvm', 'vmware', 'virtualbox', 'hyperv'] and ansible_virtualization_role | default('guest') == 'guest' }}"
    is_container: "{{ ansible_virtualization_type | default('NA') in ['docker', 'lxc', 'podman', 'openvz', 'containerd'] }}"
  tags:
    - performance_tuning

- name: Set performance tuning based on environment
  ansible.builtin.set_fact:
    _perf_tuning_enabled: >-
      {{ performance_tuning_enabled if performance_tuning_enabled is defined
         else (is_bare_metal | default(false) or is_full_vm | default(false)) }}
  tags:
    - performance_tuning

- name: Display detected environment
  ansible.builtin.debug:
    msg: |
      Environment Detection:
        Virtualization type: {{ ansible_virtualization_type | default('NA') }}
        Virtualization role: {{ ansible_virtualization_role | default('host') }}
        Is bare metal: {{ is_bare_metal }}
        Is full VM: {{ is_full_vm }}
        Is container: {{ is_container }}
        Performance tuning: {{ 'ENABLED' if _perf_tuning_enabled else 'DISABLED' }}
  tags:
    - performance_tuning

- name: Configure CPU scheduler for performance
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    # CPU scheduling - may not exist on all kernels/VPS environments
    - { key: "kernel.sched_migration_cost_ns", value: "5000000" }
    - { key: "kernel.sched_latency_ns", value: "24000000" }
    - { key: "kernel.sched_wakeup_granularity_ns", value: "4000000" }
    - { key: "kernel.sched_min_granularity_ns", value: "2000000" }
  failed_when: false
  when: _perf_tuning_enabled | default(false)
  tags:
    - performance_tuning
    - cpu

- name: Optimize memory management
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { key: "vm.swappiness", value: "10" }
    - { key: "vm.dirty_ratio", value: "15" }
    - { key: "vm.dirty_background_ratio", value: "5" }
    - { key: "vm.dirty_writeback_centisecs", value: "500" }
    - { key: "vm.dirty_expire_centisecs", value: "3000" }
    - { key: "vm.page-cluster", value: "3" }
    - { key: "vm.zone_reclaim_mode", value: "0" }
  failed_when: false
  when: _perf_tuning_enabled | default(false)
  tags:
    - performance_tuning
    - memory

- name: Enable transparent huge pages (if supported)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX="
    line: 'GRUB_CMDLINE_LINUX="transparent_hugepage=madvise"'
    backup: true
  when:
    - _perf_tuning_enabled | default(false)
    - ansible_kernel is version('2.6.38', '>=')
  failed_when: false
  notify: update grub
  tags:
    - performance_tuning
    - memory

- name: Configure I/O scheduler for performance
  ansible.builtin.template:
    src: io-scheduler.j2
    dest: /etc/sysfs.d/io-scheduler.conf
    owner: root
    group: root
    mode: "0644"
  when: _perf_tuning_enabled | default(false)
  failed_when: false
  notify: reload systemd settings
  tags:
    - performance_tuning
    - io

- name: Optimize network buffer sizes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    # TCP send/receive buffer optimization
    - { key: "net.ipv4.tcp_rmem", value: "4096 87380 67108864" }
    - { key: "net.ipv4.tcp_wmem", value: "4096 65536 67108864" }
    - { key: "net.ipv4.udp_mem", value: "3145728 4194304 6291456" }
    # TCP Fast Open
    - { key: "net.ipv4.tcp_fastopen", value: "3" }
    # Connection backlog
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
    - { key: "net.core.somaxconn", value: "8192" }
    # TCP keepalive
    - { key: "net.ipv4.tcp_keepalive_time", value: "600" }
    - { key: "net.ipv4.tcp_keepalive_probes", value: "5" }
    - { key: "net.ipv4.tcp_keepalive_intvl", value: "15" }
  failed_when: false
  when: _perf_tuning_enabled | default(false)
  tags:
    - performance_tuning
    - network

- name: Enable TCP window scaling
  ansible.posix.sysctl:
    name: net.ipv4.tcp_window_scaling
    value: "1"
    state: present
    sysctl_set: true
  failed_when: false
  when: _perf_tuning_enabled | default(false)
  tags:
    - performance_tuning
    - network

- name: Create database-specific tuning script
  ansible.builtin.template:
    src: db-performance-tuning.j2
    dest: /opt/db-performance-tuning.sh
    owner: root
    group: root
    mode: "0755"
  when: _perf_tuning_enabled | default(false)
  failed_when: false
  tags:
    - performance_tuning
    - database

- name: Configure CPU affinity for critical processes
  ansible.builtin.template:
    src: cpu-affinity.j2
    dest: /etc/systemd/system-preset/cpu-affinity.preset
    owner: root
    group: root
    mode: "0644"
  when:
    - _perf_tuning_enabled | default(false)
    - performance_enable_cpu_affinity | default(false)
  tags:
    - performance_tuning
    - cpu

- name: Display performance tuning status
  ansible.builtin.debug:
    msg: "Performance tuning: {{ 'ENABLED (auto-detected)' if _perf_tuning_enabled else 'DISABLED (container/restricted env)' }}"
  tags:
    - performance_tuning
    - report
