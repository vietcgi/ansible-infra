---
# Kernel parameter tuning and sysctl configuration

- name: Create sysctl configuration directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: "0755"
  become: true
  when: ansible_os_family != "Darwin"

- name: Apply sysctl configuration
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctl_config | dict2items }}"
  become: true
  when: ansible_os_family != "Darwin"

- name: Display sysctl configuration summary
  ansible.builtin.debug:
    msg: "Kernel parameters configured and applied"
