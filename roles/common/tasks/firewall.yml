---
# Firewall Configuration
# Provides platform-agnostic firewall setup (UFW for Debian/Ubuntu, firewalld for RHEL)
# Enables stateful packet filtering with DDoS protection

- name: Install firewall for Debian/Ubuntu
  block:
    - name: Install UFW firewall
      ansible.builtin.package:
        name: ufw
        state: present

    - name: Enable UFW service
      ansible.builtin.systemd:
        name: ufw
        enabled: yes
        state: started

    - name: Configure UFW defaults (ingress, egress, IPv6)
      ansible.builtin.lineinfile:
        path: /etc/ufw/ufw.conf
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        backup: yes
      loop:
        - { key: 'DEFAULT_INPUT_POLICY', value: 'DROP' }
        - { key: 'DEFAULT_OUTPUT_POLICY', value: 'ACCEPT' }
        - { key: 'DEFAULT_FORWARD_POLICY', value: 'DROP' }
        - { key: 'DEFAULT_APPLICATION_POLICY', value: 'SKIP' }
        - { key: 'MANAGE_BUILTINS', value: 'yes' }
        - { key: 'IPV6', value: 'yes' }  # Full IPv6 support and hardening
        - { key: 'LOGLEVEL', value: 'low' }  # Packet logging enabled
      notify: restart ufw

    - name: Allow SSH connections
      community.general.ufw:
        rule: allow
        port: "{{ firewall_ssh_port | default(22) }}"
        proto: tcp
        comment: "Allow SSH access"
      when: firewall_allow_ssh | default(true)

    - name: Allow ICMP (ping)
      ansible.builtin.shell: |
        ufw allow in icmpv4-echo-request comment "Allow ICMP ping requests" || ufw allow in 8 || true
      changed_when: false
      when: firewall_allow_icmp | default(true)

    - name: Rate limit ICMP to prevent DoS
      ansible.builtin.shell: |
        # Check if rule already exists to avoid duplicates
        if ! ufw status numbered | grep -q "Rate limit ICMP"; then
          ufw insert 1 limit in on eth0 proto icmp comment "Rate limit ICMP" || \
          ufw insert 1 limit in proto icmp comment "Rate limit ICMP" || \
          true
        fi
      changed_when: false
      when: firewall_allow_icmp | default(true)

    - name: Configure IPv6 ICMP rate limiting
      ansible.builtin.shell: |
        # Check if rule already exists to avoid duplicates
        if ! ufw status numbered | grep -q "Rate limit ICMPv6"; then
          ufw insert 2 limit in on eth0 proto ipv6-icmp comment "Rate limit ICMPv6" || \
          ufw insert 2 limit in proto ipv6-icmp comment "Rate limit ICMPv6" || \
          true
        fi
      changed_when: false
      when:
        - firewall_allow_icmp | default(true)
        - ansible_all_ipv6_addresses is defined and ansible_all_ipv6_addresses | length > 0

    - name: Add DDoS protection with connection rate limiting
      community.general.ufw:
        rule: limit
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "DDoS protection: {{ item.description }}"
      loop:
        - { port: 22, proto: 'tcp', description: 'SSH rate limit' }
        - { port: 80, proto: 'tcp', description: 'HTTP rate limit' }
        - { port: 443, proto: 'tcp', description: 'HTTPS rate limit' }
      when: firewall_enable_ddos_protection | default(true)

    - name: Configure egress filtering rules
      ansible.builtin.shell: |
        # Allow essential outbound services
        ufw allow out 53/tcp comment "DNS over TCP" || true
        ufw allow out 53/udp comment "DNS over UDP" || true
        ufw allow out 123/udp comment "NTP" || true
        ufw allow out 25/tcp comment "SMTP" || true
        ufw allow out 587/tcp comment "SMTP TLS" || true
        ufw allow out 465/tcp comment "SMTP SSL" || true
        ufw allow out 110/tcp comment "POP3" || true
        ufw allow out 995/tcp comment "POP3 SSL" || true
        ufw allow out 143/tcp comment "IMAP" || true
        ufw allow out 993/tcp comment "IMAP SSL" || true
      changed_when: false
      when: firewall_enable_egress_filtering | default(true)

    - name: Add connection state tracking configuration
      ansible.builtin.lineinfile:
        path: /etc/ufw/ufw.conf
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        backup: yes
      loop:
        - { key: 'TRACKING', value: 'yes' }
        - { key: 'CONNECTION_RATE_LIMIT', value: '300/minute' }
      notify: restart ufw
      when: firewall_enable_stateful_tracking | default(true)

    - name: Configure IPv6-specific hardening rules
      ansible.builtin.shell: |
        # Disable IPv6 ICMP redirects at kernel level (more reliable than firewall rules)
        sysctl -w net.ipv6.conf.all.disable_ipv6=0 > /dev/null 2>&1 || true
        sysctl -w net.ipv6.conf.all.accept_redirects=0 > /dev/null 2>&1 || true
        sysctl -w net.ipv6.conf.default.accept_redirects=0 > /dev/null 2>&1 || true

        # Configure UFW to accept IPv6 (but restrict ICMPv6 via sysctl above)
        ufw --version > /dev/null 2>&1 && echo "UFW IPv6 protection via sysctl configured" || true
      changed_when: false
      when:
        - firewall_enable_ipv6_hardening | default(true)
        - ansible_all_ipv6_addresses is defined and ansible_all_ipv6_addresses | length > 0

    - name: Set UFW logging level for packet inspection
      ansible.builtin.shell: |
        ufw logging on
        ufw logging high
      changed_when: false
      when: firewall_enable_packet_logging | default(true)

    - name: Add custom firewall rules (ports and IPs)
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('tcp') }}"
        direction: "{{ item.direction | default('in') }}"
        from_ip: "{{ item.from_ip | default(omit) }}"
        to_ip: "{{ item.to_ip | default(omit) }}"
        comment: "{{ item.comment | default('') }}"
      loop: "{{ firewall_custom_rules | default([]) }}"
      when: firewall_custom_rules is defined and firewall_custom_rules | length > 0

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny
      when: firewall_enabled | default(true)

  when:
    - ansible_os_family in ['Debian']
    - firewall_enabled | default(true)
  tags:
    - firewall
    - security

- name: Install firewall for RHEL/CentOS
  block:
    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Enable firewalld service
      ansible.builtin.systemd:
        name: firewalld
        enabled: yes
        state: started

    - name: Set firewalld default zone
      ansible.posix.firewalld:
        zone: "{{ firewall_zone | default('public') }}"
        state: present
        permanent: yes

    - name: Configure firewalld to use stateful tracking
      ansible.builtin.lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: "^FirewallBackend="
        line: "FirewallBackend=nftables"
        backup: yes
      notify: restart firewalld

    - name: Enable masquerading for NAT (if needed)
      ansible.posix.firewalld:
        zone: "{{ firewall_zone | default('public') }}"
        masquerade: "{{ firewall_enable_masquerading | default(false) }}"
        permanent: yes
        state: present

    - name: Allow SSH service
      ansible.posix.firewalld:
        service: ssh
        permanent: yes
        state: enabled
        zone: "{{ firewall_zone | default('public') }}"
      when: firewall_allow_ssh | default(true)

    - name: Allow custom services
      ansible.posix.firewalld:
        service: "{{ item.service }}"
        permanent: yes
        state: "{{ item.state | default('enabled') }}"
        zone: "{{ firewall_zone | default('public') }}"
      loop: "{{ firewall_services | default([]) }}"
      when: firewall_services is defined and firewall_services | length > 0

    - name: Allow custom ports with rate limiting
      ansible.posix.firewalld:
        port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
        permanent: yes
        state: "{{ item.state | default('enabled') }}"
        zone: "{{ firewall_zone | default('public') }}"
        timeout: "{{ item.timeout | default(0) }}"
      loop: "{{ firewall_ports | default([]) }}"
      when: firewall_ports is defined and firewall_ports | length > 0
      notify: restart firewalld

    - name: Add IP-based filtering rules (rich rules)
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        permanent: yes
        state: enabled
        zone: "{{ firewall_zone | default('public') }}"
      loop: "{{ firewall_rich_rules | default([]) }}"
      when: firewall_rich_rules is defined and firewall_rich_rules | length > 0
      notify: restart firewalld

    - name: Enable ICMP (ping) with rate limiting
      block:
        - name: Create custom firewalld rule for ICMP rate limiting
          ansible.builtin.copy:
            content: |
              <?xml version="1.0" encoding="utf-8"?>
              <rule family="ipv4" priority="0">
                <icmp name="echo-request" limit value="10/m"/>
                <accept/>
              </rule>
            dest: /etc/firewalld/rules/ipv4/icmp-rate-limit.xml
            owner: root
            group: root
            mode: '0644'
          notify: restart firewalld

      when: firewall_allow_icmp | default(true)

    - name: Reload firewalld to apply changes
      ansible.builtin.systemd:
        name: firewalld
        state: reloaded
      when: firewall_enabled | default(true)

  when:
    - ansible_os_family in ['RedHat', 'Rocky', 'Alma']
    - firewall_enabled | default(true)
  tags:
    - firewall
    - security

- name: Display firewall status summary
  ansible.builtin.debug:
    msg: |
      Firewall Configuration Complete:
      ==============================
      Platform: {{ ansible_os_family }}
      {% if ansible_os_family in ['Debian'] %}
      Firewall: UFW (Uncomplicated Firewall)
      Status: {{ 'Enabled' if firewall_enabled | default(true) else 'Disabled' }}
      Default policy: DROP incoming, ACCEPT outgoing
      SSH Port: {{ firewall_ssh_port | default(22) }}
      ICMP allowed: {{ firewall_allow_icmp | default(true) }}
      {% else %}
      Firewall: firewalld (Dynamic Firewall)
      Status: {{ 'Enabled' if firewall_enabled | default(true) else 'Disabled' }}
      Zone: {{ firewall_zone | default('public') }}
      SSH allowed: {{ firewall_allow_ssh | default(true) }}
      ICMP rate limit: 10 per minute
      {% endif %}
    verbosity: 1
  tags:
    - firewall

- name: Verify firewall connectivity
  block:
    - name: Test SSH connectivity through firewall
      ansible.builtin.wait_for:
        port: "{{ firewall_ssh_port | default(22) }}"
        timeout: 5
      ignore_errors: true
      register: ssh_test
      changed_when: false

    - name: Report SSH connectivity
      ansible.builtin.debug:
        msg: "SSH port {{ firewall_ssh_port | default(22) }} is accessible"
      when: ssh_test.state == "started"
      tags:
        - firewall

  tags:
    - firewall
    - validate
