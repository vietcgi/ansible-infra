---
# User Management - Creates SSH users from managed_users configuration
# Source of truth: inventories/projects/*/group_vars/users.yml
# Access control: inventories/projects/*/group_vars/access_control.yml
# System control: inventories/projects/*/group_vars/access_systems.yml
#
# SSH Access Control is modular - it can be independently enabled/disabled
# When ssh.enabled = true:
#   - SSH users created, SSH keys active, sudo managed
# When ssh.enabled = false:
#   - No SSH user management (access through Auth0/RBAC only)

- name: Set default SSH config if not provided
  ansible.builtin.set_fact:
    ssh_config: "{{ access_systems_enabled.ssh | combine({'config_loaded': true}) }}"
  when: ssh_config is not defined or ssh_config | default({}) | length == 0
  tags:
    - users
    - user_create

- name: Display SSH Access Control status
  ansible.builtin.debug:
    msg: |
      SSH Access Control Status:
      ========================
      Enabled: {{ ssh_config.enabled | default(false) }}
      {% if ssh_config.enabled | default(false) %}
        → SSH users will be created and managed
        → SSH keys will be provisioned
        → Sudo access will be controlled
      {% else %}
        → SSH user management is DISABLED
        → Only Auth0/RBAC systems are active
      {% endif %}
    verbosity: 1  # Show at -v or higher verbosity
  when: not ansible_check_mode
  tags:
    - users
    - user_create

- name: Create user accounts from managed_users (SSH ENABLED)
  block:
    - name: Create user accounts
      ansible.builtin.user:
        name: "{{ user_item.key }}"
        state: present
        shell: "{{ user_item.value.system.shell }}"
        groups: "{{ user_item.value.system.groups | join(',') }}"
        append: yes
        createhome: yes
        home: "{{ user_item.value.system.home }}"
        comment: "{{ user_item.value.auth0.given_name }} {{ user_item.value.auth0.family_name }}"
        password: '!'  # Explicitly lock account (no password login)
        password_lock: yes  # Ensure account is locked
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: user_item
      when:
        - managed_users is defined
        - user_item.value.enabled | bool
      tags:
        - users
        - user_create
  when:
    - ssh_config is defined
    - ssh_config.enabled | bool
  tags:
    - users
    - user_create

- name: Configure sudo access for enabled users (SSH ENABLED)
  block:
    - name: Add sudo privileges for users with sudo_access enabled
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ sudo_item.key }}
        line: "{{ sudo_item.key }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        create_mode: '0440'
        mode: '0440'
        owner: root
        group: root
        backup: yes
        validate: 'visudo -cf %s'
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: sudo_item
      when:
        - managed_users is defined
        - sudo_item.value.enabled | bool
        - sudo_item.value.rbac.sudo_access | default(false) | bool
      tags:
        - users
        - user_sudo

    - name: Remove sudo privileges for users with sudo_access disabled
      ansible.builtin.file:
        path: /etc/sudoers.d/{{ sudo_item.key }}
        state: absent
        force: yes
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: sudo_item
      when:
        - managed_users is defined
        - not sudo_item.value.rbac.sudo_access | default(false) | bool
      tags:
        - users
        - user_sudo

    - name: Remove disabled users from sudoers
      ansible.builtin.file:
        path: /etc/sudoers.d/{{ sudo_item.key }}
        state: absent
        force: yes
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: sudo_item
      when:
        - managed_users is defined
        - not sudo_item.value.enabled | bool
      ignore_errors: yes
      tags:
        - users
        - user_revoke
  when:
    - ssh_config is defined
    - ssh_config.enabled | bool
  tags:
    - users
    - user_sudo

- name: Disable user shell for disabled users (SSH ENABLED, set to nologin)
  ansible.builtin.user:
    name: "{{ nologin_item.key }}"
    state: present
    shell: /sbin/nologin
  loop: "{{ managed_users | dict2items }}"
  loop_control:
    loop_var: nologin_item
  when:
    - ssh_config is defined
    - ssh_config.enabled | bool
    - managed_users is defined
    - not nologin_item.value.enabled | bool
  tags:
    - users
    - user_revoke

- name: Manage SSH authorized keys for users (SSH ENABLED)
  block:
    - name: Add SSH authorized keys for enabled users
      ansible.builtin.authorized_key:
        user: "{{ ssh_key_item.key }}"
        key: "{{ lookup('file', ssh_key_path | default('~/.ssh/id_rsa.pub')) }}"
        state: present
        exclusive: yes
        key_options: 'restrict,pty'  # Restrict key to interactive shell only, no commands
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: ssh_key_item
      when:
        - managed_users is defined
        - ssh_key_item.value.enabled | bool
        - ssh_key_item.value.system.manage_ssh_key | bool
      vars:
        ssh_key_path: "{{ ssh_public_key_path | default(lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
      tags:
        - users
        - user_ssh_keys

    - name: Remove SSH authorized keys for disabled users
      ansible.builtin.authorized_key:
        user: "{{ ssh_key_item.key }}"
        state: absent
        exclusive: yes
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: ssh_key_item
      when:
        - managed_users is defined
        - not ssh_key_item.value.enabled | bool
      tags:
        - users
        - user_revoke
  when:
    - ssh_config is defined
    - ssh_config.enabled | bool
  tags:
    - users
    - user_ssh_keys

- name: Kill active sessions for disabled users (SSH ENABLED)
  block:
    - name: Get list of active sessions for disabled users
      ansible.builtin.command: pgrep -f "sshd.*{{ session_item.key }}"
      register: active_sessions
      changed_when: false
      failed_when: active_sessions.rc not in [0, 1]  # 0=found, 1=not found (expected)
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: session_item
      when:
        - managed_users is defined
        - not session_item.value.enabled | bool
      tags:
        - users
        - user_revoke

    - name: Terminate active SSH sessions gracefully (TERM signal)
      ansible.builtin.command: "kill -TERM {{ item }}"
      loop: "{{ active_sessions.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten }}"
      when: item | length > 0
      register: term_kill_result
      failed_when: term_kill_result.rc != 0 and "'No such process' not in term_kill_result.stderr"
      tags:
        - users
        - user_revoke

    - name: Force kill lingering SSH sessions (KILL signal)
      ansible.builtin.command: "kill -9 {{ item }}"
      loop: "{{ active_sessions.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten }}"
      when:
        - item | length > 0
        - term_kill_result.failed is defined and term_kill_result.failed
      register: kill_result
      failed_when: kill_result.rc != 0 and "'No such process' not in kill_result.stderr"
      tags:
        - users
        - user_revoke
  when:
    - ssh_config is defined
    - ssh_config.enabled | bool
  tags:
    - users
    - user_revoke

- name: Audit log user management changes
  block:
    - name: Log user creation/modification
      ansible.builtin.lineinfile:
        path: /var/log/user-management.log
        line: "[{{ ansible_date_time.iso8601 }}] {{ audit_item.key }}: enabled={{ audit_item.value.enabled }} shell={{ audit_item.value.system.shell }} status_reason={{ audit_item.value.status_reason | default('') }}"
        create: yes
        create_mode: '0600'
        mode: '0600'
        owner: root
        group: root
        backup: yes
        insertafter: EOF
      loop: "{{ managed_users | dict2items }}"
      loop_control:
        loop_var: audit_item
      when: managed_users is defined
      tags:
        - users
        - user_audit

- name: Display user management summary
  ansible.builtin.debug:
    msg: |
      User Management Summary:
      ======================
      Enabled users: {{ managed_users | dict2items | selectattr('value.enabled', 'equalto', true) | map(attribute='key') | list }}
      Disabled users: {{ managed_users | dict2items | selectattr('value.enabled', 'equalto', false) | map(attribute='key') | list }}
      Total users managed: {{ managed_users | length }}
    verbosity: 1  # Show at -v or higher verbosity
  when:
    - managed_users is defined
    - not ansible_check_mode
  tags:
    - users
