---
# User Management - Creates SSH users from managed_users configuration
# Source of truth: inventories/projects/*/group_vars/users.yml
# Access control: inventories/projects/*/group_vars/access_control.yml
#
# User status is synchronized across all systems:
# - enabled: true  → user created, SSH key active, Auth0 account active
# - enabled: false → user disabled, SSH key removed, nologin shell, sessions killed

- name: Create user accounts from managed_users
  ansible.builtin.user:
    name: "{{ item.key }}"
    state: present
    shell: "{{ item.value.system.shell }}"
    groups: "{{ item.value.system.groups | join(',') }}"
    append: yes
    createhome: yes
    home: "{{ item.value.system.home }}"
    comment: "{{ item.value.auth0.given_name }} {{ item.value.auth0.family_name }}"
  loop: "{{ managed_users | dict2items }}"
  when:
    - managed_users is defined
    - item.value.enabled | bool
  tags:
    - users
    - user_create

- name: Remove disabled users from sudoers (if in sudo group)
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ item.key }}
    state: absent
  loop: "{{ managed_users | dict2items }}"
  when:
    - managed_users is defined
    - not item.value.enabled | bool
    - "'sudo' in item.value.system.groups"
  ignore_errors: yes
  tags:
    - users
    - user_revoke

- name: Disable user shell for disabled users (set to nologin)
  ansible.builtin.user:
    name: "{{ item.key }}"
    state: present
    shell: /sbin/nologin
  loop: "{{ managed_users | dict2items }}"
  when:
    - managed_users is defined
    - not item.value.enabled | bool
  tags:
    - users
    - user_revoke

- name: Manage SSH authorized keys for users
  block:
    - name: Add SSH authorized keys for enabled users
      ansible.builtin.authorized_key:
        user: "{{ item.key }}"
        key: "{{ lookup('file', ssh_key_path | default('~/.ssh/id_rsa.pub')) }}"
        state: present
        exclusive: yes
      loop: "{{ managed_users | dict2items }}"
      when:
        - managed_users is defined
        - item.value.enabled | bool
        - item.value.system.manage_ssh_key | bool
      vars:
        ssh_key_path: "{{ ssh_public_key_path | default(lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"
      tags:
        - users
        - user_ssh_keys

    - name: Remove SSH authorized keys for disabled users
      ansible.builtin.authorized_key:
        user: "{{ item.key }}"
        state: absent
        exclusive: yes
      loop: "{{ managed_users | dict2items }}"
      when:
        - managed_users is defined
        - not item.value.enabled | bool
      tags:
        - users
        - user_revoke

- name: Kill active sessions for disabled users
  block:
    - name: Get list of active sessions for disabled users
      ansible.builtin.shell: |
        set -o pipefail
        ps aux | grep -i sshd | grep {{ item.key }} | grep -v grep | awk '{print $2}' || true
      register: active_sessions
      changed_when: false
      loop: "{{ managed_users | dict2items }}"
      when:
        - managed_users is defined
        - not item.value.enabled | bool
      tags:
        - users
        - user_revoke

    - name: Terminate active SSH sessions for disabled users
      ansible.builtin.command: "kill -9 {{ item }}"
      loop: "{{ active_sessions.results | selectattr('stdout', 'ne', '') | map(attribute='stdout_lines') | flatten }}"
      when: item | length > 0
      ignore_errors: yes
      tags:
        - users
        - user_revoke

- name: Audit log user management changes
  block:
    - name: Log user creation/modification
      ansible.builtin.lineinfile:
        path: /var/log/user-management.log
        line: "[{{ ansible_date_time.iso8601 }}] {{ item.key }}: enabled={{ item.value.enabled }} shell={{ item.value.system.shell }} status_reason={{ item.value.status_reason | default('') }}"
        create: yes
        mode: '0600'
      loop: "{{ managed_users | dict2items }}"
      when: managed_users is defined
      tags:
        - users
        - user_audit

- name: Display user management summary
  ansible.builtin.debug:
    msg: |
      User Management Summary:
      ======================
      Enabled users: {{ managed_users | dict2items | selectattr('value.enabled', 'equalto', true) | map(attribute='key') | list }}
      Disabled users: {{ managed_users | dict2items | selectattr('value.enabled', 'equalto', false) | map(attribute='key') | list }}
      Total users managed: {{ managed_users | length }}
  when:
    - managed_users is defined
    - not ansible_check_mode
  tags:
    - users
