---
# Compliance Scanning & Validation
# Automated CIS, NIST, and industry compliance checking
# Compliance: CIS Benchmark, NIST SP 800-53, SOC 2, PCI DSS

- name: Skip compliance scanning if disabled
  ansible.builtin.debug:
    msg: "Compliance scanning disabled. Set compliance_scanning_enabled: true to enable."
  when: not (compliance_scanning_enabled | default(false))
  tags:
    - compliance_scanning

- name: Install core compliance scanning tools
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - lynis
    - chkrootkit
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning
    - cis_benchmark

- name: Install AIDE file integrity checker
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - aide
    - aide-common
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - file_integrity

# NOTE: Samhain disabled by default - causes high CPU/IO and conflicts with AIDE
- name: Install Samhain file integrity checker (optional)
  ansible.builtin.package:
    name: samhain
    state: present
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_samhain_enabled | default(false)
  tags:
    - compliance_scanning
    - file_integrity

- name: Install OpenSCAP for NIST compliance (Debian/Ubuntu)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - libopenscap8
    - ssg-debderived  # SCAP Security Guide for Debian-based
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_openscap_enabled | default(false)
    - ansible_os_family == 'Debian'
  failed_when: false  # Package availability varies by distro version
  tags:
    - compliance_scanning
    - nist

- name: Install OpenSCAP for NIST compliance (RHEL/CentOS)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - openscap-scanner
    - scap-security-guide
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_openscap_enabled | default(false)
    - ansible_os_family == 'RedHat'
  tags:
    - compliance_scanning
    - nist

- name: Create compliance scanning scripts directory
  ansible.builtin.file:
    path: /opt/compliance-scanning
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Create CIS Benchmark audit script
  ansible.builtin.template:
    src: cis-audit.sh.j2
    dest: /opt/compliance-scanning/run-cis-audit.sh
    owner: root
    group: root
    mode: "0755"
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_cis_enabled | default(false)
  tags:
    - compliance_scanning
    - cis_benchmark

- name: Initialize AIDE database
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -f /var/lib/aide/aide.db ]; then
      echo "Initializing AIDE database..."
      aideinit
      mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - aide

- name: Create AIDE check script
  ansible.builtin.template:
    src: run-aide-check.sh.j2
    dest: /opt/compliance-scanning/run-aide-check.sh
    owner: root
    group: root
    mode: "0755"
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - aide

- name: Create AIDE log directory
  ansible.builtin.file:
    path: /var/log/aide
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - aide

- name: Create AIDE daily scan cron job
  ansible.builtin.cron:
    name: "Daily AIDE integrity scan"
    minute: "0"
    hour: "3"
    job: "/opt/compliance-scanning/run-aide-check.sh >> /var/log/aide/daily-scan.log 2>&1"
    state: present
    user: root
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - aide

- name: Create compliance scan script
  ansible.builtin.template:
    src: compliance-scan.sh.j2
    dest: /opt/compliance-scanning/run-full-scan.sh
    owner: root
    group: root
    mode: "0755"
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Schedule weekly compliance scans
  ansible.builtin.cron:
    name: "Weekly compliance scan"
    minute: "0"
    hour: "1"
    weekday: "0"
    job: "/opt/compliance-scanning/run-full-scan.sh >> /var/log/compliance/weekly-scan.log 2>&1"
    state: present
    user: root
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Create compliance log directory
  ansible.builtin.file:
    path: /var/log/compliance
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Configure AIDE for auto-update after scan
  ansible.builtin.lineinfile:
    path: /etc/aide/aide.conf.d/05_aide_post
    create: true
    line: "# AIDE post-scan configuration"
    owner: root
    group: root
    mode: "0644"
  when:
    - compliance_scanning_enabled | default(false)
    - compliance_aide_enabled | default(false)
  tags:
    - compliance_scanning
    - aide

- name: Create compliance report generator
  ansible.builtin.template:
    src: generate-compliance-report.j2
    dest: /usr/local/bin/generate-compliance-report
    owner: root
    group: root
    mode: "0755"
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Configure log rotation for compliance logs
  ansible.builtin.template:
    src: logrotate-compliance.j2
    dest: /etc/logrotate.d/compliance
    owner: root
    group: root
    mode: "0644"
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning

- name: Display compliance scanning configuration
  ansible.builtin.debug:
    msg: |
      Compliance Scanning Configured:
      ==============================
      CIS Benchmark: lynis
      NIST Compliance: OpenSCAP
      File Integrity: AIDE (daily at 3 AM)
      Rootkit Detection: chkrootkit
      Kernel Integrity: samhain
      Full Compliance Scan: Weekly (Sunday 1 AM)

      Results Location: /var/log/compliance/
      Reports Available: /opt/compliance-scanning/

      Scanning Includes:
      - CIS Benchmark compliance check
      - File integrity monitoring
      - Baseline deviation detection
      - Unauthorized changes alert
      - NIST compliance validation
  when: compliance_scanning_enabled | default(false)
  tags:
    - compliance_scanning
    - report
