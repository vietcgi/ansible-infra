---
# Kernel Hardening - Advanced Security Parameters
# Hardens the Linux kernel against common attack vectors
# Implements: CIS Benchmark 3.x, NIST SP 800-53 SI-16, DISA STIGs

- name: Apply advanced kernel hardening parameters
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop:
    # Kernel pointer hiding (prevent KASLR bypass)
    - { key: 'kernel.kptr_restrict', value: '2' }

    # Restrict dmesg access to privileged users
    - { key: 'kernel.dmesg_restrict', value: '1' }

    # Disable unprivileged eBPF (prevent container escapes)
    - { key: 'kernel.unprivileged_bpf_disabled', value: '1' }

    # Restrict ptrace syscall (prevent process inspection)
    - { key: 'kernel.yama.ptrace_scope', value: '2' }

    # Disable dynamic kernel module loading
    - { key: 'kernel.modules_disabled', value: '1' }

    # Restrict magic SysRq key (prevent DoS)
    - { key: 'kernel.magic_sysrq', value: '0' }

    # Prevent unprivileged namespace creation (container escape prevention)
    - { key: 'kernel.unprivileged_userns_clone', value: '0' }

    # Include PID in core dumps for tracking
    - { key: 'kernel.core_uses_pid', value: '1' }

    # Prevent setuid/setgid binaries from core dumping
    - { key: 'fs.suid_dumpable', value: '0' }

    # Restrict access to kernel logs
    - { key: 'kernel.printk', value: '3 3 3 3' }

    # Restrict /proc/sys access
    - { key: 'kernel.perf_event_paranoid', value: '3' }

    # Hide kernel addresses in /proc/modules
    - { key: 'kernel.modules_disabled', value: '1' }

    # Restrict BPF access to root
    - { key: 'kernel.unprivileged_userns_clone', value: '0' }

    # Conservative memory allocation (prevent OOM issues)
    - { key: 'vm.overcommit_memory', value: '1' }

    # Enable ExecShield (NX bit enforcement)
    - { key: 'kernel.exec-shield', value: '1' }
  notify: reboot required
  tags:
    - kernel_hardening
    - security

- name: Restrict access to /proc/sys and /proc/sysrq-trigger
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - /proc/sysrq-trigger
    - /proc/sys/kernel
  ignore_errors: true
  tags:
    - kernel_hardening
    - security

- name: Configure kernel module blacklist
  ansible.builtin.template:
    src: kernel-blacklist.j2
    dest: /etc/modprobe.d/blacklist-{{ item }}.conf
    owner: root
    group: root
    mode: '0644'
  loop:
    - drivers  # USB3, Bluetooth, FIREWIRE
    - filesystems  # Unnecessary filesystems
  notify: rebuild initramfs
  tags:
    - kernel_hardening
    - security

- name: Set kernel parameter for kexec (prevent unauthorized kernel replacement)
  ansible.builtin.sysctl:
    name: kernel.kexec_load_disabled
    value: '1'
    state: present
    sysctl_set: yes
  when: ansible_kernel is version('5.8', '>=')
  notify: reboot required
  tags:
    - kernel_hardening
    - security

- name: Restrict BPF programs to root only
  ansible.builtin.sysctl:
    name: kernel.bpf_stats_enabled
    value: '0'
    state: present
    sysctl_set: yes
  when: ansible_kernel is version('5.8', '>=')
  tags:
    - kernel_hardening
    - security

- name: Display kernel hardening status
  ansible.builtin.debug:
    msg: |
      Kernel Hardening Summary:
      ========================
      ASLR Protection: Enabled (kptr_restrict=2)
      Ptrace Restrictions: {{ ansible_sysctl.kernel.yama.ptrace_scope | default('not set') }}
      Module Loading: Disabled
      eBPF Restrictions: {{ ansible_sysctl.kernel.unprivileged_bpf_disabled | default('not set') }}
      Magic SysRq: Disabled
      Core Dumps: Restricted (no suid)
      Module Access: Hidden
      Memory Overcommit: Conservative
  tags:
    - kernel_hardening
    - report

- name: Verify kernel hardening parameters are applied
  ansible.builtin.shell: |
    echo "Kernel Hardening Verification:"
    echo "kernel.kptr_restrict = $(sysctl -n kernel.kptr_restrict)"
    echo "kernel.dmesg_restrict = $(sysctl -n kernel.dmesg_restrict)"
    echo "kernel.yama.ptrace_scope = $(sysctl -n kernel.yama.ptrace_scope)"
    echo "kernel.unprivileged_bpf_disabled = $(sysctl -n kernel.unprivileged_bpf_disabled)"
    echo "kernel.magic_sysrq = $(sysctl -n kernel.magic_sysrq)"
  register: kernel_hardening_check
  changed_when: false
  tags:
    - kernel_hardening
    - validate

- name: Log kernel hardening verification
  ansible.builtin.debug:
    var: kernel_hardening_check.stdout_lines
  tags:
    - kernel_hardening
    - validate
