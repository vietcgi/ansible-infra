---
# Chrony time synchronization setup (modern replacement for NTP)

- name: Set timezone (all platforms)
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true
  failed_when: false
  when: ansible_os_family != "Darwin"

- name: Configure Chrony (Debian-based)
  when: ansible_os_family == "Debian" and common_chrony_enabled

  block:
    - name: Install Chrony (Debian-based)
      ansible.builtin.apt:
        name: chrony
        state: present
      become: true
      failed_when: false

    - name: Configure Chrony servers (Debian-based)
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        backup: true
        mode: "0644"
      become: true
      failed_when: false
      notify: restart chronyd

- name: Configure Chrony (RedHat-based)
  when: ansible_os_family == "RedHat" and common_chrony_enabled

  block:
    - name: Install Chrony (RedHat-based)
      ansible.builtin.dnf:
        name: chrony
        state: present
      become: true
      failed_when: false

    - name: Configure Chrony servers (RedHat-based)
      ansible.builtin.template:
        src: chrony.conf.j2
        dest: /etc/chrony.conf
        backup: true
        mode: "0644"
      become: true
      failed_when: false
      notify: restart chronyd

- name: Enable and start Chrony service (Linux)
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started
  become: true
  failed_when: false
  when: ansible_os_family != "Darwin" and common_chrony_enabled

- name: Verify Chrony synchronization
  ansible.builtin.command: chronyc tracking
  register: chrony_tracking
  changed_when: false
  failed_when: false
  when: ansible_os_family != "Darwin" and common_chrony_enabled

- name: Display Chrony status
  ansible.builtin.debug:
    msg: "Chrony time synchronization configured and enabled - RTC sync enabled for improved timekeeping"
