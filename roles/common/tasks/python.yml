---
# Python installation and configuration

- name: Verify Python 3 is available
  ansible.builtin.command: which python3
  register: python3_check
  changed_when: false
  failed_when: false
  tags:
    - python
    - runtime

- name: Install Python 3 (Debian-based)
  ansible.builtin.apt:
    name: "{{ common_python_packages }}"
    state: present
  when:
    - ansible_os_family == "Debian"
    - python3_check.rc != 0
  become: true
  tags:
    - python
    - runtime

- name: Install Python 3 (RedHat-based)
  ansible.builtin.dnf:
    name: "{{ common_python_packages }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - python3_check.rc != 0
  become: true
  tags:
    - python
    - runtime

- name: Verify Python 3 installation
  ansible.builtin.command: python3 --version
  register: python3_version
  changed_when: false
  tags:
    - python
    - runtime

- name: Display Python version
  ansible.builtin.debug:
    msg: "Python version: {{ python3_version.stdout }}"
  tags:
    - python
    - runtime
