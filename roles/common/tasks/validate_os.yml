---
# Validate OS compatibility

- name: Check OS distribution support
  ansible.builtin.assert:
    that:
      - ansible_distribution | lower in common_supported_distributions
    fail_msg: "Unsupported OS distribution: {{ ansible_distribution }}. Supported: {{ common_supported_distributions | join(',
      ') }}"
    success_msg: "✓ OS distribution supported: {{ ansible_distribution }}"
  tags:
    - validation
    - always

- name: Display system information
  ansible.builtin.debug:
    msg: |
      System Information:
        Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
        OS Family: {{ ansible_os_family }}
        Kernel: {{ ansible_kernel }}
        Architecture: {{ ansible_machine }}
        Python: {{ ansible_python_version }}
  tags:
    - validation
    - always
