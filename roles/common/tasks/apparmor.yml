---
# AppArmor MAC (Mandatory Access Control) Configuration
# Enforces security policies on Ubuntu/Debian systems
# Provides per-application sandboxing and access control

- name: Check AppArmor prerequisites
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "AppArmor is only supported on Debian/Ubuntu systems"
  when: apparmor_enabled | bool
  tags:
    - apparmor
    - always

- name: Install AppArmor packages
  block:
    - name: Install AppArmor core packages
      ansible.builtin.package:
        name:
          - apparmor
          - apparmor-utils
          - apparmor-profiles
          - apparmor-profiles-extra
        state: present

    - name: Install AppArmor development tools (optional)
      ansible.builtin.package:
        name: apparmor-dev
        state: present
      when: apparmor_dev_tools | default(false) | bool

  when: apparmor_enabled | bool
  tags:
    - apparmor
    - packages

- name: Enable AppArmor service
  ansible.builtin.systemd:
    name: apparmor
    enabled: yes
    state: started
    daemon_reload: yes
  when: apparmor_enabled | bool
  tags:
    - apparmor
    - services

- name: Configure AppArmor mode (enforce vs complain)
  block:
    - name: Get list of AppArmor profiles
      ansible.builtin.command: aa-status --profiled 2>/dev/null | grep -v "^--"
      register: apparmor_profiles_list
      changed_when: false
      failed_when: false

    - name: Set AppArmor profiles to enforce mode
      ansible.builtin.command: "aa-enforce /etc/apparmor.d/{{ item }}"
      loop: "{{ apparmor_enforce_profiles | default(['usr.sbin.rsyslogd', 'usr.sbin.cupsd', 'usr.lib.dovecot.*']) }}"
      when: apparmor_enforce_mode | default(true) | bool
      changed_when: false
      failed_when: false

    - name: Set AppArmor profiles to complain mode
      ansible.builtin.command: "aa-complain /etc/apparmor.d/{{ item }}"
      loop: "{{ apparmor_complain_profiles | default([]) }}"
      when: not (apparmor_enforce_mode | default(true) | bool)
      changed_when: false
      failed_when: false

  when: apparmor_enabled | bool
  tags:
    - apparmor
    - configuration

- name: Create custom AppArmor profiles
  block:
    - name: Create custom profile directory
      ansible.builtin.file:
        path: /etc/apparmor.d/custom
        owner: root
        group: root
        mode: '0755'
        state: directory

    - name: Deploy custom AppArmor profiles
      ansible.builtin.copy:
        dest: "/etc/apparmor.d/custom/{{ item.name }}"
        content: "{{ item.profile }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ apparmor_custom_profiles | default([]) }}"
      when: apparmor_custom_profiles is defined
      notify: reload apparmor

  when: apparmor_enabled | bool
  tags:
    - apparmor
    - profiles
    - configuration

- name: Update AppArmor profiles from package updates
  ansible.builtin.command: systemctl reload apparmor
  when: apparmor_enabled | bool
  changed_when: false
  tags:
    - apparmor
    - reload

- name: Enable AppArmor deny audit logging
  block:
    - name: Configure auditd for AppArmor
      ansible.builtin.lineinfile:
        path: /etc/audit/rules.d/apparmor.rules
        state: present
        create: yes
        line: "-w /sys/kernel/security/apparmor/ -p wa -k apparmor_changes"
        owner: root
        group: root
        mode: '0640'
      notify: restart auditd

    - name: Enable AppArmor audit logging
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: "^GRUB_CMDLINE_LINUX="
        line: "GRUB_CMDLINE_LINUX=\"apparmor=1 security=apparmor audit=1\""
        state: present
      notify: rebuild grub
      when: apparmor_enable_audit_logging | default(true) | bool

  when: apparmor_enabled | bool
  tags:
    - apparmor
    - audit
    - logging

- name: Configure AppArmor parser options
  ansible.builtin.copy:
    dest: /etc/apparmor/parser.conf
    content: |
      # AppArmor Parser Configuration
      # Generated by Ansible - DO NOT EDIT MANUALLY

      # Enable performance optimization
      --optimize=DEFAULT

      # Warn about security issues in profiles
      --warn-about-rules

      # Optimize filter policies
      {% if apparmor_optimize_profiles | default(true) %}
      --optimize
      {% endif %}

      # Disable namespaces (for simple policies)
      {% if apparmor_disable_namespaces | default(false) %}
      --skip-cache
      {% endif %}

      # Enable caching of parsed profiles
      --cache=yes
    owner: root
    group: root
    mode: '0644'
  when: apparmor_enabled | bool
  tags:
    - apparmor
    - configuration

- name: Verify AppArmor is functioning
  block:
    - name: Check AppArmor status
      ansible.builtin.command: aa-status
      register: apparmor_status
      changed_when: false
      when: apparmor_enabled | bool

    - name: Display AppArmor profile count
      ansible.builtin.debug:
        msg: "AppArmor profiles loaded: {{ apparmor_status.stdout_lines | length }}"
      when: apparmor_enabled | bool

    - name: Check for AppArmor denials
      ansible.builtin.shell: dmesg | grep -i apparmor | tail -5
      register: apparmor_denials
      changed_when: false
      failed_when: false
      when: apparmor_enabled | bool

  when: apparmor_enabled | bool
  tags:
    - apparmor
    - validate

- name: Configure AppArmor log rotation
  ansible.builtin.copy:
    dest: /etc/logrotate.d/apparmor
    content: |
      /var/log/audit/audit.log {
        daily
        rotate 30
        missingok
        notifempty
        compress
        delaycompress
        copytruncate
        create 0640 root root
      }
    owner: root
    group: root
    mode: '0644'
  when: apparmor_enabled | bool
  tags:
    - apparmor
    - logging

- name: Display AppArmor configuration summary
  ansible.builtin.debug:
    msg: |
      AppArmor Configuration:
      ======================
      Status: {{ 'Enabled' if apparmor_enabled | bool else 'Disabled' }}
      Mode: {{ 'Enforce' if apparmor_enforce_mode | default(true) else 'Complain' }}
      Audit Logging: {{ 'Enabled' if apparmor_enable_audit_logging | default(true) else 'Disabled' }}

      AppArmor Features:
      - Mandatory Access Control (MAC)
      - Per-application sandboxing
      - Profile-based security policies
      - Audit logging via auditd

      Profile Locations:
      - System profiles: /etc/apparmor.d/
      - Custom profiles: /etc/apparmor.d/custom/
      - Parser config: /etc/apparmor/parser.conf

      Verification Commands:
      - Status: aa-status
      - Show denials: dmesg | grep -i apparmor
      - Audit logs: ausearch -m apparmor
      - Check profile: aa-logprof
    verbosity: 1
  when: apparmor_enabled | bool
  tags:
    - apparmor

