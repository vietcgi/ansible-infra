---
# System audit configuration

- name: Install audit daemon (Debian-based)
  ansible.builtin.apt:
    name: auditd
    state: present
  become: true
  failed_when: false
  when:
    - ansible_os_family == "Debian"
    - common_enable_audit
  tags:
    - audit
    - logging
    - security
    - critical

- name: Install audit daemon (RedHat-based)
  ansible.builtin.dnf:
    name: audit
    state: present
  become: true
  failed_when: false
  when:
    - ansible_os_family == "RedHat"
    - common_enable_audit
  tags:
    - audit
    - logging
    - security
    - critical

- name: Configure audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/sentinel.rules
    backup: true
  become: true
  failed_when: false
  notify: restart auditd
  when: common_enable_audit
  tags:
    - audit
    - logging
    - security
    - critical

- name: Enable audit daemon
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  become: true
  failed_when: false
  when:
    - ansible_os_family != "Darwin"
    - common_enable_audit
  tags:
    - audit
    - logging
    - security
    - critical

- name: Display audit configuration summary
  ansible.builtin.debug:
    msg: "Audit daemon configured and enabled"
