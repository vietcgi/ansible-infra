---
# Install core utilities and packages

- name: Install core packages (Debian-based)
  apt:
    name: "{{ common_core_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  become: yes
  failed_when: false
  tags:
    - packages
    - core-packages

- name: Install core packages (RedHat-based)
  yum:
    name: "{{ common_core_packages }}"
    state: present
  when: ansible_os_family == "RedHat"
  become: yes
  tags:
    - packages
    - core-packages

- name: Install core packages (macOS)
  homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ common_core_packages }}"
  when: ansible_os_family == "Darwin"
  ignore_errors: true  # Some packages may not be available on macOS
  tags:
    - packages
    - core-packages

- name: Install core packages (Alpine)
  apk:
    name: "{{ common_core_packages }}"
    state: present
  when: ansible_os_family == "Alpine"
  become: yes
  ignore_errors: true  # Some packages may not be available in Alpine repos
  tags:
    - packages
    - core-packages

- name: Display installed packages summary
  debug:
    msg: "Core utilities installed successfully"
  tags:
    - packages
    - core-packages
