---
# SSH hardening and security configuration

- name: Configure SSH daemon (Linux)
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    backup: yes
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  become: yes
  notify: restart sshd
  when: ansible_os_family != "Darwin"
  tags:
    - ssh
    - hardening
    - security
    - critical

- name: Configure SSH daemon (macOS)
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    backup: yes
    mode: '0600'
  become: yes
  notify: restart sshd macos
  when: ansible_os_family == "Darwin"
  tags:
    - ssh
    - hardening
    - security
    - critical

- name: Ensure SSH config directory permissions
  file:
    path: /etc/ssh
    state: directory
    mode: '0755'
  become: yes
  tags:
    - ssh
    - hardening
    - security

- name: Display SSH hardening summary
  debug:
    msg: "SSH daemon configured with security hardening"
  tags:
    - ssh
    - hardening
    - security
