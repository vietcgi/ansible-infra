---
# SSH hardening and security configuration

- name: Configure SSH daemon (Linux)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    backup: true
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  failed_when: false
  notify: restart sshd
  when: ansible_os_family != "Darwin"
  tags:
    - ssh
    - hardening
    - security
    - critical

- name: Configure SSH daemon (macOS)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    backup: true
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  failed_when: false
  notify: restart sshd macos
  when: ansible_os_family == "Darwin"
  tags:
    - ssh
    - hardening
    - security
    - critical

- name: Ensure SSH config directory permissions
  ansible.builtin.file:
    path: /etc/ssh
    state: directory
    mode: "0755"
  become: true
  tags:
    - ssh
    - hardening
    - security

- name: Display SSH hardening summary
  ansible.builtin.debug:
    msg: "SSH daemon configured with security hardening"
  tags:
    - ssh
    - hardening
    - security
