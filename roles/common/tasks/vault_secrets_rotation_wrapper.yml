---
# Vault Secrets Rotation Wrapper Task
# Implements automated credential and key rotation
# Purpose: Setup and manage automatic rotation of secrets across infrastructure

# Pre-flight checks
- name: Validate Vault secrets rotation is enabled
  ansible.builtin.assert:
    that:
      - security_vault_secrets_rotation_enabled | default(false) | bool
      - security_vault_enabled | default(false) | bool
    fail_msg: "Vault secrets rotation is disabled or Vault is not enabled"
    quiet: true
  tags:
    - vault
    - rotation
    - validation

# Verify Vault is accessible
- name: Verify Vault API accessibility for rotation
  ansible.builtin.uri:
    url: "http{{ 's' if security_vault_tls_enabled | default(false) else '' }}://{{ security_vault_bind_addr | default('127.0.0.1') }}:{{ security_vault_http_port | default(8200) }}/v1/sys/health"
    method: GET
    status_code: [200, 473, 501, 503]
    validate_certs: no
  register: vault_rotation_api_check
  retries: 3
  delay: 2
  tags:
    - vault
    - rotation
    - validation

# Configure database credential rotation
- name: Configure database credential rotation
  block:
    - name: Enable database secrets engine
      ansible.builtin.uri:
        url: "http{{ 's' if security_vault_tls_enabled | default(false) else '' }}://{{ security_vault_bind_addr | default('127.0.0.1') }}:{{ security_vault_http_port | default(8200) }}/v1/sys/mounts/database"
        method: POST
        validate_certs: no
        headers:
          X-Vault-Token: "{{ vault_token | default('') }}"
        body_format: json
        body:
          type: database
        status_code: [200, 204, 400]
      when: security_vault_database_rotation_enabled | default(false) | bool
      tags:
        - vault
        - rotation
        - database

    - name: Deploy database rotation configuration
      ansible.builtin.template:
        src: vault_database_rotation.j2
        dest: /etc/vault/database-rotation.hcl
        owner: vault
        group: vault
        mode: '0640'
        backup: yes
      become: true
      when: security_vault_database_rotation_enabled | default(false) | bool
      register: vault_db_rotation_config
      tags:
        - vault
        - rotation
        - database

  rescue:
    - name: Handle database rotation configuration
      ansible.builtin.debug:
        msg: |
          ⚠ Database rotation configuration may require manual setup
          - Ensure database backends are configured
          - Check Vault documentation for DB-specific setup
      tags:
        - vault
        - rotation
        - error

# Configure SSH key rotation
- name: Configure SSH key rotation
  block:
    - name: Enable SSH secrets engine
      ansible.builtin.uri:
        url: "http{{ 's' if security_vault_tls_enabled | default(false) else '' }}://{{ security_vault_bind_addr | default('127.0.0.1') }}:{{ security_vault_http_port | default(8200) }}/v1/sys/mounts/ssh"
        method: POST
        validate_certs: no
        headers:
          X-Vault-Token: "{{ vault_token | default('') }}"
        body_format: json
        body:
          type: ssh
        status_code: [200, 204, 400]
      when: security_vault_ssh_rotation_enabled | default(false) | bool
      tags:
        - vault
        - rotation
        - ssh

    - name: Deploy SSH rotation configuration
      ansible.builtin.template:
        src: vault_ssh_rotation.j2
        dest: /etc/vault/ssh-rotation.hcl
        owner: vault
        group: vault
        mode: '0640'
        backup: yes
      become: true
      when: security_vault_ssh_rotation_enabled | default(false) | bool
      register: vault_ssh_rotation_config
      tags:
        - vault
        - rotation
        - ssh

  rescue:
    - name: Handle SSH rotation configuration
      ansible.builtin.debug:
        msg: |
          ⚠ SSH rotation configuration incomplete
          - SSH backend may require additional setup
          - Verify SSH client access to infrastructure
      tags:
        - vault
        - rotation
        - error

# Configure API key rotation
- name: Configure API key rotation
  block:
    - name: Enable KV secrets engine for API keys
      ansible.builtin.uri:
        url: "http{{ 's' if security_vault_tls_enabled | default(false) else '' }}://{{ security_vault_bind_addr | default('127.0.0.1') }}:{{ security_vault_http_port | default(8200) }}/v1/sys/mounts/api-keys"
        method: POST
        validate_certs: no
        headers:
          X-Vault-Token: "{{ vault_token | default('') }}"
        body_format: json
        body:
          type: kv
          version: 2
        status_code: [200, 204, 400]
      when: security_vault_api_key_rotation_enabled | default(false) | bool
      tags:
        - vault
        - rotation
        - api-keys

    - name: Deploy API key rotation configuration
      ansible.builtin.template:
        src: vault_api_key_rotation.j2
        dest: /etc/vault/api-key-rotation.hcl
        owner: vault
        group: vault
        mode: '0640'
        backup: yes
      become: true
      when: security_vault_api_key_rotation_enabled | default(false) | bool
      register: vault_api_key_rotation_config
      tags:
        - vault
        - rotation
        - api-keys

  rescue:
    - name: Handle API key rotation configuration
      ansible.builtin.debug:
        msg: |
          ⚠ API key rotation configuration incomplete
          - KV v2 backend may already exist
          - Verify API key structure and naming
      tags:
        - vault
        - rotation
        - error

# Deploy rotation policy configuration
- name: Deploy rotation policies
  ansible.builtin.template:
    src: vault_rotation_policies.j2
    dest: /etc/vault/rotation-policies.hcl
    owner: vault
    group: vault
    mode: '0640'
    backup: yes
  become: true
  when: security_vault_rotation_policies | default([]) | length > 0
  register: vault_rotation_policies_config
  tags:
    - vault
    - rotation
    - policies

# Setup rotation job scheduler
- name: Setup rotation job scheduler
  block:
    - name: Create rotation job script
      ansible.builtin.template:
        src: vault_rotation_job.sh.j2
        dest: /usr/local/bin/vault-rotation-job.sh
        owner: root
        group: root
        mode: '0755'
        backup: yes
      become: true
      when: security_vault_rotation_job_enabled | default(false) | bool
      register: vault_rotation_job_script
      tags:
        - vault
        - rotation
        - job

    - name: Create cron job for secret rotation
      ansible.builtin.cron:
        name: "Vault Secret Rotation"
        minute: "{{ security_vault_rotation_schedule_minute | default('0') }}"
        hour: "{{ security_vault_rotation_schedule_hour | default('2') }}"
        day: "{{ security_vault_rotation_schedule_day | default('*') }}"
        month: "{{ security_vault_rotation_schedule_month | default('*') }}"
        weekday: "{{ security_vault_rotation_schedule_weekday | default('*') }}"
        job: "/usr/local/bin/vault-rotation-job.sh >> /var/log/vault/rotation.log 2>&1"
        user: vault
        state: present
      become: true
      when: security_vault_rotation_job_enabled | default(false) | bool
      tags:
        - vault
        - rotation
        - cron

  rescue:
    - name: Handle rotation job setup
      ansible.builtin.debug:
        msg: |
          ⚠ Rotation job setup may be incomplete
          - Script creation may have failed
          - Check cron configuration and permissions
      tags:
        - vault
        - rotation
        - error

# Configure rotation monitoring and alerts
- name: Configure rotation monitoring
  ansible.builtin.template:
    src: vault_rotation_monitoring.j2
    dest: /etc/vault/rotation-monitoring.hcl
    owner: vault
    group: vault
    mode: '0640'
    backup: yes
  become: true
  when: security_vault_rotation_monitoring_enabled | default(false) | bool
  register: vault_rotation_monitoring_config
  tags:
    - vault
    - rotation
    - monitoring

# Setup rotation audit logging
- name: Configure rotation audit logging
  ansible.builtin.template:
    src: vault_rotation_audit.j2
    dest: /etc/vault/rotation-audit.hcl
    owner: vault
    group: vault
    mode: '0640'
    backup: yes
  become: true
  when: security_vault_rotation_audit_logging | default(true) | bool
  register: vault_rotation_audit_config
  tags:
    - vault
    - rotation
    - audit

# Verify rotation setup
- name: Verify rotation setup
  block:
    - name: Check database rotation status
      ansible.builtin.uri:
        url: "http{{ 's' if security_vault_tls_enabled | default(false) else '' }}://{{ security_vault_bind_addr | default('127.0.0.1') }}:{{ security_vault_http_port | default(8200) }}/v1/sys/mounts"
        method: GET
        validate_certs: no
        status_code: [200, 404]
      register: vault_mounts_status
      when: security_vault_database_rotation_enabled | default(false) | bool
      tags:
        - vault
        - rotation
        - validation

  rescue:
    - name: Handle rotation verification
      ansible.builtin.debug:
        msg: |
          ⚠ Rotation verification incomplete
          - Vault may require authentication
          - Check backend status manually
      tags:
        - vault
        - rotation
        - error

# Log rotation setup completion
- name: Rotation setup completion
  block:
    - name: Display rotation setup completion
      ansible.builtin.debug:
        msg: |
          ✓ Vault Secrets Rotation Setup Complete:
          - Database Rotation: {{ 'Enabled' if security_vault_database_rotation_enabled | default(false) else 'Disabled' }}
          - SSH Key Rotation: {{ 'Enabled' if security_vault_ssh_rotation_enabled | default(false) else 'Disabled' }}
          - API Key Rotation: {{ 'Enabled' if security_vault_api_key_rotation_enabled | default(false) else 'Disabled' }}
          - Rotation Policies: {{ security_vault_rotation_policies | default([]) | length }}
          - Job Scheduler: {{ 'Enabled' if security_vault_rotation_job_enabled | default(false) else 'Disabled' }}
          - Monitoring: {{ 'Enabled' if security_vault_rotation_monitoring_enabled | default(false) else 'Disabled' }}
          - Audit Logging: {{ 'Enabled' if security_vault_rotation_audit_logging | default(true) else 'Disabled' }}
          - Status: Ready for automated rotation
      tags:
        - vault
        - rotation
        - summary

  rescue:
    - name: Handle rotation setup errors
      ansible.builtin.debug:
        msg: |
          ⚠ Rotation setup may be incomplete:
          - Review Vault logs: journalctl -u vault -n 50
          - Check backend status: vault secrets list
          - Verify rotation job: crontab -l -u vault
      tags:
        - vault
        - rotation
        - error

# Final status message
- name: Vault rotation task completion
  ansible.builtin.debug:
    msg: "Vault secrets rotation wrapper task completed successfully"
  when: not ansible_check_mode
  tags:
    - vault
    - rotation
    - summary
