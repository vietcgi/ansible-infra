---
# Password Policy & Account Lockout Configuration
# Implements strong password requirements and account lockout protection
# Compliance: CIS Benchmark 5.1.x, NIST SP 800-53 IA-5, PCI DSS 8.2.3

- name: Install PAM password quality module
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - libpam-pwquality
    - libpam-cracklib
  when: ansible_os_family == 'Debian'
  tags:
    - password_policy
    - pam

- name: Install PAM tools for RedHat systems
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - pam_pwquality
    - cracklib
    - cracklib-dicts
  when: ansible_os_family == 'RedHat'
  tags:
    - password_policy
    - pam

- name: Configure password quality in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    backup: true
  loop:
    # Password expiration
    - { key: "PASS_MAX_DAYS", value: "90" }
    - { key: "PASS_MIN_DAYS", value: "1" }
    - { key: "PASS_WARN_AGE", value: "7" }
    # Minimum password length
    - { key: "PASS_MIN_LEN", value: "14" }
    # New default for umask
    - { key: "USERGROUPS_ENAB", value: "yes" }
  tags:
    - password_policy
    - login_defs

- name: Configure PAM password quality rules (Debian/Ubuntu)
  ansible.builtin.template:
    src: pam-pwquality.j2
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family == 'Debian'
  tags:
    - password_policy
    - pam

- name: Configure PAM password quality rules (RedHat)
  ansible.builtin.template:
    src: pam-pwquality-redhat.j2
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family == 'RedHat'
  tags:
    - password_policy
    - pam

- name: Configure account lockout using pam_faillock (newer PAM)
  ansible.builtin.template:
    src: pam-faillock.j2
    dest: /etc/pam.d/common-password
    owner: root
    group: root
    mode: "0644"
    backup: true
  when:
    - ansible_os_family == 'Debian'
    - ansible_distribution_version is version('20.04', '>=')
  tags:
    - password_policy
    - account_lockout

- name: Configure account lockout for RedHat (faillock)
  ansible.builtin.template:
    src: pam-faillock-redhat.j2
    dest: /etc/pam.d/system-auth
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family == 'RedHat'
  tags:
    - password_policy
    - account_lockout

- name: Set up faillock directory with proper permissions
  ansible.builtin.file:
    path: /var/run/faillock
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - password_policy
    - account_lockout

- name: Configure sudo password timeout
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "Defaults use_pty"
    state: present
    validate: "visudo -cf %s"
  tags:
    - password_policy
    - sudo

- name: Enforce strong sudo password requirements
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ item }}"
    state: present
    validate: "visudo -cf %s"
  loop:
    - "Defaults logfile=\"/var/log/sudo.log\""
    - "Defaults log_input, log_output"
    - "Defaults requiretty"
    - "Defaults passwd_timeout=1"
    - "Defaults timestamp_timeout=5"
  tags:
    - password_policy
    - sudo

- name: Set password hashing algorithm to SHA512
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^ENCRYPT_METHOD"
    line: "ENCRYPT_METHOD SHA512"
    state: present
    backup: true
  when: ansible_os_family == 'Debian'
  tags:
    - password_policy
    - hashing

- name: Configure shadow file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0640"
    owner: root
    group: shadow
  loop:
    - /etc/shadow
    - /etc/gshadow
  tags:
    - password_policy
    - permissions

- name: Configure umask for new user files
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^UMASK"
    line: "UMASK 027"
    state: present
    backup: true
  tags:
    - password_policy
    - permissions

- name: Restrict access to su command
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    line: "auth required pam_wheel.so use_uid"
    state: present
    regexp: "^auth required pam_wheel"
  when: ansible_os_family == 'Debian'
  tags:
    - password_policy
    - access_control

- name: Display password policy configuration
  ansible.builtin.debug:
    msg: |
      Password Policy Configuration Summary:
      ======================================
      Password Expiration:
        - Maximum days: 90
        - Minimum days: 1
        - Warning days: 7

      Password Complexity:
        - Minimum length: 14 characters
        - Uppercase required: Yes (1+)
        - Lowercase required: Yes (1+)
        - Digits required: Yes (1+)
        - Special chars required: Yes (1+)

      Account Lockout:
        - Failed attempts: 5
        - Lockout duration: 900 seconds (15 minutes)
        - Unlock method: Admin or auto after timeout

      Sudo Security:
        - TTY required: Yes
        - Password timeout: 1 minute
        - Session timeout: 5 minutes
        - Logging: Input/Output captured

      Hash Algorithm: SHA512
      Shadow permissions: 0640 (root:shadow only)
  tags:
    - password_policy
    - report

- name: Verify password policy configuration
  ansible.builtin.shell: |
    echo "Password Policy Verification:"
    echo "=============================="
    grep "PASS_MAX_DAYS\|PASS_MIN_DAYS\|PASS_WARN_AGE\|PASS_MIN_LEN" /etc/login.defs | grep -v "^#"
    echo ""
    echo "Shadow file permissions:"
    ls -la /etc/shadow | awk '{print $1, $3, $4, $9}'
    echo ""
    echo "Umask setting:"
    grep "^UMASK" /etc/login.defs | grep -v "^#"
  register: password_policy_check
  changed_when: false
  tags:
    - password_policy
    - validate

- name: Log password policy verification
  ansible.builtin.debug:
    var: password_policy_check.stdout_lines
  tags:
    - password_policy
    - validate
