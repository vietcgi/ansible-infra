---
# System package updates and upgrades

- name: Update package cache (Debian-based)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: true
  tags:
    - packages
    - system-update
    - critical

- name: Update package cache (RedHat-based)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_os_family == "RedHat"
  become: true
  tags:
    - packages
    - system-update
    - critical

- name: Update package cache (macOS)
  community.general.homebrew:
    update_homebrew: true
  when: ansible_os_family == "Darwin"
  failed_when: false
  tags:
    - packages
    - system-update

- name: Update package cache (Alpine)
  community.general.apk:
    update_cache: true
  when: ansible_os_family == "Alpine"
  tags:
    - packages
    - system-update
    - critical

- name: Upgrade packages (Debian-based)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when:
    - ansible_os_family == "Debian"
    - common_upgrade_packages | bool
  become: true
  failed_when: false
  tags:
    - packages
    - system-update
    - critical

- name: Upgrade packages (RedHat-based)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when:
    - ansible_os_family == "RedHat"
    - common_upgrade_packages | bool
  become: true
  tags:
    - packages
    - system-update
    - critical

- name: Upgrade packages (Alpine)
  community.general.apk:
    upgrade: true
  when:
    - ansible_os_family == "Alpine"
    - common_upgrade_packages | bool
  become: true
  tags:
    - packages
    - system-update
    - critical

- name: Display upgrade summary
  ansible.builtin.debug:
    msg: "System packages updated and upgraded successfully"
  tags:
    - packages
    - system-update
