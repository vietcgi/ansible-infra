---
# System package updates and upgrades

- name: Update package cache (Debian-based)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: yes

- name: Update package cache (RedHat-based)
  yum:
    name: "*"
    state: latest
    update_cache: yes
  when: ansible_os_family == "RedHat"
  become: yes

- name: Update package cache (macOS)
  homebrew:
    update_homebrew: yes
  when: ansible_os_family == "Darwin"

- name: Upgrade packages (Debian-based)
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  when:
    - ansible_os_family == "Debian"
    - common_upgrade_packages | bool
  become: yes

- name: Upgrade packages (RedHat-based)
  yum:
    name: "*"
    state: latest
  when:
    - ansible_os_family == "RedHat"
    - common_upgrade_packages | bool
  become: yes

- name: Display upgrade summary
  debug:
    msg: "System packages updated and upgraded successfully"
