---
# MySQL/MariaDB Galera Cluster Wrapper
# Configures synchronous multi-master MySQL/MariaDB clustering

- name: MySQL Galera Cluster Configuration Block
  block:
    # Validate MySQL Galera is enabled
    - name: Validate MySQL Galera prerequisites
      ansible.builtin.assert:
        that:
          - database_mysql_enabled | default(false) | bool
          - database_mysql_version is defined
          - database_mysql_cluster_name is defined
        fail_msg: "MySQL Galera requires database_mysql_enabled=true and cluster_name configured"
      when: database_mysql_enabled | default(false) | bool

    # Install MySQL/MariaDB with Galera
    - name: Install MariaDB with Galera support (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - "mariadb-server-{{ database_mysql_version | default('10.6') }}"
          - "mariadb-plugin-columnstore"
        state: present
        update_cache: yes
      when:
        - ansible_os_family == 'Debian'
        - database_mysql_enabled | default(false) | bool
      become: yes

    - name: Install MariaDB with Galera support (RedHat/CentOS)
      ansible.builtin.yum:
        name:
          - "MariaDB-server"
          - "MariaDB-client"
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - database_mysql_enabled | default(false) | bool
      become: yes

    # Configure my.cnf for Galera
    - name: Configure my.cnf for Galera clustering
      ansible.builtin.template:
        src: mysql_galera_config.j2
        dest: "/etc/mysql/my.cnf"
        owner: root
        group: root
        mode: "0644"
      become: yes
      notify: restart mysql

    # Create backup user for SST
    - name: Create MySQL backup user for SST
      community.mysql.mysql_user:
        name: "{{ database_mysql_sst_user | default('sstuser') }}"
        password: "{{ database_mysql_sst_password }}"
        priv: "*.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: "'primary' in group_names or inventory_hostname == groups['database_mysql_primary'][0] | default(inventory_hostname)"
      become: yes
      become_user: mysql

    # Create MySQL data directory
    - name: Create MySQL data directory
      ansible.builtin.file:
        path: "/var/lib/mysql"
        state: directory
        owner: mysql
        group: mysql
        mode: "0755"
      become: yes

    # Bootstrap primary node (wsrep_new_cluster)
    - name: Bootstrap Galera cluster on primary
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "SHOW STATUS LIKE 'wsrep_local_state_uuid'"
      register: galera_status
      changed_when: false
      failed_when: false
      become: yes
      become_user: mysql
      when: "'primary' in group_names or inventory_hostname == groups['database_mysql_primary'][0] | default(inventory_hostname)"

    - name: Initialize Galera cluster on primary node
      ansible.builtin.shell: |
        systemctl set-environment _WSREP_NEW_CLUSTER='--wsrep-new-cluster'
        systemctl restart mariadb
        sleep 10
        systemctl unset-environment _WSREP_NEW_CLUSTER
      become: yes
      when:
        - "'primary' in group_names or inventory_hostname == groups['database_mysql_primary'][0] | default(inventory_hostname)"
        - galera_status.query_result[0][0] is not defined or galera_status.query_result[0][0].Value == "00000000-0000-0000-0000-000000000000"

    # Start MySQL on secondary nodes
    - name: Start MariaDB on secondary nodes
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: yes
      become: yes
      when: "'replica' in group_names or inventory_hostname in groups['database_mysql_secondary'] | default([])"

    # Wait for cluster convergence
    - name: Wait for Galera cluster nodes to sync
      ansible.builtin.pause:
        seconds: 15
      when: "'replica' in group_names or inventory_hostname in groups['database_mysql_secondary'] | default([])"

    # Verify cluster status
    - name: Verify Galera cluster status
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "SHOW STATUS LIKE 'wsrep%'"
      register: galera_cluster_status
      become: yes
      become_user: mysql

    - name: Display Galera cluster status
      ansible.builtin.debug:
        msg: |
          Galera Cluster Status:
          {% for result in galera_cluster_status.query_result[0] %}
          - {{ result.Variable_name }}: {{ result.Value }}
          {% endfor %}

    # Configure gmbd arbitrator for 2-node clusters (optional)
    - name: Install Galera arbitrator (garbd) for 2-node clusters
      ansible.builtin.apt:
        name: "galera-arbitrator"
        state: present
      become: yes
      when:
        - ansible_os_family == 'Debian'
        - groups['database_mysql_cluster'] | length == 2

    # Configure Galera monitoring tables
    - name: Create Galera monitoring database
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "CREATE DATABASE IF NOT EXISTS galera_monitor"
      become: yes
      become_user: mysql
      ignore_errors: true

    - name: Create Galera cluster status table
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "CREATE TABLE IF NOT EXISTS galera_monitor.cluster_status (
               node_name VARCHAR(255) PRIMARY KEY,
               cluster_state VARCHAR(50),
               cluster_size INT,
               local_state INT,
               local_state_uuid VARCHAR(36),
               last_update TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
             )"
      become: yes
      become_user: mysql
      ignore_errors: true

    # Setup incremental state transfer (IST) cache
    - name: Configure IST cache directory
      ansible.builtin.file:
        path: "/var/lib/mysql/gcache"
        state: directory
        owner: mysql
        group: mysql
        mode: "0750"
      become: yes

    - name: Update mysql.cnf for IST cache
      ansible.builtin.lineinfile:
        path: "/etc/mysql/my.cnf"
        regexp: "^#?wsrep_provider_options"
        line: "wsrep_provider_options='gcache.size=1G;gcache.dir=/var/lib/mysql/gcache'"
        state: present
      become: yes
      notify: restart mysql

    # Setup Galera replication monitoring script
    - name: Create MySQL replication monitoring script
      ansible.builtin.template:
        src: mysql_galera_health_check.sh.j2
        dest: "/usr/local/bin/mysql_galera_health_check.sh"
        owner: root
        group: root
        mode: "0755"
      become: yes

    # Setup systemd health check service
    - name: Create MySQL Galera health check systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/mysql-galera-health-check.service"
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=MySQL Galera Cluster Health Check
          After=mariadb.service
          Requires=mariadb.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/mysql_galera_health_check.sh
          Restart=on-failure
          RestartSec=30

          [Install]
          WantedBy=multi-user.target
      become: yes
      notify: reload systemd

    # Configure backup user with proper privileges
    - name: Configure SST backup user privileges
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "GRANT RELOAD, LOCK TABLES, PROCESS, REPLICATION CLIENT ON *.* TO '{{ database_mysql_sst_user | default('sstuser') }}'@'localhost' IDENTIFIED BY '{{ database_mysql_sst_password }}';"
          - "FLUSH PRIVILEGES;"
      become: yes
      become_user: mysql
      ignore_errors: true

    # Setup slow query logging
    - name: Enable MySQL slow query logging
      ansible.builtin.lineinfile:
        path: "/etc/mysql/my.cnf"
        regexp: "^#?slow_query_log"
        line: "slow_query_log = 1"
        state: present
      become: yes
      notify: restart mysql

    - name: Configure slow query log file
      ansible.builtin.lineinfile:
        path: "/etc/mysql/my.cnf"
        regexp: "^#?slow_query_log_file"
        line: "slow_query_log_file = /var/log/mysql/slow-query.log"
        state: present
      become: yes
      notify: restart mysql

    - name: Set slow query threshold
      ansible.builtin.lineinfile:
        path: "/etc/mysql/my.cnf"
        regexp: "^#?long_query_time"
        line: "long_query_time = {{ database_mysql_slow_query_threshold | default(2) }}"
        state: present
      become: yes
      notify: restart mysql

    # Configure logrotate
    - name: Configure MySQL log rotation
      ansible.builtin.template:
        src: mysql_logrotate.j2
        dest: "/etc/logrotate.d/mysql"
        owner: root
        group: root
        mode: "0644"
      become: yes

    # Setup backup script
    - name: Create database backup script
      ansible.builtin.template:
        src: database_backup.sh.j2
        dest: "/usr/local/bin/database_backup.sh"
        owner: root
        group: root
        mode: "0755"
      become: yes

    # Schedule daily backups
    - name: Schedule daily MySQL backups
      ansible.builtin.cron:
        name: "MySQL Galera daily backup"
        hour: "{{ database_backup_hour | default(3) }}"
        minute: "{{ database_backup_minute | default(0) }}"
        job: "/usr/local/bin/database_backup.sh > /var/log/mysql_backup.log 2>&1"
        user: root
        state: present
      become: yes

    # Setup Prometheus exporter for MySQL metrics
    - name: Create MySQL metrics configuration
      ansible.builtin.copy:
        dest: "/etc/mysql/mysql_exporter.cnf"
        mode: "0644"
        owner: root
        group: root
        content: |
          # MySQL Prometheus Exporter Configuration
          # Used by mysqld_exporter

          [client]
          user=exporter
          password={{ database_mysql_exporter_password | default('exporter_pass') }}
          host=localhost
          port=3306
      become: yes

    # Final verification
    - name: Verify cluster convergence
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "SHOW STATUS LIKE 'wsrep_cluster_size'"
      register: cluster_size
      become: yes
      become_user: mysql
      ignore_errors: true

    - name: Verify cluster state
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "SHOW STATUS LIKE 'wsrep_local_state'"
      register: cluster_state
      become: yes
      become_user: mysql
      ignore_errors: true

    - name: Verify SST readiness
      community.mysql.mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query:
          - "SHOW STATUS LIKE 'wsrep_ready'"
      register: cluster_ready
      become: yes
      become_user: mysql
      ignore_errors: true

    - name: Display MySQL Galera cluster configuration
      ansible.builtin.debug:
        msg: |
          MySQL Galera Cluster Configuration:
          ✓ Cluster Name: {{ database_mysql_cluster_name }}
          ✓ Cluster Size: {{ cluster_size.query_result[0][0].Value | default('Unknown') }} nodes
          ✓ Cluster State: {{ cluster_state.query_result[0][0].Value | default('Unknown') }}
          ✓ Cluster Ready: {{ cluster_ready.query_result[0][0].Value | default('Unknown') }}
          ✓ SST Method: {{ database_mysql_sst_method | default('mariabackup') }}
          ✓ Replication Threads: {{ database_mysql_wsrep_threads | default(4) }}
          ✓ InnoDB Autoinc Lock Mode: 2 (Galera compatible)
          ✓ IST Cache: /var/lib/mysql/gcache (1GB)
          ✓ Health Check Endpoint: /usr/local/bin/mysql_galera_health_check.sh
          ✓ Backup Script: /usr/local/bin/database_backup.sh
          ✓ Monitoring: Prometheus integration ready
          ✓ Slow Query Log: Enabled ({{ database_mysql_slow_query_threshold | default(2) }}s threshold)

  rescue:
    - name: MySQL Galera configuration failed
      ansible.builtin.debug:
        msg: |
          MySQL Galera configuration encountered an error.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

  tags:
    - database
    - mysql
    - galera
    - ha

- name: Display MySQL Galera cluster status
  ansible.builtin.debug:
    msg: |
      ✓ MySQL Galera Cluster Status:
      - Cluster Name: {{ database_mysql_cluster_name }}
      - Nodes: {{ groups['database_mysql_cluster'] | length | default('Unknown') }}
      - SST Method: {{ database_mysql_sst_method | default('mariabackup') }}
      - Health Check: /usr/local/bin/mysql_galera_health_check.sh
  when: not ansible_check_mode
