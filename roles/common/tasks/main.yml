################################################################################
# PHASE 2.E: Database Replication & High Availability
################################################################################

- name: Include PostgreSQL replication
  ansible.builtin.include_tasks:
    file: postgresql_replication_wrapper.yml
    apply:
      tags: [phase2e, postgresql, database, replication]
  when: database_postgresql_enabled | default(false)
  tags: [phase2e, postgresql, database, replication]

- name: Include MySQL Galera cluster
  ansible.builtin.include_tasks:
    file: mysql_galera_wrapper.yml
    apply:
      tags: [phase2e, mysql, galera, database, replication]
  when: database_mysql_enabled | default(false)
  tags: [phase2e, mysql, galera, database, replication]

################################################################################
# PHASE 2.F: GPU Hosting & Vast.ai Marketplace
################################################################################

- name: Include NVIDIA driver installation
  ansible.builtin.include_tasks:
    file: nvidia_driver_installation.yml
    apply:
      tags: [phase2f, nvidia, gpu, drivers]
  when: gpu_nvidia_enabled | default(false)
  tags: [phase2f, nvidia, gpu, drivers]

- name: Include NVIDIA container toolkit
  ansible.builtin.include_tasks:
    file: nvidia_container_toolkit_wrapper.yml
    apply:
      tags: [phase2f, nvidia, gpu, containers, docker]
  when: gpu_container_toolkit_enabled | default(false)
  tags: [phase2f, nvidia, gpu, containers, docker]

- name: Include GPU monitoring
  ansible.builtin.include_tasks:
    file: gpu_monitoring_wrapper.yml
    apply:
      tags: [phase2f, gpu, monitoring, dcgm]
  when: gpu_monitoring_enabled | default(false)
  tags: [phase2f, gpu, monitoring, dcgm]

- name: Include Vast.ai host installation
  ansible.builtin.include_tasks:
    file: vastai_host_installation.yml
    apply:
      tags: [phase2f, vastai, gpu, marketplace]
  when: vastai_enabled | default(false)
  tags: [phase2f, vastai, gpu, marketplace]

- name: Include Vast.ai host configuration
  ansible.builtin.include_tasks:
    file: vastai_host_configuration.yml
    apply:
      tags: [phase2f, vastai, gpu, config]
  when: vastai_enabled | default(false)
  tags: [phase2f, vastai, gpu, config]

################################################################################
# PHASE 3: Final Integration & Orchestration
################################################################################

- name: Include Kubernetes orchestration
  ansible.builtin.include_tasks:
    file: kubernetes_orchestration_wrapper.yml
    apply:
      tags: [phase3, kubernetes, orchestration]
  when: orchestration_kubernetes_enabled | default(false)
  tags: [phase3, kubernetes, orchestration]

- name: Include application deployment
  ansible.builtin.include_tasks:
    file: application_deployment_wrapper.yml
    apply:
      tags: [phase3, deployment, application]
  when: application_deployment_enabled | default(false)
  tags: [phase3, deployment, application]

- name: Include service mesh integration
  ansible.builtin.include_tasks:
    file: service_mesh_integration_wrapper.yml
    apply:
      tags: [phase3, service_mesh, networking]
  when: service_mesh_enabled | default(false)
  tags: [phase3, service_mesh, networking]

- name: Include disaster recovery
  ansible.builtin.include_tasks:
    file: disaster_recovery_wrapper.yml
    apply:
      tags: [phase3, disaster_recovery, backup]
  when: disaster_recovery_enabled | default(false)
  tags: [phase3, disaster_recovery, backup]

- name: Include advanced monitoring
  ansible.builtin.include_tasks:
    file: advanced_monitoring_wrapper.yml
    apply:
      tags: [phase3, monitoring, advanced]
  when: advanced_monitoring_enabled | default(false)
  tags: [phase3, monitoring, advanced]

################################################################################
# Summary
################################################################################

- name: Display role completion summary
  ansible.builtin.debug:
    msg: "Common role applied successfully - base server configuration complete"
  when: not ansible_check_mode
  tags: [always, summary]

- name: Display optional features status
  ansible.builtin.debug:
    msg: |
      Optional Features Status:
      ========================
      Monitoring:
        - Prometheus: {{ 'Enabled' if monitoring_prometheus_enabled | default(false) else 'Disabled' }}
        - Grafana: {{ 'Enabled' if monitoring_grafana_enabled | default(false) else 'Disabled' }}
        - AlertManager: {{ 'Enabled' if monitoring_alertmanager_enabled | default(false) else 'Disabled' }}
      Containers:
        - Docker: {{ 'Enabled' if container_docker_enabled | default(false) else 'Disabled' }}
      Service Discovery:
        - Consul: {{ 'Enabled' if service_discovery_consul_enabled | default(false) else 'Disabled' }}
        - HAProxy: {{ 'Enabled' if loadbalancing_haproxy_enabled | default(false) else 'Disabled' }}
      Security:
        - Vault: {{ 'Enabled' if security_vault_enabled | default(false) else 'Disabled' }}
      Databases:
        - PostgreSQL: {{ 'Enabled' if database_postgresql_enabled | default(false) else 'Disabled' }}
        - MySQL: {{ 'Enabled' if database_mysql_enabled | default(false) else 'Disabled' }}
      Orchestration:
        - Kubernetes: {{ 'Enabled' if orchestration_kubernetes_enabled | default(false) else 'Disabled' }}
  tags: [always, summary]
  when: not ansible_check_mode
