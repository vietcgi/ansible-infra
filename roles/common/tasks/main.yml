---
# Common Role - Main Tasks
# Provides OS-agnostic server foundation setup

- name: Import task files
  ansible.builtin.include_tasks: "{{ item }}"
  loop:
    # Core foundation tasks
    - validate_os.yml
    - system_update.yml
    - core_packages.yml
    - python.yml
    - manage_users.yml
    - chrony.yml
    - ssh_hardening.yml
    - sysctl.yml
    - audit.yml
    - limits.yml
    - dns.yml
    - logging.yml

    # Core foundation additions (recently added high-priority gaps)
    - hostname_domain.yml
    - swap_management.yml
    - encryption_at_rest.yml
    - change_tracking.yml
    - network_management.yml

    # PHASE 1: Security, Monitoring, and Backup
    - firewall.yml
    - fail2ban.yml
    - metrics.yml
    - log_shipping.yml
    - sudo_hardening.yml
    - vault.yml
    - backup.yml
    - apparmor.yml
    - selinux.yml

    # PHASE 1.A: Critical Security Hardening (Kernel, Password, Storage)
    - kernel_hardening.yml
    - password_policy.yml
    - storage_hardening.yml

    # PHASE 1.B: Operational Excellence (Performance, Monitoring, Compliance)
    - performance_tuning.yml
    - monitoring_tuning.yml
    - compliance_scanning.yml
    - compliance_automation.yml
    - backup_recovery_testing.yml

    # PHASE 2.A: Advanced Monitoring Stack (Upstream Role Wrappers)
    - monitoring_prometheus_wrapper.yml
    - monitoring_grafana_wrapper.yml
    - monitoring_alertmanager_wrapper.yml

    # PHASE 2.B: Container & Application Deployment (Docker)
    - docker_installation_wrapper.yml
    - docker_compose_wrapper.yml
    - docker_security_wrapper.yml

    # PHASE 2.C: Service Discovery & Load Balancing (Consul + HAProxy)
    - consul_installation_wrapper.yml
    - consul_service_discovery_wrapper.yml
    - haproxy_loadbalancer_wrapper.yml

    # PHASE 2.D: Security & PKI Infrastructure (HashiCorp Vault)
    - vault_installation_wrapper.yml
    - vault_pki_wrapper.yml
    - vault_secrets_rotation_wrapper.yml

    # PHASE 2.E: Database Replication & High Availability
    - postgresql_replication_wrapper.yml
    - mysql_galera_wrapper.yml

    # PHASE 3: Final Integration & Orchestration
    - kubernetes_orchestration_wrapper.yml
    - application_deployment_wrapper.yml
    - service_mesh_integration_wrapper.yml
    - disaster_recovery_wrapper.yml
    - advanced_monitoring_wrapper.yml

- name: Display role completion summary
  ansible.builtin.debug:
    msg: "Common role applied successfully - base server configuration complete"
  when: not ansible_check_mode

- name: Display PHASE 2.A status
  ansible.builtin.debug:
    msg: |
      ✓ PHASE 2.A Monitoring Stack Status:
      - Prometheus: {{ 'Enabled' if monitoring_prometheus_enabled | default(true) else 'Disabled' }}
      - Grafana: {{ 'Enabled' if monitoring_grafana_enabled | default(true) else 'Disabled' }}
      - AlertManager: {{ 'Enabled' if monitoring_alertmanager_enabled | default(true) else 'Disabled' }}
  tags:
    - monitoring
    - phase_2_a
    - summary
  when: not ansible_check_mode

- name: Display PHASE 2.B status
  ansible.builtin.debug:
    msg: |
      ✓ PHASE 2.B Container Deployment Status:
      - Docker: {{ 'Enabled' if container_docker_enabled | default(true) else 'Disabled' }}
      - Docker Compose: {{ 'Enabled' if container_docker_compose_enabled | default(true) else 'Disabled' }}
      - Security Hardening: Configured
  tags:
    - docker
    - containers
    - phase_2_b
    - summary
  when: not ansible_check_mode

- name: Display PHASE 2.C status
  ansible.builtin.debug:
    msg: |
      ✓ PHASE 2.C Service Discovery & Load Balancing Status:
      - Consul: {{ 'Enabled' if service_discovery_consul_enabled | default(false) else 'Disabled' }}
      - HAProxy: {{ 'Enabled' if loadbalancing_haproxy_enabled | default(false) else 'Disabled' }}
      - Service Integration: {{ 'Enabled' if (service_discovery_consul_enabled | default(false) and loadbalancing_haproxy_enabled | default(false)) else 'Not fully enabled' }}
  tags:
    - consul
    - haproxy
    - service_discovery
    - load_balancing
    - phase_2_c
    - summary
  when: not ansible_check_mode

- name: Display PHASE 2.D status
  ansible.builtin.debug:
    msg: |
      ✓ PHASE 2.D Security & PKI Infrastructure Status:
      - Vault: {{ 'Enabled' if security_vault_enabled | default(false) else 'Disabled' }}
      - PKI: {{ 'Enabled' if security_vault_pki_enabled | default(false) else 'Disabled' }}
      - Rotation: {{ 'Enabled' if (security_vault_database_rotation_enabled | default(false) or security_vault_ssh_rotation_enabled | default(false) or security_vault_api_key_rotation_enabled | default(false)) else 'Disabled' }}
      - Audit Logging: {{ 'Enabled' if security_vault_audit_enabled | default(false) else 'Disabled' }}
  tags:
    - vault
    - security
    - pki
    - secrets
    - phase_2_d
    - summary
  when: not ansible_check_mode
