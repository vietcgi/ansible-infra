---
# Common Role - Main Tasks
# Provides OS-agnostic server foundation setup

- name: Import task files
  include_tasks: "{{ item }}"
  loop:
    # Core foundation tasks
    - validate_os.yml
    - system_update.yml
    - core_packages.yml
    - python.yml
    - manage_users.yml
    - ntp.yml
    - ssh_hardening.yml
    - sysctl.yml
    - audit.yml
    - limits.yml
    - dns.yml
    - logging.yml

    # PHASE 1: Security, Monitoring, and Backup
    - firewall.yml
    - fail2ban.yml
    - metrics.yml
    - log_shipping.yml
    - sudo_hardening.yml
    - vault.yml
    - backup.yml
    - apparmor.yml
    - selinux.yml

- name: Display role completion summary
  debug:
    msg: "Common role applied successfully - base server configuration complete"
  when: not ansible_check_mode
