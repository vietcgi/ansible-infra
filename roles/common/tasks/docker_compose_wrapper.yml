---
# Docker Compose Installation & Management Wrapper Task
# Integrates Docker Compose v2 with organization customization
# Purpose: Install and configure Docker Compose for multi-container orchestration

# Pre-flight validation
- name: Validate Docker Compose requirements
  ansible.builtin.assert:
    that:
      - container_docker_compose_enabled | default(true) | bool
      - container_docker_enabled | default(true) | bool
    fail_msg: "Docker Compose requires Docker to be enabled"
    quiet: true
  tags:
    - docker_compose
    - containers
    - validation

# Check Docker installation
- name: Verify Docker is installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary_check
  tags:
    - docker_compose
    - validation

- name: Fail if Docker is not installed
  ansible.builtin.fail:
    msg: "Docker must be installed before Docker Compose installation"
  when: not docker_binary_check.stat.exists
  tags:
    - docker_compose
    - validation

# Create directories for Docker Compose configurations
- name: Create Docker Compose directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop:
    - /etc/docker/compose
    - /opt/docker-compose
    - "{{ container_docker_compose_data_dir | default('/data/docker-compose') }}"
  tags:
    - docker_compose
    - directories

# Detect current Docker Compose version
- name: Check existing Docker Compose version
  ansible.builtin.command:
    cmd: /usr/local/bin/docker-compose --version
  register: docker_compose_version_check
  changed_when: false
  ignore_errors: true
  tags:
    - docker_compose
    - version_check

# Install or update Docker Compose v2 (integrated into Docker)
- name: Enable Docker Compose v2 plugin
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags:
    - docker_compose
    - installation

# Install docker-compose command for backwards compatibility
- name: Install docker-compose wrapper script
  ansible.builtin.template:
    src: docker_compose_wrapper.sh.j2
    dest: /usr/local/bin/docker-compose
    owner: root
    group: root
    mode: "0755"
    backup: true
  become: true
  tags:
    - docker_compose
    - installation

# Create default Docker Compose environment file
- name: Create default Docker Compose environment
  ansible.builtin.template:
    src: docker_compose_env.j2
    dest: /etc/docker/compose/.env
    owner: root
    group: root
    mode: "0640"
    backup: true
  become: true
  tags:
    - docker_compose
    - config

# Configure Docker Compose project defaults
- name: Configure Docker Compose defaults
  ansible.builtin.template:
    src: docker_compose_defaults.j2
    dest: /etc/docker/compose/docker-compose.defaults.yml
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_defaults | default({}) | length > 0
  tags:
    - docker_compose
    - config

# Set up logging configuration for Docker Compose
- name: Configure Docker Compose logging
  ansible.builtin.copy:
    content: |
      # Docker Compose Logging Configuration
      # Logs are stored in: {{ container_docker_compose_log_dir | default('/var/log/docker-compose') }}
      # Log level: {{ container_docker_compose_log_level | default('info') }}
      # Max file size: {{ container_docker_compose_log_max_size | default('10m') }}
    dest: /etc/docker/compose/logging.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - docker_compose
    - logging

# Create log directory for Docker Compose services
- name: Create Docker Compose log directory
  ansible.builtin.file:
    path: "{{ container_docker_compose_log_dir | default('/var/log/docker-compose') }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags:
    - docker_compose
    - logging

# Configure Docker Compose network isolation
- name: Create Docker Compose network template
  ansible.builtin.template:
    src: docker_compose_networks.j2
    dest: /etc/docker/compose/networks.yml
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_networks | default([]) | length > 0
  tags:
    - docker_compose
    - network

# Set up volume management configuration
- name: Create Docker Compose volumes template
  ansible.builtin.template:
    src: docker_compose_volumes.j2
    dest: /etc/docker/compose/volumes.yml
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_volumes | default([]) | length > 0
  tags:
    - docker_compose
    - volumes
    - storage

# Configure Docker Compose health checks
- name: Configure Docker Compose health check defaults
  ansible.builtin.copy:
    content: |
      # Docker Compose Health Check Configuration
      # Default interval: {{ container_docker_compose_healthcheck_interval | default('30s') }}
      # Default timeout: {{ container_docker_compose_healthcheck_timeout | default('10s') }}
      # Default retries: {{ container_docker_compose_healthcheck_retries | default('3') }}
      # Default start period: {{ container_docker_compose_healthcheck_start_period | default('0s') }}
    dest: /etc/docker/compose/healthchecks.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  tags:
    - docker_compose
    - health

# Create systemd unit for docker-compose service management
- name: Create docker-compose systemd template directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker-compose@.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags:
    - docker_compose
    - systemd

# Create sample docker-compose project structure
- name: Create sample docker-compose project
  ansible.builtin.template:
    src: sample_docker_compose.yml.j2
    dest: /opt/docker-compose/sample.yml
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_install_samples | default(false) | bool
  tags:
    - docker_compose
    - samples

# Configure resource limits for Docker Compose
- name: Create resource limits configuration
  ansible.builtin.template:
    src: docker_compose_resource_limits.j2
    dest: /etc/docker/compose/resource-limits.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_resource_limits | default({}) | length > 0
  tags:
    - docker_compose
    - resources
    - performance

# Set up Docker Compose completion script
- name: Install Docker Compose bash completion
  ansible.builtin.copy:
    content: |
      # Docker Compose Bash Completion
      # Source this file in your .bashrc for tab completion
      _docker_compose_completion() {
        local cur="${COMP_WORDS[COMP_CWORD]}"
        local subcommands="up down pause unpause restart config ps images build exec"
        COMPREPLY=( $(compgen -W "${subcommands}" -- ${cur}) )
      }
      complete -F _docker_compose_completion docker-compose
    dest: /etc/bash_completion.d/docker-compose
    owner: root
    group: root
    mode: "0644"
  become: true
  when: ansible_os_family != "Alpine"
  tags:
    - docker_compose
    - completion

# Verify Docker Compose installation
- name: Verify Docker Compose installation
  ansible.builtin.command:
    cmd: docker-compose --version
  register: docker_compose_version
  changed_when: false
  tags:
    - docker_compose
    - validation
    - health

# Check Docker Compose connectivity to Docker daemon
- name: Test Docker Compose connectivity
  ansible.builtin.command:
    cmd: docker-compose --help
  register: docker_compose_help
  changed_when: false
  ignore_errors: true
  tags:
    - docker_compose
    - validation
    - health

# Create monitoring configuration
- name: Create Docker Compose monitoring template
  ansible.builtin.template:
    src: docker_compose_monitoring.j2
    dest: /etc/docker/compose/monitoring.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: container_docker_compose_monitoring | default(false) | bool
  tags:
    - docker_compose
    - monitoring

# Log Docker Compose installation success
- name: Log Docker Compose completion
  ansible.builtin.debug:
    msg: |
      ✓ Docker Compose Installation Complete:
      - Version: {{ docker_compose_version.stdout | default('unknown') }}
      - Status: Ready for deployment
      - Configuration: /etc/docker/compose/
      - Data Directory: {{ container_docker_compose_data_dir | default('/data/docker-compose') }}
  tags:
    - docker_compose
    - health
    - summary

# Final status message
- name: Docker Compose installation task completion
  ansible.builtin.debug:
    msg: "Docker Compose installation wrapper task completed successfully"
  when: not ansible_check_mode
  tags:
    - docker_compose
    - summary
