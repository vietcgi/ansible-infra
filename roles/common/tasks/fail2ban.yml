---
# fail2ban: Intrusion Prevention System
# Monitors logs for suspicious activity and implements automatic IP bans
# Protects against brute force attacks on SSH, mail, web services

- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  tags:
    - fail2ban
    - security
    - intrusion_prevention

- name: Create fail2ban local configuration directory
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - fail2ban

- name: Configure fail2ban main settings
  ansible.builtin.template:
    src: fail2ban_jail_local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Enable and start fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  tags:
    - fail2ban

- name: Configure SSH jail (sshd protection)
  ansible.builtin.template:
    src: fail2ban_sshd.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Configure Postfix jail (mail server protection)
  ansible.builtin.template:
    src: fail2ban_postfix.j2
    dest: /etc/fail2ban/jail.d/postfix.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: "'postfix' in ansible_facts.get('packages', {}) or fail2ban_enable_postfix | default(false)"
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Configure Nginx jail (web server protection)
  ansible.builtin.template:
    src: fail2ban_nginx.j2
    dest: /etc/fail2ban/jail.d/nginx.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: "'nginx' in ansible_facts.get('packages', {}) or fail2ban_enable_nginx | default(false)"
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Configure Apache jail (web server protection)
  ansible.builtin.template:
    src: fail2ban_apache.j2
    dest: /etc/fail2ban/jail.d/apache.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: "('apache2' in ansible_facts.get('packages', {}) or 'httpd' in ansible_facts.get('packages', {})) or fail2ban_enable_apache
    | default(false)"
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Create recidivism jail for repeat offenders
  ansible.builtin.template:
    src: fail2ban_recidivism.j2
    dest: /etc/fail2ban/jail.d/recidivism.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Configure email notifications on ban
  when: fail2ban_enable_email_notifications | default(true)
  tags:
    - fail2ban
    - notifications

  block:
    - name: Install sendmail package for notifications
      ansible.builtin.package:
        name: sendmail
        state: present

    - name: Configure fail2ban action with email
      ansible.builtin.template:
        src: fail2ban_action_email.j2
        dest: /etc/fail2ban/action.d/sendmail-whois.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: restart fail2ban

- name: Configure fail2ban whitelist (prevent false positives)
  ansible.builtin.template:
    src: fail2ban_whitelist.j2
    dest: /etc/fail2ban/jail.d/whitelist.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart fail2ban
  tags:
    - fail2ban

- name: Set up fail2ban log rotation
  ansible.builtin.template:
    src: fail2ban_logrotate.j2
    dest: /etc/logrotate.d/fail2ban
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags:
    - fail2ban
    - logging

- name: Create fail2ban status monitoring script
  ansible.builtin.template:
    src: fail2ban_status.j2
    dest: /usr/local/bin/fail2ban-status
    owner: root
    group: root
    mode: "0755"
  tags:
    - fail2ban
    - monitoring

- name: Verify fail2ban service status
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  tags:
    - fail2ban

- name: Display fail2ban configuration summary
  ansible.builtin.debug:
    msg: |
      fail2ban Configuration Complete:
      ================================
      Service: fail2ban IPS (Intrusion Prevention System)
      Status: {{ ansible_facts.get('services', {}).get('fail2ban', {}).get('state', 'unknown') }}

      Protected Services:
      - SSH: bantime={{ fail2ban_bantime_ssh | default(3600) }}s ({{ fail2ban_findtime_ssh | default(600) }}s window)
      - Max attempts: {{ fail2ban_maxretry | default(5) }}
      {% if fail2ban_enable_postfix | default(false) %}
      - Postfix: enabled
      {% endif %}
      {% if fail2ban_enable_nginx | default(false) %}
      - Nginx: enabled
      {% endif %}
      {% if fail2ban_enable_apache | default(false) %}
      - Apache: enabled
      {% endif %}

      Features:
      - Email notifications: {{ fail2ban_enable_email_notifications | default(true) | ternary('enabled', 'disabled') }}
      - Recidivism tracking: enabled (longer bans for repeat offenders)
      - Whitelist: configured
      - Logs: /var/log/fail2ban.log
    verbosity: 1
  tags:
    - fail2ban

- name: Check fail2ban status
  ansible.builtin.command: fail2ban-client status
  changed_when: false
  register: fail2ban_status
  tags:
    - fail2ban
    - validate

- name: Report active jails
  ansible.builtin.debug:
    msg: "{{ fail2ban_status.stdout }}"
    verbosity: 2
  tags:
    - fail2ban
