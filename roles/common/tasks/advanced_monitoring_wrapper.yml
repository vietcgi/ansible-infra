---
# Advanced Monitoring & Observability Wrapper
# Implements comprehensive observability with distributed tracing, log aggregation, and advanced alerting

- name: Advanced Monitoring & Observability Block
  block:
    # Validate monitoring prerequisites
    - name: Validate advanced monitoring prerequisites
      ansible.builtin.assert:
        that:
          - orchestration_distributed_tracing_enabled | default(false) | bool or
            orchestration_log_aggregation_enabled | default(true) | bool
        fail_msg: "Advanced monitoring requires at least one observability component enabled"
      when: monitoring_observability_enabled | default(true) | bool

    # Create monitoring namespace
    - name: Create monitoring namespace for observability
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: observability
            labels:
              monitoring: enabled
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install OpenTelemetry Collector for distributed tracing
    - name: Install OpenTelemetry Collector
      ansible.builtin.shell: |
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo update
        helm upgrade --install opentelemetry-collector open-telemetry/opentelemetry-collector \
          --namespace observability \
          --set mode=daemonset \
          --set presets.kubeEventsCollection.enabled=true \
          --set presets.kubernetesAttributes.enabled=true
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_distributed_tracing_enabled | default(false) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install Jaeger for distributed tracing backend
    - name: Install Jaeger for trace collection and analysis
      ansible.builtin.shell: |
        helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
        helm repo update
        helm upgrade --install jaeger jaegertracing/jaeger \
          --namespace observability \
          --set elasticsearch.enabled=false \
          --set cassandra.enabled=false \
          --set collector.enabled=true \
          --set query.enabled=true \
          --set agent.enabled=true
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_distributed_tracing_enabled | default(false) | bool
        - orchestration_distributed_tracing_backend | default('jaeger') == 'jaeger'
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install Elasticsearch for log aggregation
    - name: Install Elasticsearch for log storage
      ansible.builtin.shell: |
        helm repo add elastic https://helm.elastic.co
        helm repo update
        helm upgrade --install elasticsearch elastic/elasticsearch \
          --namespace observability \
          --set replicas=1 \
          --set nodeGroup=master \
          --set resources.requests.memory="{{ monitoring_elasticsearch_memory | default('1Gi') }}" \
          --set resources.requests.cpu="{{ monitoring_elasticsearch_cpu | default('500m') }}"
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_log_aggregation_enabled | default(true) | bool
        - orchestration_log_aggregation_backend | default('elasticsearch') == 'elasticsearch'
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install Fluent Bit for log shipping
    - name: Install Fluent Bit for log collection
      ansible.builtin.shell: |
        helm repo add fluent https://fluent.github.io/helm-charts
        helm repo update
        helm upgrade --install fluent-bit fluent/fluent-bit \
          --namespace observability \
          --set config.outputs.es.enabled=true \
          --set config.outputs.es.host=elasticsearch.observability.svc.cluster.local \
          --set config.outputs.es.port=9200 \
          --set resources.requests.memory="{{ monitoring_fluent_bit_memory | default('256Mi') }}" \
          --set resources.requests.cpu="{{ monitoring_fluent_bit_cpu | default('200m') }}"
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_log_aggregation_enabled | default(true) | bool
        - monitoring_log_collection_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install Kibana for log visualization
    - name: Install Kibana for log visualization
      ansible.builtin.shell: |
        helm repo add elastic https://helm.elastic.co
        helm repo update
        helm upgrade --install kibana elastic/kibana \
          --namespace observability \
          --set elasticsearchHosts=http://elasticsearch:9200 \
          --set service.type=LoadBalancer \
          --set resources.requests.memory="{{ monitoring_kibana_memory | default('512Mi') }}" \
          --set resources.requests.cpu="{{ monitoring_kibana_cpu | default('250m') }}"
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - orchestration_log_aggregation_enabled | default(true) | bool
        - monitoring_kibana_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Configure Prometheus metrics scraping
    - name: Create Prometheus scrape configuration for observability
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-observability-config
          data:
            observability-targets.yml: |
              global:
                scrape_interval: {{ monitoring_metrics_scrape_interval | default('15s') }}
                evaluation_interval: {{ monitoring_metrics_evaluation_interval | default('15s') }}

              scrape_configs:
                - job_name: 'opentelemetry-collector'
                  static_configs:
                    - targets: ['opentelemetry-collector.observability:8888']

                - job_name: 'jaeger'
                  static_configs:
                    - targets: ['jaeger.observability:14269']

                - job_name: 'kubernetes-apiservers'
                  kubernetes_sd_configs:
                    - role: endpoints
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
                      action: keep
                      regex: default;kubernetes

                - job_name: 'kubernetes-pods'
                  kubernetes_sd_configs:
                    - role: pod
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                      action: keep
                      regex: 'true'
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - monitoring_prometheus_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Create alerting rules for observability
    - name: Create Prometheus alerting rules for observability
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-observability-alerts
          data:
            observability-alerts.yml: |
              groups:
                - name: observability
                  interval: 30s
                  rules:
                    - alert: TraceCollectorDown
                      expr: up{job="opentelemetry-collector"} == 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Trace collector is down"

                    - alert: JaegerDown
                      expr: up{job="jaeger"} == 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Jaeger backend is down"

                    - alert: ElasticsearchDown
                      expr: elasticsearch_up == 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Elasticsearch is down"

                    - alert: HighErrorRate
                      expr: |
                        (sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) /
                         sum(rate(http_requests_total[5m])) by (service)) > {{ monitoring_error_rate_threshold | default('0.05') }}
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "High error rate detected in {{ $labels.service }}"

                    - alert: HighLatency
                      expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > {{ monitoring_latency_threshold | default('1') }}
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "High latency detected"
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - monitoring_alerting_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Configure alertmanager for alert routing
    - name: Create AlertManager configuration for observability alerts
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: alertmanager-observability
          data:
            alertmanager.yml: |
              global:
                resolve_timeout: 5m

              route:
                group_by: ['alertname', 'cluster', 'service']
                group_wait: 10s
                group_interval: 10s
                repeat_interval: 12h
                receiver: 'observability-team'
                routes:
                  - match:
                      severity: critical
                    receiver: 'observability-critical'

              receivers:
                - name: 'observability-team'
                  email_configs:
                    - to: '{{ monitoring_alert_email | default("ops-team@example.com") }}'
                      from: 'alertmanager@example.com'
                      smarthost: '{{ monitoring_smtp_host | default("smtp.example.com:587") }}'

                - name: 'observability-critical'
                  email_configs:
                    - to: '{{ monitoring_critical_alert_email | default("on-call@example.com") }}'
                      from: 'alertmanager@example.com'
                      smarthost: '{{ monitoring_smtp_host | default("smtp.example.com:587") }}'
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - monitoring_alerting_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Install Grafana dashboards for observability
    - name: Create Grafana dashboards for observability metrics
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-observability-dashboards
          data:
            observability-dashboard.json: |
              {
                "dashboard": {
                  "title": "Observability Stack Status",
                  "panels": [
                    {
                      "title": "Distributed Traces Collected",
                      "targets": [
                        {
                          "expr": "rate(traces_received_total[5m])"
                        }
                      ]
                    },
                    {
                      "title": "Log Events Ingested",
                      "targets": [
                        {
                          "expr": "rate(log_events_received_total[5m])"
                        }
                      ]
                    },
                    {
                      "title": "Alert Status",
                      "targets": [
                        {
                          "expr": "ALERTS{alertstate=\"firing\"}"
                        }
                      ]
                    }
                  ]
                }
              }
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      when:
        - monitoring_grafana_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Wait for observability stack to be ready
    - name: Wait for observability components to become ready
      ansible.builtin.pause:
        seconds: 45
      when:
        - monitoring_observability_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])

    # Verify observability stack installation
    - name: Verify observability stack deployment
      ansible.builtin.shell: |
        kubectl get pods -n observability -o wide
      become: yes
      become_user: root
      environment:
        KUBECONFIG: /root/.kube/config
      register: observability_status
      when:
        - monitoring_observability_enabled | default(true) | bool
        - inventory_hostname == groups['kubernetes_control_plane'][0] | default(groups['kubernetes_masters'][0])
      ignore_errors: yes

    # Display monitoring configuration
    - name: Display advanced monitoring configuration status
      ansible.builtin.debug:
        msg: |
          Advanced Monitoring & Observability Configuration:
          ✓ Distributed Tracing: {{ 'Enabled' if orchestration_distributed_tracing_enabled | default(false) else 'Disabled' }}
          ✓ Tracing Backend: {{ orchestration_distributed_tracing_backend | default('jaeger') }}
          ✓ Log Aggregation: {{ 'Enabled' if orchestration_log_aggregation_enabled | default(true) else 'Disabled' }}
          ✓ Log Backend: {{ orchestration_log_aggregation_backend | default('elasticsearch') }}
          ✓ Metrics Collection: {{ 'Enabled' if monitoring_prometheus_enabled | default(true) else 'Disabled' }}
          ✓ Alert Management: {{ 'Enabled' if monitoring_alerting_enabled | default(true) else 'Disabled' }}
          ✓ Visualization: {{ 'Enabled' if monitoring_grafana_enabled | default(true) else 'Disabled' }}
          ✓ Log Visualization: {{ 'Enabled' if monitoring_kibana_enabled | default(true) else 'Disabled' }}
          ✓ Metrics Retention: {{ orchestration_metrics_retention_period | default('30d') }}

  rescue:
    - name: Advanced monitoring configuration failed
      ansible.builtin.debug:
        msg: |
          Advanced monitoring and observability configuration encountered an error.
          This may occur if Helm charts are unavailable or Kubernetes is not properly configured.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}

  tags:
    - monitoring
    - observability
    - tracing
    - logging

- name: Display advanced monitoring summary
  ansible.builtin.debug:
    msg: |
      ✓ Advanced Monitoring & Observability Status:
      - Distributed Tracing: {{ 'Enabled' if orchestration_distributed_tracing_enabled | default(false) else 'Disabled' }}
      - Log Aggregation: {{ 'Enabled' if orchestration_log_aggregation_enabled | default(true) else 'Disabled' }}
      - Alert Management: {{ 'Enabled' if monitoring_alerting_enabled | default(true) else 'Disabled' }}
      - Metrics Retention: {{ orchestration_metrics_retention_period | default('30d') }}
  when: not ansible_check_mode
