---
# Role Metadata - common
# Defines role dependencies, platforms, and galaxy configuration

galaxy_info:
  author: Kevin (ansible-infra)
  description: OS-agnostic foundation for Linux and macOS servers
  company: Ansible-Infra Framework
  license: GPL-3.0-or-later
  min_ansible_version: "2.15"
  max_ansible_version: "2.19"  # Tested up to 2.19, prevent use with untested versions

  # Galaxy tags for discoverability
  tags:
    - system
    - foundation
    - provisioning
    - linux
    - macos
    - ubuntu
    - debian
    - centos
    - rhel
    - alpine
    - rocky
    - almalinux
    - system-administration
    - infrastructure

  # Supported platforms with minimum versions
  platforms:
    - name: Ubuntu
      versions:
        - "20.04"
        - "22.04"
        - "24.04"
    - name: Debian
      versions:
        - "11"
        - "12"
    - name: CentOS
      versions:
        - "8"
        - "9"
    - name: RedHat
      versions:
        - "8"
        - "9"
    - name: Rocky
      versions:
        - "8"
        - "9"
    - name: AlmaLinux
      versions:
        - "8"
        - "9"
    - name: Alpine
      versions:
        - "3.16"
        - "3.17"
        - "3.18"
        - "3.19"
        - "3.20"
    - name: macOS
      versions:
        - "12"
        - "13"
        - "14"
        - "15"

  # Galaxy categories
  categories:
    - system
    - packaging
    - network
    - monitoring

# Role dependencies (none - this is a foundation role)
dependencies: []
