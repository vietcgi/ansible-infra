---
# Role Metadata - common
# Defines role dependencies, platforms, and galaxy configuration

galaxy_info:
  author: Kevin (ansible-infra)
  description: OS-agnostic foundation for Linux and macOS servers
  company: Ansible-Infra Framework
  license: GPL-3.0-or-later
  min_ansible_version: "2.15"
  max_ansible_version: "2.19"  # Tested up to 2.19, prevent use with untested versions

  # Galaxy tags for discoverability
  tags:
    - system
    - foundation
    - provisioning
    - linux
    - macos
    - ubuntu
    - debian
    - centos
    - rhel
    - alpine
    - rocky
    - almalinux
    - system-administration
    - infrastructure

  # Supported platforms with minimum versions
  platforms:
    - name: Ubuntu
      versions:
        - "20.04"
        - "22.04"
        - "24.04"
    - name: Debian
      versions:
        - "11"
        - "12"
    - name: CentOS
      versions:
        - "8"
        - "9"
    - name: RedHat
      versions:
        - "8"
        - "9"
    - name: Rocky
      versions:
        - "8"
        - "9"
    - name: AlmaLinux
      versions:
        - "8"
        - "9"
    - name: Alpine
      versions:
        - "3.16"
        - "3.17"
        - "3.18"
        - "3.19"
        - "3.20"
    - name: macOS
      versions:
        - "12"
        - "13"
        - "14"
        - "15"

  # Galaxy categories
  categories:
    - system
    - packaging
    - network
    - monitoring

# Role dependencies (none - this is a foundation role)
dependencies: []

# Role metadata
_meta:
  # Documentation
  documentation:
    url: https://github.com/ansible-infra/roles/common
    readme: README.md
    description: Foundation infrastructure configuration for all servers

  # Task organization
  tasks:
    count: 11
    areas:
      - OS validation and compatibility checking
      - System package updates and upgrades
      - Core utility package installation
      - Python runtime configuration
      - NTP time synchronization
      - SSH daemon hardening
      - Kernel parameter tuning (sysctl)
      - System audit logging
      - File descriptor limits configuration
      - DNS resolver configuration
      - Log rotation and retention

  # Configuration items
  configurable_items:
    count: 79
    categories:
      - system_updates: 2
      - core_packages: 10
      - python_packages: 3
      - ntp_configuration: 4
      - ssh_hardening: 3
      - kernel_tuning: 14
      - file_limits: 2
      - logging: 1
      - dns_configuration: 3
      - miscellaneous: 37

  # Templates
  templates:
    count: 7
    files:
      - sshd_config.j2
      - ntp.conf.j2
      - audit.rules.j2
      - limits.conf.j2
      - dns_netplan.yaml.j2
      - resolv.conf.j2
      - logrotate_ansible_infra.j2

  # Handlers
  handlers:
    count: 6
    include:
      - restart sshd (Linux systemd)
      - restart sshd macOS (launchctl)
      - restart ntp (Debian)
      - restart ntpd (RedHat)
      - restart auditd

  # Quality metrics
  quality:
    code_style: strict
    documentation_coverage: 100%
    error_handling: comprehensive
    idempotence: guaranteed

  # OS support
  os_support:
    debian_family:
      - ubuntu
      - debian
    redhat_family:
      - centos
      - rhel
      - rocky
      - almalinux
    darwin_family:
      - macos

  # Version Information
  version:
    major: 1
    minor: 0
    patch: 0
    status: production
    released: 2025-11-15

  # Role capabilities
  capabilities:
    os_validation: true
    package_management: true
    time_synchronization: true
    ssh_hardening: true
    kernel_tuning: true
    audit_logging: true
    dns_configuration: true
    multi_platform: true

  # Performance
  performance:
    first_run_time_minutes: 2-5
    idempotent_run_time_seconds: 30
    network_usage_mb: "50-200 (depends on OS updates)"
    disk_usage_mb: "500-2000"

  # Security
  security:
    ssh_security: true
    audit_logging: true
    kernel_hardening: true
    file_limit_management: true
    compliance_ready: true

  # Maintenance
  support:
    level: enterprise
    maintenance_status: actively-developed
    security_updates: regular
    testing: production-verified

  # Integration
  integration:
    framework: ansible-infra
    role_type: foundation
    run_before: "All platform-specific roles"
    run_with: "provision.yml and configure.yml playbooks"

  # Requirements
  requirements:
    ansible_min_version: "2.15"
    python_min_version: "3.8"
    system_requirements:
      - ssh_access
      - sudo_privileges
      - 500MB_disk_space

  # Notes
  notes:
    - "This role is OS-agnostic and designed as a foundation"
    - "Should be applied before platform-specific roles"
    - "Idempotent - safe to run repeatedly"
    - "Fully customizable via variables"
    - "Production-tested on multiple Linux distributions and macOS"
