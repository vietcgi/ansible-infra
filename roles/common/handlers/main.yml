---
# Common Role - Handlers

- name: restart sshd
  systemd:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
    daemon_reload: yes
  become: yes
  failed_when: false
  listen: restart sshd

- name: restart sshd macos
  command: sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist && sudo launchctl load /System/Library/LaunchDaemons/ssh.plist
  changed_when: false
  listen: restart sshd macos

- name: restart ntp
  systemd:
    name: ntp
    state: restarted
  become: yes
  listen: restart ntp

- name: restart ntpd
  systemd:
    name: ntpd
    state: restarted
  become: yes
  listen: restart ntpd

- name: restart auditd
  systemd:
    name: auditd
    state: restarted
  become: yes
  failed_when: false
  listen: restart auditd

- name: Check chronyd service status
  ansible.builtin.command: systemctl show -p LoadState --value chronyd.service
  changed_when: false
  register: chronyd_load_state
  failed_when: false
  listen: restart chronyd

- name: Restart chronyd if service is loaded
  systemd:
    name: chronyd
    state: restarted
    daemon_reload: yes
  become: yes
  when: chronyd_load_state.rc | default(0) == 0 and chronyd_load_state.stdout | default('not-found') != 'not-found'
  failed_when: false
  listen: restart chronyd

- name: apply netplan
  command: netplan apply
  become: yes
  changed_when: false
  listen: apply netplan

- name: restart networking
  systemd:
    name: networking
    state: restarted
  become: yes
  listen: restart networking

- name: restart network service
  systemd:
    name: network
    state: restarted
  become: yes
  listen: restart network service

- name: restart keepalived
  systemd:
    name: keepalived
    state: restarted
    daemon_reload: yes
  become: yes
  listen: restart keepalived

- name: restart rsyslog
  systemd:
    name: rsyslog
    state: restarted
    daemon_reload: yes
  become: yes
  failed_when: false
  listen: restart rsyslog

- name: daemon reload
  systemd:
    daemon_reload: yes
  become: yes
  failed_when: false
  listen: daemon reload

- name: restart ufw
  systemd:
    name: ufw
    state: restarted
  become: yes
  listen: restart ufw
  ignore_errors: true

- name: restart firewalld
  systemd:
    name: firewalld
    state: restarted
  become: yes
  listen: restart firewalld
  ignore_errors: true

- name: restart fail2ban
  systemd:
    name: fail2ban
    state: restarted
    daemon_reload: yes
  become: yes
  listen: restart fail2ban
  ignore_errors: true

- name: reload systemd
  systemd:
    daemon_reload: yes
  become: yes
  listen: reload systemd

- name: reload systemd settings
  systemd:
    daemon_reload: yes
  become: yes
  listen: reload systemd settings

- name: reload sysctl
  command: sysctl -p
  become: yes
  changed_when: false
  listen: reload sysctl
  ignore_errors: true

- name: reload apparmor
  command: systemctl reload apparmor
  become: yes
  changed_when: false
  listen: reload apparmor
  ignore_errors: true

- name: restart systemd-resolved
  systemd:
    name: systemd-resolved
    state: restarted
  become: yes
  listen: restart systemd-resolved
  ignore_errors: true

- name: reload vault
  command: systemctl reload vault
  become: yes
  changed_when: false
  listen: reload vault
  ignore_errors: true

- name: reload prometheus
  command: systemctl reload prometheus
  become: yes
  changed_when: false
  listen: "reload prometheus"
  ignore_errors: true

- name: Check prometheus service status
  ansible.builtin.command: systemctl show -p LoadState --value prometheus.service
  changed_when: false
  register: prometheus_load_state
  failed_when: false
  listen: restart prometheus

- name: Restart prometheus if service is loaded
  systemd:
    name: prometheus
    state: restarted
    daemon_reload: yes
  become: yes
  when: prometheus_load_state.rc | default(0) == 0 and prometheus_load_state.stdout | default('not-found') != 'not-found'
  failed_when: false
  listen: restart prometheus

- name: reload alertmanager
  command: systemctl reload alertmanager
  become: yes
  changed_when: false
  listen: "reload alertmanager"
  ignore_errors: true

- name: Check node_exporter service status
  ansible.builtin.command: systemctl show -p LoadState --value node_exporter.service
  changed_when: false
  register: node_exporter_load_state
  failed_when: false
  listen: restart node_exporter

- name: Restart node_exporter if service is loaded
  systemd:
    name: node_exporter
    state: restarted
    daemon_reload: yes
  become: yes
  when: node_exporter_load_state.rc | default(0) == 0 and node_exporter_load_state.stdout | default('not-found') != 'not-found'
  failed_when: false
  listen: restart node_exporter

- name: Check filebeat service status
  ansible.builtin.command: systemctl show -p LoadState --value filebeat.service
  changed_when: false
  register: filebeat_load_state
  failed_when: false
  listen: restart filebeat

- name: Restart filebeat if service is loaded
  systemd:
    name: filebeat
    state: restarted
    daemon_reload: yes
  become: yes
  when: filebeat_load_state.stdout != 'not-found'
  failed_when: false
  listen: restart filebeat

- name: restart grafana
  systemd:
    name: grafana-server
    state: restarted
  become: yes
  listen: "restart grafana"
  ignore_errors: true
