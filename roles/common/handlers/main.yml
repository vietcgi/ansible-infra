---
# Common Role - Handlers

- name: restart sshd
  systemd:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
    daemon_reload: yes
  become: yes
  listen: restart sshd

- name: restart sshd macos
  command: sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist && sudo launchctl load /System/Library/LaunchDaemons/ssh.plist
  listen: restart sshd macos

- name: restart ntp
  systemd:
    name: ntp
    state: restarted
  become: yes
  listen: restart ntp

- name: restart ntpd
  systemd:
    name: ntpd
    state: restarted
  become: yes
  listen: restart ntpd

- name: restart auditd
  systemd:
    name: auditd
    state: restarted
  become: yes
  listen: restart auditd

- name: restart chronyd
  block:
    - name: Attempt chronyd restart with graceful fallback
      systemd:
        name: chronyd
        state: restarted
      become: yes
      register: chronyd_restart_result
      ignore_errors: yes

    - name: If restart fails, try to start the service
      systemd:
        name: chronyd
        state: started
      become: yes
      when: chronyd_restart_result is failed
      ignore_errors: yes

    - name: Verify chronyd configuration if restart failed
      shell: |
        # Check if chronyd can validate its config
        chronyd -Q 2>/dev/null || echo "Chronyd validation completed"
      changed_when: false
      when: chronyd_restart_result is failed
      ignore_errors: yes
  listen: restart chronyd

- name: apply netplan
  command: netplan apply
  become: yes
  listen: apply netplan

- name: restart networking
  systemd:
    name: networking
    state: restarted
  become: yes
  listen: restart networking

- name: restart network service
  systemd:
    name: network
    state: restarted
  become: yes
  listen: restart network service

- name: restart keepalived
  systemd:
    name: keepalived
    state: restarted
    daemon_reload: yes
  become: yes
  listen: restart keepalived

- name: restart rsyslog
  systemd:
    name: rsyslog
    state: restarted
    daemon_reload: yes
  become: yes
  listen: restart rsyslog

- name: daemon reload
  systemd:
    daemon_reload: yes
  become: yes
  listen: daemon reload

- name: restart ufw
  systemd:
    name: ufw
    state: restarted
  become: yes
  listen: restart ufw
  ignore_errors: yes

- name: restart firewalld
  systemd:
    name: firewalld
    state: restarted
  become: yes
  listen: restart firewalld
  ignore_errors: yes

- name: reload systemd
  systemd:
    daemon_reload: yes
  become: yes
  listen: reload systemd

- name: reload systemd settings
  systemd:
    daemon_reload: yes
  become: yes
  listen: reload systemd settings

- name: reload sysctl
  command: sysctl -p
  become: yes
  listen: reload sysctl
  ignore_errors: yes

- name: reload apparmor
  command: systemctl reload apparmor
  become: yes
  listen: reload apparmor
  ignore_errors: yes

- name: restart systemd-resolved
  systemd:
    name: systemd-resolved
    state: restarted
  become: yes
  listen: restart systemd-resolved
  ignore_errors: yes

- name: reload vault
  command: systemctl reload vault
  become: yes
  listen: reload vault
  ignore_errors: yes

- name: reload prometheus
  command: systemctl reload prometheus
  become: yes
  listen: "reload prometheus"
  ignore_errors: yes

- name: reload alertmanager
  command: systemctl reload alertmanager
  become: yes
  listen: "reload alertmanager"
  ignore_errors: yes

- name: restart grafana
  systemd:
    name: grafana-server
    state: restarted
  become: yes
  listen: "restart grafana"
  ignore_errors: yes
