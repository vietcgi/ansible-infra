---
# Common Role - Handlers

- name: Restart sshd
  ansible.builtin.systemd:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
    daemon_reload: true
  become: true
  failed_when: false
  listen: restart sshd

- name: Restart sshd macos
  ansible.builtin.command: sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist && sudo launchctl load
    /System/Library/LaunchDaemons/ssh.plist
  changed_when: false
  listen: restart sshd macos

- name: Restart ntp
  ansible.builtin.systemd:
    name: ntp
    state: restarted
  become: true
  listen: restart ntp

- name: Restart ntpd
  ansible.builtin.systemd:
    name: ntpd
    state: restarted
  become: true
  listen: restart ntpd

- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  become: true
  failed_when: false
  listen: restart auditd

- name: Check chronyd service status
  ansible.builtin.command: systemctl show -p LoadState --value chronyd.service
  changed_when: false
  register: chronyd_load_state
  failed_when: false
  listen: restart chronyd

- name: Restart chronyd if service is loaded
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
    daemon_reload: true
  become: true
  when: chronyd_load_state.rc | default(0) == 0 and chronyd_load_state.stdout | default('not-found') != 'not-found'
  failed_when: false
  listen: restart chronyd

- name: Apply netplan
  ansible.builtin.command: netplan apply
  become: true
  changed_when: false
  listen: apply netplan

- name: Restart networking
  ansible.builtin.systemd:
    name: networking
    state: restarted
  become: true
  listen: restart networking

- name: Restart network service
  ansible.builtin.systemd:
    name: network
    state: restarted
  become: true
  listen: restart network service

- name: Restart keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: restarted
    daemon_reload: true
  become: true
  listen: restart keepalived

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    daemon_reload: true
  become: true
  failed_when: false
  listen: restart rsyslog

- name: Daemon reload
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  failed_when: false
  listen: daemon reload

- name: Restart ufw
  ansible.builtin.systemd:
    name: ufw
    state: restarted
  become: true
  listen: restart ufw
  ignore_errors: true

- name: Restart firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: restarted
  become: true
  listen: restart firewalld
  ignore_errors: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    daemon_reload: true
  become: true
  listen: restart fail2ban
  ignore_errors: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  listen: reload systemd

- name: Reload systemd settings
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  listen: reload systemd settings

- name: Reload sysctl
  ansible.builtin.command: sysctl -p
  become: true
  changed_when: false
  listen: reload sysctl
  ignore_errors: true

- name: Reload apparmor
  ansible.builtin.command: systemctl reload apparmor
  become: true
  changed_when: false
  listen: reload apparmor
  ignore_errors: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  listen: restart systemd-resolved
  ignore_errors: true

- name: Reload vault
  ansible.builtin.command: systemctl reload vault
  become: true
  changed_when: false
  listen: reload vault
  ignore_errors: true

- name: Reload prometheus
  ansible.builtin.command: systemctl reload prometheus
  become: true
  changed_when: false
  listen: "reload prometheus"
  ignore_errors: true

- name: Check prometheus service status
  ansible.builtin.command: systemctl show -p LoadState --value prometheus.service
  changed_when: false
  register: prometheus_load_state
  failed_when: false
  listen: restart prometheus

- name: Restart prometheus if service is loaded
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true
  become: true
  when: prometheus_load_state.rc | default(0) == 0 and prometheus_load_state.stdout | default('not-found') !=
    'not-found'
  failed_when: false
  listen: restart prometheus

- name: Reload alertmanager
  ansible.builtin.command: systemctl reload alertmanager
  become: true
  changed_when: false
  listen: "reload alertmanager"
  ignore_errors: true

- name: Check node_exporter service status
  ansible.builtin.command: systemctl show -p LoadState --value node_exporter.service
  changed_when: false
  register: node_exporter_load_state
  failed_when: false
  listen: restart node_exporter

- name: Restart node_exporter if service is loaded
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true
  become: true
  when: node_exporter_load_state.rc | default(0) == 0 and node_exporter_load_state.stdout | default('not-found') !=
    'not-found'
  failed_when: false
  listen: restart node_exporter

- name: Check filebeat service status
  ansible.builtin.command: systemctl show -p LoadState --value filebeat.service
  changed_when: false
  register: filebeat_load_state
  failed_when: false
  listen: restart filebeat

- name: Restart filebeat if service is loaded
  ansible.builtin.systemd:
    name: filebeat
    state: restarted
    daemon_reload: true
  become: true
  when: filebeat_load_state.stdout != 'not-found'
  failed_when: false
  listen: restart filebeat

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  become: true
  listen: "restart grafana"
  ignore_errors: true
