---
# Common Role - Default Variables

## BACKUP STRATEGY
# Configuration file backups are automatically created when modified
# Backups are stored with timestamps: <filename>.YYYY-MM-DD@HH:MM:SS~
# Location: Same directory as the original file
# Retention: Keeps last 10 backups automatically via Ansible
# To restore: cp /etc/ssh/sshd_config.YYYY-MM-DD@HH:MM:SS~ /etc/ssh/sshd_config

## DRY-RUN MODE
# To run in dry-run mode (no changes made):
# ansible-playbook playbooks/provision.yml -i inventories/projects/my-project --check
# This will:
#   1. Report all changes that WOULD be made
#   2. NOT make any actual changes
#   3. Still validate configurations (e.g., sshd -t for SSH config)

# System Updates
common_update_packages: true
common_upgrade_packages: true

# Core Utilities
common_core_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - tree
  - jq
  - tmux
  - unzip
  - net-tools

# Python Requirements
common_python_packages:
  - python3-pip
  - python3-dev
  - python3-venv

# Time Management (Chrony)
common_timezone: "UTC"
common_chrony_enabled: true
common_chrony_servers:
  - 0.pool.ntp.org iburst
  - 1.pool.ntp.org iburst
  - 2.pool.ntp.org iburst
  - 3.pool.ntp.org iburst
common_chrony_pool_enabled: true
common_chrony_ntp_domain: pool.ntp.org

# SSH Hardening
common_ssh_port: 22
common_ssh_permit_root_login: "no"
common_ssh_password_authentication: "no"
common_ssh_key_bits: 4096

# Sysctl Parameters (OS Tuning) - Production Performance Optimized
common_sysctl_config:
  # Network performance - Optimized for high throughput
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 65536
  net.ipv4.tcp_max_syn_backlog: 2048
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_fin_timeout: 10

  # Multipath routing optimizations
  net.ipv4.fib_multipath_hash_policy: 1
  net.ipv4.fib_multipath_use_neigh: 1

  # ARP cache optimizations (high-traffic environments)
  net.ipv4.neigh.default.gc_thresh1: 80000
  net.ipv4.neigh.default.gc_thresh2: 90000
  net.ipv4.neigh.default.gc_thresh3: 100000

  # TCP buffer optimization (throughput for gigabit+ networks)
  net.ipv4.tcp_mem: '1535106 2046809 10000000'
  net.ipv4.tcp_rmem: '4096 131072 6291456'
  net.ipv4.tcp_wmem: '4096 16384 4194304'

  # Port range for high-connection scenarios
  net.ipv4.ip_local_port_range: '1024 65535'
  net.ipv4.tcp_moderate_rcvbuf: 1

  # File system optimizations
  fs.file-max: 12000500
  fs.nr_open: 20000500

  # Security
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0

  # ICMP
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1

# File Limits - Production Grade
common_file_limits:
  soft: 1039999
  hard: 1039999

# Process limits for high-concurrency environments
common_process_limits:
  soft: 9999999
  hard: 9999999

# Logging
common_enable_audit: true
common_log_retention_days: 30

# DNS Resolution
common_dns_servers:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1

# Miscellaneous
common_hostname_environment: production
common_chrony_synchronize_on_boot: true
common_chrony_rtc_sync: true
common_disable_swap: false

