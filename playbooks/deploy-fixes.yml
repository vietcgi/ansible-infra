---
- name: Deploy KumoMTA Fixes
  hosts: mail_servers
  become: true
  vars:
    email_domain: "vietcgi.us"
    email_server_ip: "108.181.38.69"
    # Required by email-delivery role but not used for the tasks we are running
    cloudflare_api_token: "dummy_token"
    cloudflare_zone_id: "dummy_zone_id"
    letsencrypt_email: "admin@vietcgi.us"

  roles:
    - kumomta

  tasks:
    - name: Configure KumoMTA Delivery
      include_role:
        name: email-delivery
        tasks_from: kumomta-delivery.yml

    - name: Configure Email Routing
      include_role:
        name: email-delivery
        tasks_from: email-routing.yml
