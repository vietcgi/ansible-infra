---
# ansible-infra - Configuration Management Playbook
# Apply full configuration stack with Grafana monitoring and security
# Target: All servers requiring production-grade setup
#
# Usage:
#   ansible-playbook playbooks/configure.yml -i inventories/production/hosts.yml
#   ansible-playbook playbooks/configure.yml -i inventories/production/hosts.yml --tags grafana
#   ansible-playbook playbooks/configure.yml -i inventories/production/hosts.yml --skip-tags monitoring

- name: Ansible-infra - Configure Servers
  hosts: all
  become: true
  gather_facts: true
  vars:
    ansible_user: "{{ remote_user | default('ubuntu') }}"

  pre_tasks:
    - name: Validate configuration prerequisites
      ansible.builtin.ping:

    - name: Display configuration info
      ansible.builtin.debug:
        msg: |
          Configuring Server:
            Hostname: {{ inventory_hostname }}
            Environment: {{ common_hostname_environment }}
            Apply Full Stack: common, grafana-collection (agent, datasources, dashboards)

  roles:
    # Foundation - Core OS configuration
    - role: common
      tags:
        - foundation
        - always

    # Grafana Monitoring Stack (from grafana.grafana collection)
    - role: grafana.grafana.grafana_agent
      tags:
        - monitoring
        - grafana
      when: '"monitoring_disabled" not in group_names'
      vars:
        grafana_agent_version: "{{ grafana_agent_version | default('latest') }}"
        grafana_agent_enabled: true

    # Prometheus Stack (from prometheus.prometheus collection)
    - role: prometheus.prometheus.prometheus
      tags:
        - monitoring
        - prometheus
      when: '"prometheus_servers" in group_names'
      vars:
        prometheus_version: "{{ prometheus_version | default('latest') }}"
        prometheus_listen_address: "{{ prometheus_listen_address | default('0.0.0.0:9090') }}"

    - role: prometheus.prometheus.node_exporter
      tags:
        - monitoring
        - prometheus
      when: '"monitoring_disabled" not in group_names'
      vars:
        node_exporter_version: "{{ node_exporter_version | default('latest') }}"
        node_exporter_listen_address: "{{ node_exporter_listen_address | default('0.0.0.0:9100') }}"

    # Loki (from grafana.grafana collection)
    - role: grafana.grafana.loki
      tags:
        - monitoring
        - logging
      when: '"loki_servers" in group_names'

  post_tasks:
    - name: Verify full configuration
      ansible.builtin.assert:
        that:
          - ansible_os_family is defined
          - ansible_distribution is defined
        fail_msg: "Server configuration validation failed"
        success_msg: "✓ Server configured with full stack successfully"

    - name: Display configuration completion summary
      ansible.builtin.debug:
        msg: |
          Configuration Complete for {{ inventory_hostname }}
          ================================================
          Status: SUCCESS ✓

          Applied Layers:
          ✓ Foundation (common role)
          ✓ Grafana Agent (metrics collection)
          ✓ Prometheus (time-series DB)
          ✓ Loki (log aggregation)

          Next Actions:
          1. Verify monitoring dashboards in Grafana
          2. Configure data sources in Grafana
          3. Setup alerting rules and thresholds
          4. Enable log streaming to Loki
          5. Test failover scenarios
