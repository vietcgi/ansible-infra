---
# Complete Infrastructure Deployment Orchestration
# Deploy Proxmox → VMs → Firewalls → Wireguard VPN → Applications

- name: "Stage 1: Proxmox Hypervisor Setup"
  ansible.builtin.import_playbook: deploy-proxmox.yml
  when: deploy_stage is not defined or deploy_stage == 'all' or deploy_stage == 'proxmox'

- name: "Stage 2: Wait for VMs to Boot"
  hosts: vm_cluster
  gather_facts: false
  tasks:
    - name: Wait for VM network availability
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 300
        delay: 10
      when: groups['vm_cluster'] | default([]) | length > 0
      ignore_errors: true

- name: "Stage 3: Configure VM Base OS"
  hosts: vm_cluster
  gather_facts: true
  become: true
  roles:
    - role: common
      tags:
        - vm_base_config

- name: "Stage 4: Deploy Firewall Infrastructure"
  ansible.builtin.import_playbook: deploy-firewalls.yml
  when: deploy_stage is not defined or deploy_stage == 'all' or deploy_stage == 'firewalls'

- name: "Stage 5: Deploy Wireguard VPN"
  ansible.builtin.import_playbook: deploy-wireguard.yml
  when: deploy_stage is not defined or deploy_stage == 'all' or deploy_stage == 'wireguard'

- name: "Stage 6: Post-Deployment Verification"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display post-deployment summary
      ansible.builtin.debug:
        msg: |
          Infrastructure Deployment Pipeline Complete
          ===========================================

          Deployment Summary:
          {% if deploy_stage is not defined or 'proxmox' in deploy_stage or deploy_stage == 'all' %}
          ✓ Proxmox hypervisors configured
          ✓ VMs deployed and booted
          ✓ Base OS hardening applied to VMs
          {% endif %}
          {% if deploy_stage is not defined or 'firewalls' in deploy_stage or deploy_stage == 'all' %}
          ✓ Firewall infrastructure deployed (OPNSense and/or pfSense)
          {% endif %}
          {% if deploy_stage is not defined or 'wireguard' in deploy_stage or deploy_stage == 'all' %}
          ✓ Wireguard VPN established
          {% endif %}

          Infrastructure Status:
          → Proxmox: https://proxmox.example.com
          → OPNSense: https://opnsense.example.com/ui
          → pfSense: https://pfsense.example.com
          → Monitoring: https://grafana.example.com

          Next Steps:
          1. Verify all services are accessible
          2. Configure application-specific roles
          3. Set up monitoring and alerting
          4. Configure backup and disaster recovery
          5. Run security compliance checks
          6. Load test infrastructure
          7. Document runbooks
