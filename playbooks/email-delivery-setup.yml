---
# Email Delivery Setup Playbook
# Automates complete email server configuration including DNS, certificates, and KumoMTA
#
# Supports multiple DNS providers: Cloudflare, Route53, Google Cloud DNS, Azure DNS, or manual
# Email server: KumoMTA with DKIM signing and automatic DNS record creation
#
# Requirements:
# - Target host must be Ubuntu/Debian with sudo access
# - For Cloudflare: cloudflare_api_token and cloudflare_zone_id
# - For AWS Route53: route53_access_key and route53_secret_key
# - For Google Cloud: GCP credentials and project ID
# - Ansible 2.9+ with community.general collection
#
# Usage Examples:
#
#   Cloudflare DNS Provider (default):
#   ansible-playbook playbooks/email-delivery-setup.yml \
#     --ask-vault-pass \
#     -e "email_domain=example.com" \
#     -e "email_server_ip=192.0.2.1" \
#     -e "dns_provider=cloudflare"
#
#   AWS Route53:
#   ansible-playbook playbooks/email-delivery-setup.yml \
#     -e "email_domain=example.com" \
#     -e "email_server_ip=192.0.2.1" \
#     -e "dns_provider=route53" \
#     -e "route53_region=us-east-1"
#
#   Manual DNS (user adds records manually):
#   ansible-playbook playbooks/email-delivery-setup.yml \
#     -e "email_domain=example.com" \
#     -e "email_server_ip=192.0.2.1" \
#     -e "dns_provider=manual"
#
# See docs/DNS_PROVIDER_EXTENSIBILITY.md for adding new DNS providers

- name: Complete Email Delivery Platform Setup
  hosts: all
  become: true
  gather_facts: true

  vars:
    # ========== REQUIRED VARIABLES ==========
    # These MUST be provided via command line (-e) or inventory
    email_domain: ""                    # REQUIRED: Your domain name (e.g., example.com)
    email_server_ip: ""                 # REQUIRED: Server public IP address
    cloudflare_api_token: ""            # REQUIRED: From vault (vault_cloudflare_api_token)
    cloudflare_zone_id: ""              # REQUIRED: From vault (vault_cloudflare_zone_id)

    # ========== OPTIONAL VARIABLES WITH DEFAULTS ==========
    letsencrypt_email: "admin@{{ email_domain }}"

    # DKIM Configuration
    # Must match kumomta_dkim_selector to ensure policy and DNS records use same selector
    dkim_selector: "{{ kumomta_dkim_selector | default('default') }}"
    dkim_key_size: 2048

    # DMARC Configuration
    dmarc_policy: "none"
    dmarc_subdomain_policy: "quarantine"
    dmarc_percent: 100
    dmarc_report_email: "dmarc-reports@{{ email_domain }}"
    dmarc_forensics_email: "dmarc-forensics@{{ email_domain }}"

    # SPF Configuration
    spf_include_domains: []  # Additional domains to include in SPF

    # KumoMTA Configuration
    kumomta_max_delivery_attempts: 5
    kumomta_max_retry_delay: 86400
    kumomta_max_messages_per_minute: 300
    kumomta_max_message_size: 104857600  # 100MB
    kumomta_sender_messages_per_minute: 100

    # ========== DNS PROVIDER SELECTION ==========
    # Choose which DNS provider to use: cloudflare, route53, google_dns, azure_dns, manual
    # Set to 'manual' if using a provider without Ansible module support
    dns_provider: "cloudflare"

    # Cloudflare Integration Configuration
    cloudflare_enabled: "{{ dns_provider == 'cloudflare' }}"
    cloudflare_dns_enabled: "{{ dns_provider == 'cloudflare' }}"
    cloudflare_logging_enabled: "{{ dns_provider == 'cloudflare' }}"

    # Route53 Integration Configuration (for AWS deployments)
    # route53_enabled: "{{ dns_provider == 'route53' }}"
    # route53_dns_enabled: "{{ dns_provider == 'route53' }}"
    # route53_region: "us-east-1"
    # route53_access_key: ""  # From vault: vault_route53_access_key
    # route53_secret_key: ""  # From vault: vault_route53_secret_key

    # Google Cloud DNS Integration Configuration
    # google_dns_enabled: "{{ dns_provider == 'google_dns' }}"
    # gcp_project_id: ""
    # gcp_credentials_file: ""

    # General Configuration
    monitoring_enabled: true

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - email_domain is defined and email_domain != ""
          - email_server_ip is defined and email_server_ip != ""
          - letsencrypt_email is defined and letsencrypt_email != ""
          - (vault_cloudflare_api_token is defined and vault_cloudflare_api_token != "") or (cloudflare_api_token is defined and cloudflare_api_token != "")
          - (vault_cloudflare_zone_id is defined and vault_cloudflare_zone_id != "") or (cloudflare_zone_id is defined and cloudflare_zone_id != "")
        fail_msg: |
          Missing required variables. Please provide:
          - email_domain: Your domain name (e.g., example.com)
          - email_server_ip: Server public IP address (e.g., 192.0.2.1)
          - letsencrypt_email: Email for Let's Encrypt (e.g., admin@example.com)
          - vault_cloudflare_api_token or cloudflare_api_token: Cloudflare API token
          - vault_cloudflare_zone_id or cloudflare_zone_id: Cloudflare zone ID

    - name: Map vault variables to cloudflare_integration role variables
      set_fact:
        cloudflare_api_token: "{{ vault_cloudflare_api_token | default(cloudflare_api_token) }}"
        cloudflare_zone_id: "{{ vault_cloudflare_zone_id | default(cloudflare_zone_id) }}"

    - name: Set default DMARC report emails if not provided
      set_fact:
        dmarc_report_email: "{{ dmarc_report_email or 'postmaster@' + email_domain }}"
        dmarc_forensics_email: "{{ dmarc_forensics_email or 'security@' + email_domain }}"

    - name: Set default Let's Encrypt domains if not provided
      set_fact:
        letsencrypt_domains: "{{ letsencrypt_domains | default([email_domain, 'mail.' + email_domain]) }}"

    - name: Display configuration summary
      debug:
        msg: |
          ===== Email Delivery Setup Configuration =====
          Domain: {{ email_domain }}
          Server IP: {{ email_server_ip }}
          DKIM Selector: {{ dkim_selector }}
          DMARC Policy: {{ dmarc_policy }}
          LE Email: {{ letsencrypt_email }}
          ============================================

    - name: Update system packages
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Determine Cloudflare zone from email domain
      set_fact:
        # Extract zone by checking 2-3 level domains (handles subdomains like vietcgi.nguoivietcali.com)
        zone_parts: "{{ email_domain.split('.') }}"

    - name: Set cloudflare_zone_name (3+ part domain is subdomain, 2-part is root)
      set_fact:
        cloudflare_zone_name: "{{ '.'.join(zone_parts[-2:]) if zone_parts | length == 2 else '.'.join(zone_parts[-2:]) if zone_parts | length >= 2 else email_domain }}"
        cloudflare_record_name: "{{ '.'.join(zone_parts[:-2]) if zone_parts | length > 2 else '@' }}"

    - name: Build Cloudflare DNS records for email delivery
      set_fact:
        cloudflare_dns_records: |
          [
            {
              "zone": "{{ cloudflare_zone_name }}",
              "record": "{{ cloudflare_record_name if cloudflare_record_name != '@' else cloudflare_record_name }}",
              "type": "A",
              "value": "{{ email_server_ip }}",
              "ttl": 3600,
              "proxied": false,
              "state": "present"
            },
            {
              "zone": "{{ cloudflare_zone_name }}",
              "record": "{{ cloudflare_record_name if cloudflare_record_name != '@' else cloudflare_record_name }}",
              "type": "MX",
              "value": "{{ email_domain }}",
              "ttl": 3600,
              "proxied": false,
              "state": "present"
            },
            {
              "zone": "{{ cloudflare_zone_name }}",
              "record": "{{ cloudflare_record_name if cloudflare_record_name != '@' else cloudflare_record_name }}",
              "type": "TXT",
              "value": "v=spf1 ip4:{{ email_server_ip }} ~all",
              "ttl": 3600,
              "proxied": false,
              "state": "present"
            },
            {
              "zone": "{{ cloudflare_zone_name }}",
              "record": "_dmarc.{{ cloudflare_record_name if cloudflare_record_name != '@' else '' }}",
              "type": "TXT",
              "value": "v=DMARC1; p={{ dmarc_policy }}; sp={{ dmarc_subdomain_policy }}; pct={{ dmarc_percent }}; rua=mailto:{{ dmarc_report_email }}; ruf=mailto:{{ dmarc_forensics_email }}",
              "ttl": 3600,
              "proxied": false,
              "state": "present"
            }
          ]
      when: cloudflare_dns_enabled

  # ========== ROLE ORCHESTRATION WITH EXPLICIT ORDERING ==========
  # Using include_role with explicit ordering to ensure:
  # 1. KumoMTA role runs first (generates DKIM keys and facts)
  # 2. DKIM facts are available before Cloudflare DNS record creation
  # 3. Cloudflare role uses DKIM facts to create complete DNS records
  # ================================================================

  roles:
    - role: kumomta
      tags: [kumomta]

  tasks:
    # After kumomta role completes, DKIM facts are now available
    # Add DKIM DNS record to the cloudflare_dns_records array
    - name: Add DKIM DNS record for Cloudflare automation
      set_fact:
        cloudflare_dns_records: "{{ cloudflare_dns_records | default([]) + [dkim_record] }}"
      vars:
        # Construct DKIM record field: selector._domainkey.subdomain
        # NOT selector._domainkey.full.domain.com (that would double the zone)
        dkim_record_field: "{{ dkim_selector }}._domainkey{{ '.' + cloudflare_record_name if cloudflare_record_name != '@' else '' }}"
        dkim_record:
          zone: "{{ cloudflare_zone_name }}"
          record: "{{ dkim_record_field }}"
          type: "TXT"
          value: "{{ dkim_dns_record_value }}"
          ttl: 3600
          proxied: false
          state: "present"
      when:
        - cloudflare_dns_enabled
        - dkim_public_key_value is defined
      tags: [cloudflare, dns, dkim]

    - name: Include Cloudflare integration role
      include_role:
        name: cloudflare_integration
      when: cloudflare_dns_enabled
      tags: [cloudflare, dns]

    - name: Include Route53 integration role
      include_role:
        name: route53_integration
      when: dns_provider == 'route53'
      tags: [route53, dns]

    # Additional DNS provider roles can be added here following the same pattern
    # - name: Include Google Cloud DNS integration role
    #   include_role:
    #     name: google_dns_integration
    #   when: dns_provider == 'google_dns'
    #   tags: [google_dns, dns]

    - name: Include email-delivery role
      include_role:
        name: email-delivery
      tags: [email-delivery]

  post_tasks:
    - name: Final health check
      command: /usr/local/bin/kumomta-health-check.sh
      register: health_check_result
      changed_when: false

    - name: Display health check results
      debug:
        msg: "{{ health_check_result.stdout }}"

    - name: Display next steps
      debug:
        msg: |
          ===== Email Delivery Setup Complete =====

          Configuration Summary:
          ✓ DKIM keys generated ({{ email_domain }})
          ✓ KumoMTA configured with DKIM signing
          ✓ Routing and policy scripts deployed

          {% if cloudflare_dns_enabled %}
          ✓ DNS Records automatically created in Cloudflare:
            - A record:     {{ email_domain }} → {{ email_server_ip }}
            - MX record:    {{ email_domain }} → {{ email_domain }}
            - SPF record:   v=spf1 ip4:{{ email_server_ip }} ~all
            - DMARC record: v=DMARC1; p={{ dmarc_policy }}; ...
            - DKIM record:  {{ dkim_selector }}._domainkey.{{ email_domain }}
          {% else %}
          ⚠ Cloudflare DNS disabled - add DNS records manually:
            A record:     {{ email_domain }} → {{ email_server_ip }}
            MX record:    {{ email_domain }} → {{ email_domain }}
            SPF record:   v=spf1 ip4:{{ email_server_ip }} ~all
            DMARC record: v=DMARC1; p={{ dmarc_policy }}; sp={{ dmarc_subdomain_policy }}; pct={{ dmarc_percent }}; rua=mailto:{{ dmarc_report_email }}; ruf=mailto:{{ dmarc_forensics_email }}
            DKIM record:  {{ dkim_selector }}._domainkey.{{ email_domain }} = v=DKIM1; k=rsa; p={{ dkim_public_key_value if dkim_public_key_value is defined else '[GENERATE KEY FIRST]' }}
          {% endif %}

          Next Steps:
          1. Verify DNS propagation (wait 5-10 minutes for propagation):
             - nslookup {{ email_domain }}
             - nslookup -type=MX {{ email_domain }}
             - nslookup -type=TXT {{ dkim_selector }}._domainkey.{{ email_domain }}
             - nslookup -type=TXT _dmarc.{{ email_domain }}

          2. Test email delivery:
             - Send test email to verify delivery
             - Check KumoMTA logs: tail -f /var/log/kumomta/kumomta.log

          3. Monitor server status:
             - Run: /usr/local/bin/kumomta-monitoring-status.sh

          4. Setup backups:
             - Backup DKIM keys: /opt/kumomta/etc/dkim/
             - Backup certificates: /etc/letsencrypt/live/{{ email_domain }}/
             - Backup configuration: /opt/kumomta/etc/policy/init.lua

          Configuration:
          - Domain: {{ email_domain }}
          - Server IP: {{ email_server_ip }}
          - DKIM Selector: {{ dkim_selector }}
          - DMARC Policy: {{ dmarc_policy }}
          - DNS Provider: {{ 'Cloudflare' if cloudflare_dns_enabled else 'Manual' }}

          =========================================
