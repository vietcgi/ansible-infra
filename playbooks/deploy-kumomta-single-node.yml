---
# KumoMTA Single Node Deployment
# Deploy KumoMTA on a single mail server

- name: Deploy KumoMTA - Single Node
  hosts: mail_servers
  become: true
  gather_facts: true

  # NOTE: Most vars come from group_vars/all.yml and group_vars/mail_servers.yml
  # Only override here if needed for this specific playbook
  vars:
    # Installation
    kumomta_enabled: true
    kumomta_version: "1.1.2"

    # Network
    kumomta_hostname: "{{ inventory_hostname }}"
    kumomta_listen_port: 25
    kumomta_submit_port: 587
    kumomta_tls_port: 465

    # Security
    kumomta_tls_enabled: true
    kumomta_dkim_enabled: true

    # Performance - DO NOT OVERRIDE: Use group_vars instead
    # kumomta_worker_threads: comes from inventories/projects/vietcgi/group_vars/mail_servers.yml
    kumomta_max_connections: 1000
    kumomta_max_concurrent_connections_per_domain: 50

    # Environment variables for thread pool control (Rayon + Rust threading)
    # Dynamic based on system CPU count: 50% of cores, minimum 4, maximum 32
    kumomta_env_variables:
      RAYON_NUM_THREADS: "{{ [[(ansible_processor_vcpus | default(4) | int) // 2, 4] | max, 32] | min }}"
      RUST_LOG: "info"
      RUST_BACKTRACE: "0"

    # Queue Management
    kumomta_queue_strategy: "exponential_backoff"
    kumomta_queue_retry_interval: 300
    kumomta_queue_max_attempts: 20

    # Monitoring
    kumomta_monitoring_enabled: true
    kumomta_metrics_enabled: true

    # Bounce Handling
    kumomta_bounce_handling_enabled: true
    kumomta_fbl_enabled: true

    # Backup
    kumomta_backup_enabled: true
    kumomta_backup_hour: 2
    kumomta_backup_minute: 0

    # Service
    kumomta_service_enabled: true
    kumomta_service_state: started

  pre_tasks:
    - name: Validate host connectivity
      ansible.builtin.wait_for:
        port: 22
        state: started
        timeout: 10
      delegate_to: "{{ inventory_hostname }}"
      run_once: false

    - name: Display deployment information
      ansible.builtin.debug:
        msg: |
          Deploying KumoMTA Single Node
          ===============================
          Hostname: {{ kumomta_hostname }}
          SMTP Port: {{ kumomta_listen_port }}
          Submission Port: {{ kumomta_submit_port }}
          TLS Port: {{ kumomta_tls_port }}
          Metrics Port: {{ kumomta_metrics_port }}
          TLS: {{ 'Enabled' if kumomta_tls_enabled else 'Disabled' }}
          DKIM: {{ 'Enabled' if kumomta_dkim_enabled else 'Disabled' }}
          Monitoring: {{ 'Enabled' if kumomta_monitoring_enabled else 'Disabled' }}

  roles:
    - kumomta

  post_tasks:
    - name: Wait for service to be fully started
      ansible.builtin.wait_for:
        port: "{{ kumomta_listen_port }}"
        state: started
        timeout: 30

    - name: Verify service health
      ansible.builtin.command:
        cmd: "systemctl is-active kumomta.service"
      register: service_status
      changed_when: false
      failed_when: service_status.rc != 0

    - name: Check systemd service environment variables
      ansible.builtin.shell:
        cmd: "systemctl show kumomta.service -p Environment | grep -o 'RAYON_NUM_THREADS=[0-9]*' || echo 'RAYON_NUM_THREADS not set'"
      register: env_vars_check
      changed_when: false

    - name: Get KumoMTA process ID
      ansible.builtin.shell:
        cmd: "pgrep -f 'kumod' | head -1"
      register: kumomta_pid
      changed_when: false

    - name: Check process CPU affinity (how many CPUs visible to process)
      ansible.builtin.shell:
        cmd: "taskset -p {{ kumomta_pid.stdout }} 2>/dev/null | tail -1 || echo 'CPU affinity: unknown'"
      register: cpu_affinity
      changed_when: false
      when: kumomta_pid.stdout | length > 0

    - name: Check recent logs for available_parallelism
      ansible.builtin.shell:
        cmd: "journalctl -u kumomta.service -n 50 --no-pager | grep -i 'available_parallelism\\|concurrency\\|spooling' | tail -3 || echo 'No parallelism info in logs yet'"
      register: parallelism_logs
      changed_when: false

    - name: Verify metrics endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ kumomta_metrics_port | default(9184) }}/metrics"
        method: GET
      register: metrics_check
      changed_when: false
      failed_when: false

    - name: Display post-deployment status
      ansible.builtin.debug:
        msg: |
          ✓ KumoMTA Single Node Deployment Complete
          ===========================================

          Service Status: {{ service_status.stdout }}
          Configuration: Valid
          Queue Directory: {{ kumomta_queue_dir }}
          Log Directory: {{ kumomta_log_dir }}

          CONCURRENCY CONFIGURATION:
          - RAYON_NUM_THREADS: {{ env_vars_check.stdout }}
          - Process ID: {{ kumomta_pid.stdout }}
          - CPU Affinity: {{ cpu_affinity.stdout | default('not available') }}
          - Parallelism Detection: {{ parallelism_logs.stdout }}

          METRICS ENDPOINT:
          - Status: {{ 'ACTIVE ✓' if metrics_check.status == 200 else 'INACTIVE ✗' }}
          - URL: http://{{ inventory_hostname }}:{{ kumomta_metrics_port | default(9184) }}/metrics
          - Queue Depth: Check metrics endpoint for scheduled_count_total

          DEPLOYMENT SUMMARY:
          - Worker Threads Config: {{ kumomta_worker_threads | default('12') }}
          - Memory Limit: {{ kumomta_memory_limit }}
          - CPU Quota: {{ kumomta_cpu_quota }}

          NEXT STEPS:
          1. Monitor queue draining: curl http://{{ inventory_hostname }}:9184/metrics | grep scheduled_count_total
          2. Check logs for concurrency info: journalctl -u kumomta.service -f | grep -i concurrency
          3. Verify email delivery: Test sending message to external domain
          4. Run diagnostics if still single-threaded: bash CONCURRENCY_TROUBLESHOOTING.sh

          IMPORTANT:
          - Environment variable RAYON_NUM_THREADS={{ kumomta_env_variables.RAYON_NUM_THREADS | default('12') }} was configured
          - This should improve concurrency detection from 1 to {{ kumomta_env_variables.RAYON_NUM_THREADS | default('12') }} threads
          - If parallelism still shows 1: Check CPU affinity above and run diagnostics
          - If queue draining: Deployment successful ✓
          - If queue still backing up: Additional investigation needed
