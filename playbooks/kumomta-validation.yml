---
# KumoMTA Validation and Verification Playbook
# Run post-deployment validation checks

- name: Validate KumoMTA Deployment
  hosts: kumomta
  become: true
  gather_facts: true

  tasks:
    - name: Collect KumoMTA facts
      block:
        - name: Get service status
          ansible.builtin.systemd:
            name: kumomta.service
          register: kumomta_service

        - name: Get binary version
          ansible.builtin.command:
            cmd: "{{ kumomta_home }}/kumomta --version"
          register: kumomta_version
          changed_when: false

        - name: Check configuration validity
          ansible.builtin.command:
            cmd: "{{ kumomta_home }}/kumomta --validate-config {{ kumomta_config_dir }}/kumomta.conf"
          register: config_valid
          changed_when: false

        - name: Get listening ports
          ansible.builtin.command:
            cmd: "netstat -tlnp 2>/dev/null | grep kumomta || ss -tlnp | grep kumomta"
          register: listening_ports
          changed_when: false
          failed_when: false

        - name: Check disk space
          ansible.builtin.command:
            cmd: "df -h {{ kumomta_queue_dir }}"
          register: disk_space
          changed_when: false

        - name: Get recent logs
          ansible.builtin.command:
            cmd: "journalctl -u kumomta.service -n 10 --no-pager"
          register: recent_logs
          changed_when: false

    - name: Perform connectivity tests
      block:
        - name: Test SMTP port connectivity
          ansible.builtin.wait_for:
            port: "{{ kumomta_listen_port }}"
            state: started
            timeout: 5
          register: smtp_port_test

        - name: Test submission port connectivity
          ansible.builtin.wait_for:
            port: "{{ kumomta_submit_port }}"
            state: started
            timeout: 5
          register: submission_port_test

        - name: Test metrics port connectivity
          ansible.builtin.wait_for:
            port: "{{ kumomta_metrics_port }}"
            state: started
            timeout: 5
          when: kumomta_metrics_enabled | bool
          register: metrics_port_test

      rescue:
        - name: Log connectivity issues
          ansible.builtin.debug:
            msg: "Some ports may not be fully accessible; check firewall rules"

    - name: Generate validation report
      ansible.builtin.template:
        src: validation-report.txt.j2
        dest: "/tmp/kumomta-validation-{{ inventory_hostname }}.txt"
        owner: root
        group: root
        mode: '0644'
      vars:
        report_timestamp: "{{ ansible_date_time.iso8601 }}"
        report_service_status: "{{ kumomta_service.status | default({}) }}"
        report_version: "{{ kumomta_version.stdout | default('unknown') }}"
        report_config_valid: "{{ config_valid.rc == 0 }}"
        report_smtp_test: "{{ smtp_port_test.get('invocation', {}).get('port', kumomta_listen_port) }}"

    - name: Display validation results
      ansible.builtin.debug:
        msg: |
          ================================
          KumoMTA Validation Report
          ================================
          Hostname: {{ inventory_hostname }}
          Timestamp: {{ ansible_date_time.iso8601 }}

          Service Status
          ==============
          Status: {{ kumomta_service.status.ActiveState | default('unknown') }}
          Enabled: {{ kumomta_service.status.UnitFileState | default('unknown') }}

          Binary Information
          ==================
          Version: {{ kumomta_version.stdout }}
          Location: {{ kumomta_home }}/kumomta

          Configuration
          ==============
          Valid: {{ 'YES' if config_valid.rc == 0 else 'NO' }}
          Location: {{ kumomta_config_dir }}/kumomta.conf

          Network Connectivity
          ====================
          SMTP Port ({{ kumomta_listen_port }}): {{ 'OK' if smtp_port_test.failed is not defined or not smtp_port_test.failed else 'FAILED' }}
          Submission Port ({{ kumomta_submit_port }}): {{ 'OK' if submission_port_test.failed is not defined or not submission_port_test.failed else 'FAILED' }}
          {% if kumomta_metrics_enabled %}
          Metrics Port ({{ kumomta_metrics_port }}): {{ 'OK' if metrics_port_test.failed is not defined or not metrics_port_test.failed else 'FAILED' }}
          {% endif %}

          Disk Space
          ==========
          Queue Directory: {{ kumomta_queue_dir }}
          {{ disk_space.stdout_lines[-1] if disk_space.stdout_lines else 'Unable to determine' }}

          Recent Log Entries
          ==================
          {{ recent_logs.stdout }}

          ================================
          Validation Complete

- name: Aggregate Validation Results
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Fetch validation reports from all hosts
      ansible.builtin.fetch:
        src: "/tmp/kumomta-validation-{{ inventory_hostname }}.txt"
        dest: "/tmp/kumomta-reports/"
        flat: yes
      delegate_to: "{{ item }}"
      loop: "{{ groups['kumomta'] }}"
      failed_when: false

    - name: Display aggregated summary
      ansible.builtin.debug:
        msg: |
          ✓ KumoMTA Deployment Validation Complete
          ==========================================

          Validated Hosts: {{ groups['kumomta'] | length }}
          Reports Location: /tmp/kumomta-reports/

          Recommendations:
          1. Review validation reports for any failures
          2. Check firewall rules if ports are not accessible
          3. Monitor service logs for any errors
          4. Configure monitoring/alerting if not already done
          5. Set up DNS records (SPF, DKIM, DMARC)
