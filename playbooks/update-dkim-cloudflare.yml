---
- name: Update DKIM DNS Record on Cloudflare for vietcgi.nguoivietcali.com
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    email_domain: "vietcgi.nguoivietcali.com"
    cloudflare_zone_name: "nguoivietcali.com"
    cloudflare_record_name: "vietcgi"
    dkim_selector: "default"
    dkim_public_key: ""
    cloudflare_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"

  tasks:
    - name: Validate Cloudflare API token is provided
      assert:
        that:
          - cloudflare_api_token != ""
        fail_msg: "CLOUDFLARE_API_TOKEN environment variable must be set"

    - name: Update DKIM TXT Record on Cloudflare
      community.general.cloudflare_dns:
        zone: "{{ cloudflare_zone_name }}"
        record: "{{ dkim_selector }}._domainkey.{{ cloudflare_record_name }}"
        type: "TXT"
        value: "v=DKIM1; k=rsa; p={{ dkim_public_key }}"
        ttl: 3600
        api_token: "{{ cloudflare_api_token }}"
      register: dkim_update_result

    - name: Display DKIM update result
      debug:
        msg: |
          ✓ DKIM record updated successfully!
          Zone: {{ cloudflare_zone_name }}
          Record: {{ dkim_selector }}._domainkey.{{ cloudflare_record_name }}
          Domain: {{ email_domain }}
          Type: TXT
          TTL: 3600

          Public Key:
          v=DKIM1; k=rsa; p={{ dkim_public_key }}

          Cloudflare Response:
          {{ dkim_update_result }}
