---
# Cloudflare Integration - Idempotency Validation Playbook
# Verifies that playbook is idempotent (running twice = no changes second time)
# This is a core Ansible principle - deployments should be safe to re-run
#
# Usage:
#   1. Run deployment first time: ansible-playbook examples/cloudflare_deployment.yml
#   2. Run this validation: ansible-playbook examples/cloudflare_idempotency_test.yml
#   3. Should show 0 changed, all tasks "ok"

- name: Cloudflare Integration - Idempotency Test
  hosts: localhost
  gather_facts: false

  vars:
    cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"
    cloudflare_domain: "{{ vault_cloudflare_domain | default('example.com') }}"

  pre_tasks:
    - name: Display test purpose
      ansible.builtin.debug:
        msg: |
          Idempotency Validation Test
          ============================

          This test verifies that the Cloudflare integration playbook is idempotent.

          Idempotency means:
          - Running the playbook multiple times produces the same result
          - Second and subsequent runs make no changes
          - Safe to re-run without side effects

          Expected Result:
          - All tasks: "ok"
          - Changed: 0
          - Failed: 0
      tags:
        - idempotency
        - always

  tasks:
    - name: Run deployment in check mode
      ansible.builtin.debug:
        msg: |
          Running deployment in check mode (dry-run) to detect changes...
          This simulates a second run without actually making changes.
      tags:
        - idempotency

    # ========================================================================
    # Test DNS Record Idempotency
    # ========================================================================

    - name: Test DNS record idempotency
      block:
        - name: Get current zone ID
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones?name={{ cloudflare_domain }}"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: zone_lookup
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - dns

        - name: Set zone ID fact
          ansible.builtin.set_fact:
            cloudflare_zone_id: "{{ zone_lookup.json.result[0].id }}"
          tags:
            - idempotency
            - dns

        - name: Get existing DNS records
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: dns_records_current
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - dns

        - name: Verify DNS records match expected configuration
          ansible.builtin.assert:
            that:
              - dns_records_current.json.result | length > 0
            fail_msg: "No DNS records found - configuration may not have been deployed"
            success_msg: "DNS records found and accessible"
          tags:
            - idempotency
            - dns

        - name: Display DNS record count
          ansible.builtin.debug:
            msg: "Found {{ dns_records_current.json.result | length }} DNS records"
          tags:
            - idempotency
            - dns
      tags:
        - idempotency

    # ========================================================================
    # Test WAF Configuration Idempotency
    # ========================================================================

    - name: Test WAF configuration idempotency
      block:
        - name: Get current WAF sensitivity level
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/settings/security_level"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: waf_current
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - waf

        - name: Verify WAF configuration applied
          ansible.builtin.debug:
            msg: "WAF sensitivity level: {{ waf_current.json.result.value }}"
          tags:
            - idempotency
            - waf
      tags:
        - idempotency

    # ========================================================================
    # Test DDoS Configuration Idempotency
    # ========================================================================

    - name: Test DDoS configuration idempotency
      block:
        - name: Get current DDoS status
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/settings/advanced_ddos"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: ddos_current
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - ddos

        - name: Verify DDoS configuration applied
          ansible.builtin.debug:
            msg: "DDoS protection: {{ ddos_current.json.result.value }}"
          tags:
            - idempotency
            - ddos
      tags:
        - idempotency

    # ========================================================================
    # Test SSL/TLS Configuration Idempotency
    # ========================================================================

    - name: Test SSL/TLS configuration idempotency
      block:
        - name: Get current SSL mode
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/settings/ssl"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: ssl_current
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - ssl

        - name: Verify SSL/TLS configuration applied
          ansible.builtin.debug:
            msg: "SSL/TLS mode: {{ ssl_current.json.result.value }}"
          tags:
            - idempotency
            - ssl
      tags:
        - idempotency

    # ========================================================================
    # Test Cache Configuration Idempotency
    # ========================================================================

    - name: Test cache configuration idempotency
      block:
        - name: Get current cache TTL
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/settings/browser_cache_ttl"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: cache_current
          changed_when: false
          no_log: true
          tags:
            - idempotency
            - cache

        - name: Verify cache configuration applied
          ansible.builtin.debug:
            msg: "Browser cache TTL: {{ cache_current.json.result.value }} seconds"
          tags:
            - idempotency
            - cache
      tags:
        - idempotency

  post_tasks:
    - name: Display idempotency test results
      ansible.builtin.debug:
        msg: |
          ================================================
          Idempotency Validation: COMPLETE ✓
          ================================================

          Verification Summary:
          ✓ DNS records are accessible
          ✓ WAF configuration applied
          ✓ DDoS protection enabled
          ✓ SSL/TLS mode configured
          ✓ Cache settings applied

          If you see:
          - Changed: 0
          - Failed: 0

          Then the playbook is IDEMPOTENT ✓
          Safe to re-run without side effects.
      tags:
        - idempotency
        - always

    - name: Idempotency test procedure
      ansible.builtin.debug:
        msg: |
          ================================================
          How to Perform Full Idempotency Test
          ================================================

          1. First Run (initial deployment):
             ansible-playbook examples/cloudflare_deployment.yml --ask-vault-pass

             Note the output:
             - Review CHANGED count
             - Note FAILED count (should be 0)

          2. Second Run (verify idempotency):
             ansible-playbook examples/cloudflare_deployment.yml --ask-vault-pass

             Expected output:
             - CHANGED: 0 (no changes made)
             - FAILED: 0 (no failures)
             - All tasks show "ok" or "skipped"

          3. Optional: Run with verbose output:
             ansible-playbook examples/cloudflare_deployment.yml \
               --ask-vault-pass -vvv

             Look for "ok" status on all tasks (not "changed")

          If CHANGED > 0 on second run:
          - There's an idempotency issue
          - Use -vvv to see which tasks are changing
          - May need to adjust changed_when conditions
      tags:
        - idempotency
        - always
