---
# Example: Cloudflare Integration Deployment Playbook
# Configure Cloudflare edge security for your infrastructure

- name: Configure Cloudflare Integration
  hosts: localhost
  gather_facts: false

  vars:
    # Cloudflare Configuration
    cloudflare_enabled: true
    cloudflare_domain: "example.com"
    cloudflare_plan: "pro"

    # DNS Management
    cloudflare_dns_enabled: true
    cloudflare_enable_dnssec: true
    cloudflare_dns_records:
      - zone: "example.com"
        record: "www"
        type: "A"
        value: "192.0.2.1"
        ttl: 3600
        proxied: true
        state: "present"

      - zone: "example.com"
        record: "api"
        type: "A"
        value: "192.0.2.2"
        ttl: 300
        proxied: true
        state: "present"

      - zone: "example.com"
        record: "mail"
        type: "MX"
        value: "mail.example.com"
        priority: 10
        state: "present"

      - zone: "example.com"
        record: "@"
        type: "TXT"
        value: "v=spf1 include:_spf.google.com ~all"
        ttl: 3600
        state: "present"

    # WAF Configuration
    cloudflare_waf_enabled: true
    cloudflare_waf_sensitivity_level: "medium"
    cloudflare_waf_paranoia_level: 2
    cloudflare_waf_enable_managed_rules: true
    cloudflare_waf_enable_owasp_crs: true
    cloudflare_waf_enable_dos_protection: true
    cloudflare_waf_enable_bot_management: false

    # WAF Geo-blocking (optional)
    cloudflare_waf_block_countries:
      # - "KP"  # North Korea
      # - "IR"  # Iran

    # WAF Rate Limiting
    cloudflare_waf_rate_limit_enabled: true
    cloudflare_waf_rate_limit_threshold: 100
    cloudflare_waf_rate_limit_period: 10
    cloudflare_waf_rate_limit_action: "challenge"

    # DDoS Protection
    cloudflare_ddos_protection_enabled: true
    cloudflare_ddos_sensitivity: "medium"
    cloudflare_ddos_http_flood_protection: true
    cloudflare_ddos_udp_flood_protection: true
    cloudflare_ddos_syn_flood_protection: true
    cloudflare_ddos_dns_amplification_protection: true
    cloudflare_ddos_rate_limit_enabled: true
    cloudflare_ddos_rate_limit_threshold: 1000

    # SSL/TLS Configuration
    cloudflare_ssl_tls_enabled: true
    cloudflare_ssl_tls_mode: "full_strict"
    cloudflare_ssl_tls_minimum_version: "1.2"
    cloudflare_universal_ssl_enabled: true
    cloudflare_universal_ssl_auto_renewal: true
    cloudflare_hsts_enabled: true
    cloudflare_hsts_max_age: 31536000
    cloudflare_hsts_include_subdomains: true
    cloudflare_hsts_preload: true

    # Security Headers
    cloudflare_strict_transport_security: true
    cloudflare_x_frame_options: "SAMEORIGIN"
    cloudflare_x_content_type_options: "nosniff"
    cloudflare_referrer_policy: "strict-origin-when-cross-origin"

    # Edge Caching
    cloudflare_edge_cache_enabled: true
    cloudflare_cache_default_ttl: 30
    cloudflare_cache_browser_ttl: 30
    cloudflare_cache_respect_origin_headers: true
    cloudflare_enable_minification: true
    cloudflare_enable_brotli: true
    cloudflare_enable_http2: true
    cloudflare_enable_http3: true

    # Monitoring
    cloudflare_logging_enabled: true
    cloudflare_health_check_enabled: true
    cloudflare_alert_enabled: true

  roles:
    - cloudflare_integration

  post_tasks:
    - name: Display Cloudflare Configuration Summary
      ansible.builtin.debug:
        msg: |
          Cloudflare Integration Summary:
          ================================
          Domain: {{ cloudflare_domain }}
          Plan: {{ cloudflare_plan }}

          Features Enabled:
          - DNS Management: {{ 'YES' if cloudflare_dns_enabled else 'NO' }}
          - WAF Rules: {{ 'YES' if cloudflare_waf_enabled else 'NO' }} ({{ cloudflare_waf_sensitivity_level }} sensitivity)
          - DDoS Protection: {{ 'YES' if cloudflare_ddos_protection_enabled else 'NO' }}
          - SSL/TLS: {{ 'YES' if cloudflare_ssl_tls_enabled else 'NO' }} ({{ cloudflare_ssl_tls_mode }})
          - Edge Caching: {{ 'YES' if cloudflare_edge_cache_enabled else 'NO' }}
          - Health Monitoring: {{ 'YES' if cloudflare_health_check_enabled else 'NO' }}

          Next Steps:
          ===========
          1. Run health check: /usr/local/bin/cloudflare-health-check
          2. View logs: tail -f /var/log/cloudflare/health-check.log
          3. Verify DNS records in Cloudflare dashboard
          4. Test WAF and DDoS protection with curl commands
          5. Monitor cache hit ratio and performance

---
# Advanced Example: Enterprise Security Stack

- name: Configure Enterprise Cloudflare Security
  hosts: localhost
  gather_facts: false
  when: false  # Disabled by default - uncomment to use

  vars:
    # High-security configuration for critical applications
    cloudflare_enabled: true
    cloudflare_domain: "secure.example.com"
    cloudflare_plan: "enterprise"

    # Stricter WAF
    cloudflare_waf_enabled: true
    cloudflare_waf_sensitivity_level: "high"
    cloudflare_waf_paranoia_level: 4
    cloudflare_waf_enable_bot_management: true
    cloudflare_waf_rate_limit_threshold: 50

    # Aggressive DDoS
    cloudflare_ddos_protection_enabled: true
    cloudflare_ddos_sensitivity: "high"
    cloudflare_ddos_rate_limit_threshold: 500

    # Strictest SSL
    cloudflare_ssl_tls_mode: "full_strict"
    cloudflare_ssl_tls_minimum_version: "1.3"

    # Longer cache
    cloudflare_cache_default_ttl: 3600
    cloudflare_cache_browser_ttl: 1440

  roles:
    - cloudflare_integration

---
# Example: API-Only Configuration

- name: Setup Cloudflare for API
  hosts: localhost
  gather_facts: false
  when: false  # Disabled by default - uncomment to use

  vars:
    cloudflare_enabled: true
    cloudflare_domain: "api.example.com"

    # DNS only
    cloudflare_dns_enabled: true
    cloudflare_dns_records:
      - zone: "api.example.com"
        record: "@"
        type: "A"
        value: "192.0.2.10"
        ttl: 300
        proxied: true

    # WAF with strict rate limiting for API
    cloudflare_waf_enabled: true
    cloudflare_waf_rate_limit_threshold: 1000
    cloudflare_waf_rate_limit_period: 1

    # SSL/TLS
    cloudflare_ssl_tls_enabled: true
    cloudflare_ssl_tls_mode: "full_strict"

  roles:
    - cloudflare_integration
