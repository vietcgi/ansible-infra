[kumomta_single_node]
wg-node1 ansible_host=wg-node1 ansible_user=ubuntu

[kumomta_cluster]
wg-node2 ansible_host=wg-node2 ansible_user=ubuntu
wg-node3 ansible_host=wg-node3 ansible_user=ubuntu

[kumomta_all:children]
kumomta_single_node
kumomta_cluster

[kumomta_all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_connection=ssh
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
