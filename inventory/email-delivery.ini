# Inventory for Email Delivery Setup
# REQUIRED VARIABLES: You must fill in the values below before running the playbook
# Email domain, server IP, and Let's Encrypt email are mandatory

[email_servers]
# Define your mail server(s) - replace with your actual hostname/IP
mail_server  ansible_user=ubuntu  ansible_host=YOUR_SERVER_IP_HERE

[email_servers:vars]
# ========== REQUIRED - You must provide these values ==========
# Your email domain name
email_domain=YOUR_DOMAIN_HERE

# Your server's public IP address
email_server_ip=YOUR_SERVER_IP_HERE

# Email for Let's Encrypt certificate registration
letsencrypt_email=admin@YOUR_DOMAIN_HERE

# ========== OPTIONAL - Use defaults if not specified ==========
# DKIM configuration
dkim_selector=default
dkim_key_size=2048

# DMARC configuration (defaults to postmaster@/security@ if not set)
# dmarc_policy=quarantine                          # Options: none, quarantine, reject
# dmarc_subdomain_policy=quarantine
# dmarc_percent=100
# dmarc_report_email=dmarc-reports@YOUR_DOMAIN_HERE
# dmarc_forensics_email=dmarc-forensics@YOUR_DOMAIN_HERE

# SPF configuration (additional domains to relay for)
# spf_include_domains=["sendgrid.net", "mail.other-domain.com"]

# KumoMTA delivery settings
# kumomta_max_delivery_attempts=5
# kumomta_max_retry_delay=86400
# kumomta_max_messages_per_minute=300

# Monitoring
# monitoring_enabled=true
# prometheus_alerts_enabled=true

[all:vars]
# Ansible connection settings
ansible_python_interpreter=/usr/bin/python3
ansible_user=ubuntu
ansible_become=yes
ansible_become_method=sudo
