# Inventory for Email Delivery Setup
# Configure targets for complete email server deployment

[email_servers]
# Example: your mail server host
# mail.example.com  ansible_user=ubuntu  ansible_host=192.0.2.1
# Or for your specific domain:
email_server ansible_user=ubuntu ansible_host=108.181.38.69

[email_servers:vars]
# Domain configuration
email_domain=vietcgi.nguoivietcali.com
email_server_ip=108.181.38.69

# DKIM configuration
dkim_selector=default
dkim_key_size=2048

# DMARC configuration
dmarc_policy=quarantine
dmarc_subdomain_policy=quarantine
dmarc_percent=100
dmarc_report_email=dmarc-reports@vietcgi.nguoivietcali.com
dmarc_forensics_email=dmarc-forensics@vietcgi.nguoivietcali.com

# SPF configuration (additional domains to include)
spf_include_domains=[]

# Let's Encrypt
letsencrypt_email=admin@vietcgi.nguoivietcali.com

# KumoMTA delivery
kumomta_max_delivery_attempts=5
kumomta_max_retry_delay=86400
kumomta_max_messages_per_minute=300

# Monitoring
monitoring_enabled=true
prometheus_alerts_enabled=true

[all:vars]
# Ansible connection settings
ansible_python_interpreter=/usr/bin/python3
ansible_user=ubuntu
ansible_become=yes
ansible_become_method=sudo
