---
# Idempotency Testing Framework
# Runs each deployment twice and verifies no changes on second run

- name: Idempotency Test - Wireguard Full Mesh
  hosts: wireguard_full_mesh
  gather_facts: true
  tasks:
    - name: First run - Deploy Wireguard
      ansible.builtin.include_role:
        name: wireguard_vpn
      vars:
        wireguard_topology: full_mesh
      register: first_run

    - name: Second run - Verify no changes (idempotent)
      ansible.builtin.include_role:
        name: wireguard_vpn
      vars:
        wireguard_topology: full_mesh
      register: second_run

    - name: Verify idempotency for Wireguard
      ansible.builtin.assert:
        that:
          - second_run.changed == false
        fail_msg: |
          Idempotency test FAILED for Wireguard!
          First run changed: {{ first_run.changed }}
          Second run changed: {{ second_run.changed }}
          Second run should have no changes.

    - name: Idempotency Test Result - Wireguard
      ansible.builtin.debug:
        msg: |
          ✓ Wireguard Full Mesh: IDEMPOTENT
          First run: {{ first_run.changed | ternary('CHANGED', 'UNCHANGED') }}
          Second run: {{ second_run.changed | ternary('CHANGED', 'UNCHANGED') }}
          Status: PASS

